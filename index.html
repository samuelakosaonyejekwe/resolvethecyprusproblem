<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyprus Strategy Board — game-theory decision support</title>
<meta name="description" content="A decision-support board for every stakeholder in the Cyprus question. Choose a move, see how each other player is likely to answer, and find the most sustainable path.">
<meta name="theme-color" content="#0f2a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cyprus Board">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <button class="brand" data-a="home" aria-label="Cyprus Strategy Board, choose stakeholder">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#b5652b"/><path d="M6 20c3-1 5-4 9-4 3 0 4-3 8-4l3-3-1 5c-2 1-3 4-6 5-4 1-8 3-13 1z" fill="#fff"/><circle cx="23" cy="22" r="2.2" fill="#fff" opacity=".85"/></svg>
    <span><b>Cyprus Strategy Board</b><small id="who">Decision support for every stakeholder</small></span>
  </button>
  <div class="top-actions">
    <span id="net" class="pill" title="Connection and data freshness"></span>
    <button id="installBtn" class="btn accent" data-a="install">Install app</button>
    <button class="btn icon" data-a="theme" aria-label="Switch light or dark theme" title="Light / dark">◐</button>
  </div>
</header>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<main id="view" tabindex="-1"><p class="loading">Setting up the board…</p></main>
<aside id="sheet" class="sheet" aria-live="polite"></aside>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<noscript><p style="padding:2rem">This tool needs JavaScript switched on to run its simulations.</p></noscript>
<script src="js/model.js" defer></script>
<script src="js/engine.js" defer></script>
<script src="js/live.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
