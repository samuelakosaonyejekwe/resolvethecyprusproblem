e: in tension with the 'no external personality' guardrail.","w":"","x":[],"b":[],"r":["Recognition leakage"],"m":[]},{"t":"NATO-Cyprus hybrid force and Euro-Med Defence Pact (alternative security model)","a":"RoC, Turkey, NATO, regional states","c":"security","s":"Transition the Turkish military presence into a Joint Peace Security Command (JPSC) with 50% Cypriot command and NATO observers; Turkish troops gradually reflagged as 'Stabilisation Force of the TCAR (SF-TCAR)' under Cypriot oversight; the TC region joins a Euro-Med Defence Pact including Cyprus, Greece, Italy, France, Egypt, Israel and Turkey. Note: contradicts the zero-foreign-troops end state in the Cyprus Security Compact sections.","w":"","x":[],"b":[],"r":["Keeps Turkish troops on the island under a new label"],"m":[]},{"t":"'Dual Sovereign Partnership Protocol' (DSPP) - non-EU-accession alternative for Turkish Cypriots","a":"RoC, TC administration, EU, UN","c":"legal","s":"An internationally guaranteed 'functional sovereignty' agreement: the RoC stays the recognised state and EU member; the TC administration governs the north as a non-EU protected autonomous federal region. Eight components: EU 'Associate Entity Status' (Greenland-like; customs union, Horizon, Erasmus+, health instruments without EP representation); a neutral UN/EU-monitored joint oversight body; a 'One Cyprus, Two Peoples, One Framework' compact; a permanent non-military security protocol (all foreign troops including Turkish and British phase out; neutral force or rotating guarantors such as Austria, Finland, Canada); cross-recognition of documents; a customs corridor via Limassol/Larnaca with revenue sharing and a joint aviation hub (e.g. Paphos); a shared sovereign wealth fund for gas/ports/customs revenue with fixed community ratios; a dual-zone property tribunal. Note: several items conflict with later red lines (SBAs unchanged, Ercan regularised, no guarantors).","w":"","x":[],"b":["EU-citizen-equivalent practical benefits without EU absorption"],"r":["Conflicts with the one-state guardrails"],"m":[]},{"t":"Cyprus Security Compact (CSC) with UN Transitional Security Mission","a":"","c":"security","s":"A multinational, rules-based, time-bound replacement for guarantor rights. The UN Transitional Security Mission (UNTSM/UNTSMC) runs 24-36 months (framework section: 36 months, annual review, renewable once for 12 months if both communities agree) with gendarmerie-style units from neutral EU states and policing teams from non-aligned states (e.g. Canada, New Zealand), commanded via a Joint Cypriot-UN-EU Board with no single-party veto. Tasks: monitor the freeze, seal/inventory heavy weapons, certify staged withdrawals, keep public order in mixed/sensitive zones, publish monthly scorecards and report quarterly to the UNSC; includes human-rights and property observers and drone/sensor monitoring.","w":"Mandate adopted within Phase 0 (90 days); deploys at T+0; scales down T+18-36; symbolic/light presence after T+36","x":[["Turkish Cypriots","Gets the 'something solid' they ask for without Turkish troops"],["UN","Finite mandate with sunset and metrics"],["Turkey","Assumed to accept replacement of guarantor role in exchange for commercial track"]],"b":["Stronger than paper, more legitimate than unilateral troops"],"r":["Mandate dilution at UNSC","Mission access denied"],"m":["Pre-wire the P5 with the initialled CSC text; snapback non-negotiable","Access denial pauses customs/aviation openings"]},{"t":"EU CSDP Rule-of-Law and Border Mission","a":"EU Council (PSC/COREPER), Member States","c":"security","s":"A Council Decision with OPLAN and force-generation sheet creates a mission that monitors borders/customs at the Green Trade Windows, mentors TC police to staffing benchmarks, mentors judiciary, keeps the acquis-benchmark scoreboard and cross-checks troop-exit data (manifests, exit stamps, port/airport records). It deploys Frontex-trained units for mixed patrols and ties Cyprus contingencies into EU mutual-assistance planning (Article 42.7 TEU).","w":"Decision in Phase 0 days 61-90; deploys T+0; lighter advisory mode after T+36","x":[],"b":[],"r":["Slow EU force generation"],"m":["Identify 3-4 neutral EU police/gendarmerie contributors early; readiness dates in OPLAN"]},{"t":"OSCE early-warning and monitoring grid with hotlines and mixed incident cells","a":"OSCE","c":"security","s":"Sensors, drones and satellite change detection for real-time monitoring; a hotline network linking canton police, national police, UN mission HQ and EU border offices; mixed incident-response cells (GC, TC, EU, neutral observers) with 24/7 logging and 48-hour incident notes. CSAP variant: 24/7 hotline north-south-Ankara-Athens-Nicosia-UN, weekly local risk-reduction meetings, body-cams for mixed patrols and mandatory incident-video disclosure within 72 hours.","w":"Deploys T+0; lower tempo after T+36","x":[],"b":["Deterrence by visibility"],"r":[],"m":[]},{"t":"Phased, dated, verified demilitarisation to zero foreign troops (with snapback)","a":"Turkey, Greece (matched non-SBA draw-down), verified by UN/EU/OSCE","c":"security","s":"T+0-6: force freeze, heavy weapons sealed and inventoried. T+6-18: unit-by-unit Turkish draw-down to zero from pre-agreed Order of Battle lists via designated corridors/ports/airfields, matched by Greek non-SBA draw-down. T+18: full exit certified - no personnel, no rotation, no 'advisors', heavy weapons removed or destroyed with serial reconciliation, all barracks/depots decommissioned, ordnance cleared, sites handed to RoC policing. T+18-36: UN scales down; only light, defensive RoC Armed Forces and the UK SBAs remain. Any breach triggers funds freeze and UNSC/EU review automatically.","w":"T+0 to T+36","x":[["Turkey","Withdraws because each tranche unlocks ports/airspace, utility contracts and tenders"],["RoC","Gets verified end of foreign troops"]],"b":[],"r":["Last-minute 'technical' non-exit (small contingent kept as 'guards')"],"m":["Certification requires zero military personnel","EU cross-checks border data; OSCE sensors/satellite","Automatic snapback with no political pre-clearance"]},{"t":"T+0 force freeze ('no surprises' order)","a":"All military/police formations; UNTSM lead, EU inspectors, OSCE sensors","c":"security","s":"Island-wide operational standstill: no new deployments, exercises or forward engineering. H-0 parallel freeze orders acknowledged by all units; H-6 joint UN-EU cold spot checks at depots; H-24 heavy weapons sealed with tamper-evident seals, GPS tags and serial photos; H-48 shared Force Posture Map v1.0 filed to the mission Joint Ops Centre; H-72 public Freeze Compliance Bulletin #1 with heat-map and score.","w":"First 72 hours after certification of dual Yes","x":[],"b":[],"r":["Last-minute force movements"],"m":["H-0/H-6 surprise spot checks plus satellite tasking","Any unauthorised movement above company size or broken seal freezes Day-1 incentives and triggers a UNSC/EU PSC briefing within 24 hours"]},{"t":"Triple-lock verification and Joint Verification Board certificates","a":"UN (security), EU (economic/acquis), OSCE (early-warning/arms); RoC and TC seats","c":"information","s":"Each phase is gated by three independent bodies each issuing a green/amber/red card so no single body controls compliance data. A Joint Verification Board (UN chair; EU/OSCE/RoC/TC seats) issues a single T+6 Certificate only if all four gates are green/amber; at T+18 a Phase-3 Certification Dossier (baseline inventory, exit manifests, geo-tagged imagery) is compiled; from T+36 a joint quarterly 'Green Certificate' is required ('no certificate = no trade basket').","w":"","x":[],"b":["Credible commitments; removes excuses"],"r":[],"m":[]},{"t":"Joint Threat Assessment Cell (JTAC)","a":"RoC with mixed GC/TC staffing and UN/EU liaisons","c":"security","s":"A permanent island-wide intelligence fusion centre monitoring terrorism, paramilitary build-up, cross-border crime, violent extremism, trafficking, maritime safety and hybrid threats; can trigger emergency parliamentary sessions if thresholds are breached; receives property-fraud referrals; reports to both communities' leaderships and Parliament.","w":"Operational at T+0-6; permanent","x":[],"b":["Removes security 'excuses' to block civilian policy"],"r":[],"m":[]},{"t":"Island-wide arms registry and buy-back","a":"RoC, canton police, mixed inspection teams; EU/UN funding","c":"security","s":"A nationwide modern arms registry within 12 months, mixed inspection teams, a voluntary buy-back (with amnesty) for illegal weapons funded by EU/UN or the incentives package, and heavy penalties for unregistered arms.","w":"Registry within 12 months; complete by T+18-36","x":[],"b":[],"r":[],"m":[]},{"t":"TC-commanded canton police under national standards","a":"TC Canton; EU CSDP mentors; RoC standards bodies","c":"security","s":"Local police recruited locally and commanded by Turkish Cypriots, bound to national professional standards, unified criminal codes and integrated databases, with complaints mechanism, body-cam policy and audit trails. All new hires pass an RoC-standard curriculum plus EU-mentored modules (use of force, civil liberties, community policing). An Independent Police Conduct Office handles complaints with appeal to the national Ombudsman/Charter Court; own training academy and international mentoring for up to 10 years (CSAP).","w":"70% of gazetted posts filled by T+6; full strength by T+18-36","x":[["Turkish Cypriots","Policing by their own officers reduces the claimed need for foreign troops"]],"b":[],"r":[],"m":[]},{"t":"Cyprus Stability & Assurance Package (CSAP) - slower, civilian-led security variant","a":"UNSC, OSCE-style mechanism, RoC","c":"security","s":"A variant schedule: months 0-18 freeze force levels and draw down heavy equipment with joint UN inventory; months 18-36 cut foreign troops by more than 80% into a single temporary cantonment; full exit by months 36-48. Assurance is civilian: a UN-mandated Civil Security Support Mission (unarmed observers, rapid forensics, border advisers, small gendarmerie-type quick-reaction capability from neutral contributors) for 5 years with one 3-year extension; an OSCE-style Incident Prevention and Response Mechanism; JTAC; Charter Court (e.g. 6/7 judges to amend the Charter); minority veto only on identity-core matters; a 'North CSGA Police' with international mentoring for 10 years. Note: timeline conflicts with the T+18 full-exit schedule used elsewhere.","w":"0 to 36-48 months; mission 5 (+3) years","x":[],"b":[],"r":[],"m":[]},{"t":"Long-term security embedding","a":"RoC, EU, Turkey","c":"security","s":"Cyprus joins the EU Civil Protection Mechanism for disasters and hybrid threats; a technical-only Cyprus-EU-Turkey Maritime Coordination Forum avoids accidental escalation; regular tri-community security exercises (GC, TC, UN/EU forces).","w":"Post T+36","x":[],"b":[],"r":[],"m":[]},{"t":"Voluntary Withdrawal for Value (VWV) Accord","a":"Turkey, EU, RoC","c":"diplomatic","s":"A sequenced, verified Turkish troop draw-down linked to credit-worthy value: targeted EU Customs Union upgrade protocols for Turkey, green-transition investments in southern Turkey and multi-year public works contracts open to Turkish firms, on a 'verify-before-benefit' ladder with OSCE/UN composite verification and snap-back.","w":"6-, 18- and 36-month withdrawal tranches mapped to benefit tranches","x":[["Turkey","Dignified exit with economic upside at home"],["Greek Cypriots","Real demilitarisation with verification"],["Turkish Cypriots","Normalisation and end of isolation"],["EU","Stability corridor in the East Med"]],"b":[],"r":[],"m":[]},{"t":"Demilitarised island with guaranteed, integrated policing","a":"RoC, UN-EU monitoring mission","c":"security","s":"Full demilitarisation; integrated police with a 30/70 TC/GC intake for the North for 10 years; UN-EU monitoring mission with sunset clause; a civilian oversight board with equ ned Turkish component (ledger item)","a":"RoC, Turkey","c":"security","s":"The TC incentive ledger lists a 'JPSM-C' (acronym not defined in the text) with a defined Turkish component and reinforcement rights under RoC sovereignty as credible protection. Negotiation Track A is to 'define JPSM-C footprint' and write the trigger-map. Note: undefined and inconsistent with the zero-troops/no-guarantor design.","w":"","x":[],"b":[],"r":["Contradicts no-guarantor red line"],"m":[]},{"t":"Ercan regularised as an RoC/ICAO-compliant airport (lawful direct flights)","a":"RoC Department of Civil Aviation; airport operator; ICAO/UN/EU observers","c":"technology","s":"Night of certification: RoC Civil Aviation issues an Order of Assumption of Authority, an AIP Supplement and NOTAM; an interim operator agreement covers screening, badging and liability. D1-3 security and safety audits (access control, baggage screening, runway, ARFF category, nav-aids) and customs/immigration desks tested against RoC/EU databases; D4 proving flights; D5-7 soft launch of first scheduled international services with limited slots. Branding and administration reflect RoC authority.","w":"Same week as T+0 (roadmap section says first flights within 60 days)","x":[["Turkish Cypriots","Delivers their number-one ask"]],"b":["Day-one dignity under one sovereignty"],"r":["Airport non-compliance"],"m":["Audit gate before first commercial departure","Any sub-ICAO finding or refusal of RoC oversight suspends direct flights"]},{"t":"Green Trade Windows and Famagusta customs house","a":"RoC Customs; EU monitors","c":"economic","s":"Standard RoC/EU customs processing switched on at Famagusta and Nicosia so goods move lawfully without double-handling via Turkish customs: EU Customs Code software and risk profiling, staffed SPS/phyto lanes, e-declarations portal, unique movement reference numbers and a real-time transparency board (clearance time, rejection rates). Windows expand as compliance rises and gradually shi ots), UN (witnesses first overflights/port calls) and OSCE (harassment monitoring).","w":"Stage 1 at T+0 (implemented/verified by T+6); Stage 2 after T+6 or at T+18; full opening T+36 (the document is inconsistent on timing)","x":[["Turkey","Shipping/aviation efficiencies and fees"],["RoC","Shorter routes, lower costs"]],"b":[],"r":["Partial openings/administrative drag","Arbitrary denials or harassment"],"m":["Amber: fee escrow (dues accrue but are not distributed)","Red: revert to pre-Stage-1 regime for the offending channel and notify UNSC/EU"]},{"t":"EEZ de-risking: joint technical panel with revenue escrow","a":"RoC, Turkey, TC Canton, EU observers","c":"energy","s":"A joint technical panel schedules geophysical survey windows and places disputed revenues in escrow to fund Turkish-Cypriot development/compensation; meets quarterly.","w":"Panel cooperation from T+6; escrow account functioning by T+18","x":[],"b":[],"r":[],"m":[]},{"t":"Conditional, capped tender access for Turkish firms","a":"RoC procurement, SDZA","c":"economic","s":"Turkish contractors and service firms may bid competitively on SDZ/infrastructure tenders only once security benchmarks are verified, under caps to avoid dominance, EU-style open procurement and compliance screening; preferential access opens at T+18 after full exit. Performance bonds from Turkish banks meeting RoC/EU prudential rules accepted.","w":"Initial access T+0-6; preferential access T+18-36","x":[],"b":[],"r":["Caps and compliance rules still undefined (open question)"],"m":[]},{"t":"'Green-only' clause: RoC non-opposition to a narrow EU-Turkey trade basket","a":"RoC inside the EU Council","c":"diplomatic","s":"At T+36 the RoC supports or abstains on a small, pre-annexed, technical and reversible basket (customs/standards facilitations for defined product lines, selected services facilitation, aviation/ports micro-tweaks) only if every KPI on the 'All Green' dashboard has been green for a sustained window (e.g. prior 6-12 months) and a joint quarterly Green Certificate is issued. Any KPI turning red suspends the posture immediately; a 30-day cure window applies. Elsewhere the document places non-opposition to narrow customs-union updates after T+18 green lights.","w":"T+36 (T+18 in the incentive ledger/verification gating)","x":[["Turkey","Medium-term EU dividends depend on Cyprus compliance, not separate bargains"]],"b":["Preserves RoC leverage into steady state"],"r":["Basket creep"],"m":["Pre-annexed list with sunset dates and snapback hooks"]},{"t":"EU visa facilitation and funding tranches as compliance rewards","a":"EU","c":"diplomatic","s":"The EU front-loads funding for the Property Fund and SDZ infrastructure, opens infrastructure tranches only after verified withdrawals, and rewards Turkish compliance with visa facilitation after T+18; long-term EU funding is released at T+36.","w":"T+18 and T+36","x":[],"b":[],"r":[],"m":[]},{"t":"Phase-0 five green gates and attestation bundle (bundled dependency)","a":"RoC President, TC leader, Turkey (letter of assurances)","c":"diplomatic","s":"Within 90 days five texts are initialled as one 'attestation bundle' with a Joint Minute: CSC Concept & Terms, EU CSDP Mission Concept, Referendum Framework Bill, CPF Term Sheet, and 1-2-page T+0 Implementation Protocols. The UNSC mandate, EU CSDP decision, referendum law and CPF term sheet are mutually contingent: failure of any one automatically holds the others. UN/EU publish a monthly Green/Amber/Red bulletin, and snapback placeholders pre-name which benefits pause.","w":"8-21 zero-drafts; 22-35 initialling; 36-60 tabling; 61-75 adoptions and escrow; 76-90 force-generation lists and scorecard #1","x":[],"b":["Removes fear of moving first","Promises become adopted decisions, gazetted laws and funded accounts before anyone takes risk"],"r":["UNSC mandate dilution","Slow EU force generation","Domestic pushback on referendum rules","CPF credibility gap"],"m":["Pre-wire P5","Early contributor identification","Equal-time/finance clauses and observers","Escrow confirmations in voter guide"]},{"t":"Referendum law and strategy (single framework, two ballots)","a":"RoC parliament and TC legislative authority; independent Elections Commission; international observers","c":"legal","s":"Simultaneous referenda with identical question framing, a fixed simple threshold with no moving goalposts, equal media time and campaign-finance caps, international observation, results published within 24 hours and final certification within 48-72 hours. A Yes automatically enters the reunification legal package and a pre-drafted Transitional Measures Ordinance activates T+0 orders. The voter guide cites the attestation bundle, resolution/decision numbers, escrow confirmations and named first-tranche amounts so voters see the scaffolding is real - avoiding 'vote first, details later'.","w":"Law gazetted within Phase 0; vote = T+0","x":[],"b":[],"r":["Either referendum fails or is credibly tainted"],"m":["T+0 package does not trigger; Day-1 dividends stay locked","Chain-of-custody logs, precinct-level results"]},{"t":"Pre-negotiation foundations: written mandates, quiet trilateral talks, CBMs and six Technical Working Groups","a":"RoC President, TC leadership, Turkey; UN Special Envoy + EU Special Representative; UK side channel","c":"diplomatic","s":"Secure written mandates from RoC, TC leadership and Turkey accepting a one-state framework, no permanent guarantor and benchmarked implementation, with parallel EU/UNSC/OSCE endorsement of the CSC concept. Quiet RoC-TC-Turkey talks under a neutral facilitator; UK side channel on SBAs; preliminary EU agreement on CIEA and the Protocol-10 roadmap. CBMs: open Haspolat/Akracaga with extended hours, TC athletes in RoC delegations, joint technical inspection of Ercan, freeze on new 'facts on the ground'. Six TWGs: constitutional/governance; security/CSC; property; economic/CIEA; infrastructure/connectivity; public narrative/education.","w":"0-6 months","x":[],"b":[],"r":[],"m":[]},{"t":"Five-track negotiation roadmap and Reunification Treaty","a":"RoC, TC leadership, Turkey, EU, UN","c":"diplomatic","s":"Eighteen months to signature across Track A guarantees/security, Track B constitutional/legal (TC-SGT Basic Law + RoC amendments), Track C economic package (water/energy/ports/air annexes, CDB-N capitalisation, SEZ statutes), Track D property (tribunal statute, funding, pilot zones) and Track E public consent (dual referenda). Output: a Reunification Treaty with constitutional amendments, codified parity and vital-interest protections, CSC mandate annex and funded economic/property provisions, backed by a binding UNSC resolution, EU Council decision on mutual assistance and OSCE verification framework; RoC-Turkey commercial MoUs with milestone triggers; international donor conferences for the Property Fund and SDZs.","w":"6-18 months","x":[],"b":[],"r":[],"m":[]},{"t":"Interlinked escrow accounts","a":"Independent trustees; UN/EU joint verification notes release funds","c":"economic","s":"Funds for each phase are pre-deposited and released automatically on certified milestones. Phase 1: Property Fund Tranche A, SDZ early works and utility interconnect pre-payments are released only when the UN/EU note says 'freeze compliant, missions deployed, Ercan audited'. T+6: port dues, aviation fees and SME finance windows sit in escrow until the T+6 Certificate. Amber status lets openings proceed while fees accrue undistributed; any later breach freezes escrows.","w":"","x":[],"b":["Makes rewards credible and penalties automatic"],"r":[],"m":[]},{"t":"Automatic, targeted snapback with cure windows","a":"Written into the UNSC mandate, EU decision and contracts; triggered by UN/EU/OSCE findings","c":"diplomatic","s":"Any verified breach automatically reverts benefits to the last certified phase, freezes escrows and triggers UNSC/EU review with no political pre-clearance; reports go public within 72 hours. Sanctions are targeted: only the defector's benefits pause (its trade lane, tenders, airport privileges; a single facility's origin certificate), cooperators keep theirs, and already-paid property awards and issued SME Passes remain valid. Graduated green/amber/red rules with remediation plans (14 days at T+6; 30-day cure at T+36).","w":"","x":[],"b":["Removes incentive to torpedo the process"],"r":["Disputes over attribution of a breach"],"m":["Pre-agreed Incident Matrix grading triggers and measures"]},{"t":"Public scorecards, dashboards and the 'All Green' dashboard","a":"UN/EU/OSCE with RoC/TC countersignature","c":"information","s":"Monthly UN/EU bulletins on gate status in plain language; a weekly Phase-1 dashboard (freeze compliance %, sealed items, hotline incidents, flights, teams admitted, customs throughput); monthly trilingual T+6 scorecards; quarterly benefit scorecards per stakeholder; quarterly property and benchmark dashboards; from T+36 monthly technical bulletins, quarterly summaries and an annual 'Unity Review' to both legislatures.","w":"","x":[],"b":["Reputational pressure; counters rumours and 'they tricked us' narratives"],"r":[],"m":[]},{"t":"Phase-5 consolidation and international embedding","a":"RoC, canton, EU, UN, OSCE, Turkey","c":"diplomatic","s":"Charter Court constitutionalises autonomy/sovereignty protections; annual Unity Review tabled in the RoC parliament and TC Canton Assembly; EU, UN and OSCE sign a tripartite compliance memorandum; a joint RoC-TC Canton-Turkey annual economic summit; curricula fully updated; regular cultural, sporting and municipal exchanges.","w":"Post T+36","x":[],"b":[],"r":[],"m":[]}],"games":[{"n":"Multi-player iterated cooperative game with finite phased horizon (tit-for-tat with enlargement)","i":"Cooperation must dominate in every subgame, so each round's reward and punishment are made automatic and visible rather than political."},{"n":"Mutual incentive cycle (three escalating rounds)","i":"Stakes rise as trust accumulates, so early defection is cheap to absorb and late defection is very costly to the defector."},{"n":"Illustrative payoff matrix - Round 2 (T+6)","i":"Universal cooperation strictly dominates defection for every player provided verification and snapback are trusted."},{"n":"Security-guarantee iterated coordination game with Payoff Escalation Mechanism","i":"Targeted sanction: a lone defector loses big while the others keep partial gains; multiple defections mean mutual loss (re-freeze, isolation, sanctions), so no one profits from torpedoing the process."},{"n":"Payoff escalation ladder by milestone","i":"Verification, not goodwill, is the trigger; rewards are escrowed and released only on certification."},{"n":"Multi-stage game tree (T+0, T+6, T+18, T+36)","i":"Makes the cooperative path visibly more rewarding and the defection path immediately costly."},{"n":"Commitment devices and assurance mechanisms (no-first-mover problem)","i":"The plan 'solves for trust': law, money and visible daily-life upgrades are fused into a clocked, refereed game where cooperation pays now and defection hurts immediately."}],"phases":[{"p":"Pre-negotiation foundations (roadmap 'Phase 0')","w":"0-6 months","a":["Written mandates from RoC President, TC leadership and Turkey for one-state framework, no permanent guarantor, benchmarked implementation","EU/UNSC/OSCE endorsement of the CSC concept","Quiet trilateral talks via UN Special Envoy + EU Special Representative; UK side channel","Preliminary EU agreement on CIEA and Protocol-10 roadmap","CBMs: Haspolat/Akracaga crossing with extended hours, TC athletes in RoC delegations, joint Ercan inspection, freeze on new facts on the ground","Six Technical Working Groups"],"g":["Mandates signed","TWGs operating"]},{"p":"Negotiations and legal framework (roadmap 'Phase 1')","w":"6-18 months (18 months to signature)","a":["Tracks A-E: security, constitutional, economic, property, public consent","Finalise Reunification Treaty, constitutional amendments, CSC annex","EU-RoC-TC CIEA agreement; RoC-Turkey commercial MoUs with milestone triggers","Map troop withdrawal sequence and matched Greek reductions; procure drones/monitoring tech","Outreach campaign, town halls, donor conferences","Draft referendum question; arrange observation mission"],"g":["Referendum-ready package"]},{"p":"First 180 days (do-now actions)","w":"Days 0-180","a":["Mutual freeze on new facts on the ground; open data rooms (property, utilities, budgets)","Draft TC Basic Law + RoC constitutional annex in parallel with CSC concept of operations","Pre-contract water/energy/ports/air packages with pricing, metering and milestone triggers","Capitalise CDB-North Window (EUR 2-3bn/7 yrs); choose SDZ sites; publish first procurement notices","Launch 'One State, Two Homes' narrative; pair-narrative history pilots","CIEA launch checklist: publish Rulebook, stand up CIEA Authority/OSBP/Green Trade Windows, accredit labs, switch on SPS corridors, issue first SME Passes, pilot SDZ incentives"],"g":[]},{"p":"Phase 0 - lock rules, referees and money","w":"First 90 days after agreement","a":["Days 8-21: zero-drafts of CSC, CSDP concept, referendum bill, CPF term sheet","Days 22-35: political initialling of the five-text attestation bundle (Turkey gives separate letter of assurances on non-interference)","Days 36-60: table UNSC resolution; EU Council process; introduce referendum bills; indicative CPF commitments into escrow","Days 61-75: UNSC and EU adoptions; parliaments pass referendum laws; CPF escrow accounts opened","Days 76-90: UN/EU force-generation lists, Elections Commission rules, donor notes of commitment, Phase-0 scorecard #1"],"g":["Gate 2: UNSC resolution adopted as drafted with tasks and snapback intact; UN letter of assist","Gate 3: EU Council Decision + OPLAN + sufficient force pledges","Gate 4: referendum law(s) gazetted, Elections Commission resourced, observer MoUs signed","Gate 5: CPF term sheet initialled, escrow opened with minimum coverage for first payout tranche, board appointment path agreed","Bundled dependency: failure of any one holds all; only all-green moves to T+0"]},{"p":"Phase 1 - Referenda and T+0","w":"Referendum night to Day 7 (missions' first 30-day report)","a":["Simultaneous referenda; same-night observer statement; final certification in 48-72 hours; Transitional Measures Ordinance countersigned","Force freeze: H-0 orders, H-6 spot checks, H-24 heavy-weapons seals, H-48 Force Posture Map, H-72 Compliance Bulletin #1","UNTSM, EU CSDP mission and OSCE grid deploy; hotlines live","Ercan: D0 Order of Assumption of Authority + AIP/NOTAM; D1-3 audits; D4 proving runs; D5-7 first international flights","Sports (D0-7) and education (D0-14) integration orders","Famagusta customs house / Green Trade Windows live D0-5","TC Assembly sworn, interim executive, parity ministers, Charter Court judges, JTAC","New crossings opened; initial tariff relief; Turkey Stage-1 shipping/overflight opening (per verification-gating table)"],"g":["Three linked gates before any sweetener opens: (1) dual Yes certified, (2) force freeze verified, (3) mission access granted","Verification gates: freeze confirmed; all heavy weapons sealed and inventoried; Green Trade Windows EU-compliant; Ercan operating under RoC/ICAO","Escrow release (Property Fund Tranche A, SDZ early works, utility pre-payments) only on UN/EU note 'freeze compliant, missions deployed, Ercan audited'","Snapback: movement above company size or broken seal freezes Day-1 incentives; mission access denial pauses customs/aviation openings; sub-ICAO finding suspends flights; referendum failure/taint means nothing triggers"]},{"p":"Phase 2 - T+6","w":"Month 6","a":["First unit-by-unit Turkish withdrawals from Order of Battle lists, matched by Greek non-SBA draw-down","TC Canton Police reach 70% of gazetted posts with 100% of hires trained","Stage-1 ports/airspace opening implemented (Turkish NOTAM/AIP, port access for RoC-flag ships; RoC facilitation for Turkish carriers)","SME Pass portal live; sector pilots in Morphou and Famagusta","Expand Green Trade Windows; grid integration begins with net-metering; EEZ joint technical panel starts; pilot Zone 1 opens; extended crossing hours"],"g":["Security gate: withdrawals vs schedule - green met; amber slippage <10% with 14-day remediation and escrowed openings; red >=10% or deception = snapback and UNSC/EU review","Governance gate: police 70% staffed - amber 65-69% (limited SME issuance); red <65% (pause SME Passes and ports/airspace escalation)","Connectivity gate: Stage-1 - amber = fee escrow; red = revert offending channel to pre-Stage-1","Economy gate: SME Passes - amber = caps; red = suspend new Passes","Also: no unilateral changes to property or territorial control; no significant security violations","Single T+6 Certificate from the Joint Verification Board (UN chair) only if all four gates green/amber; all T+6-linked fees/funding in escrow until issued; later breach snaps back to last certified phase"]},{"p":"Phase 3 - T+18 (the hinge)","w":"Month 18","a":["Full Turkish troop exit: zero personnel, weapons removed/destroyed with serial reconciliation, sites decommissioned and handed to RoC policing; mirror Greek draw-down","T+18 acquis basket switched on by module (justice/policing, selected market supervision, SPS corridors, AML/CFT basics)","Independent Property Commission issues decisions; first 1,000 cases decided; payouts via KYC/AML-compliant rails; appeals chamber functional","Stage-2 ports/airspace normalisation; EEZ revenue escrow functioning; arms registry complete","Unlocked: preferential SDZ tender access for Turkish firms, EU-wide recognition of northern universities, property quick-pay, joint RoC-Turkey energy/utility contracts, RoC support for narrowly defined EU-Turkey trade facilitation (per verification-gating table), EU visa facilitation for Turkey"],"g":["Triple-lock: UN, EU and OSCE each issue a green card; Phase-3 Certification Dossier; public monthly summary","Sequence Security -> Law -> Money: acquis modules only after exit certified; property disbursements at scale only when legal benchmarks are green","EU Benchmark Scorecard: agreed T+18 module set green; amber items have action plans","Snapback: any re-insertion or hidden cache freezes new benefits automatically; if demilitarisation certification slips new property disbursements pause (paid awards unaffected)"]},{"p":"Phase 4 - T+36","w":"Month 36","a":["UN mission shrinks to advisory/verification footprint (quarterly notes, rapid-reaction liaison, mixed incident board)","EU CSDP in lighter advisory mode; OSCE grid at lower tempo; JTAC permanent","RoC non-opposition to pre-annexed narrow EU-Turkey trade basket if all green","Unlocked (per verification-gating table): full integration of the North into EU customs/VAT, end of transitional tariffs, final opening of all maritime/air links, long-term RoC-Turkey commercial frameworks; customs/VAT integration plan drafted"],"g":["'All Green' dashboard for a sustained 6-12-month window: foreign troops = 0; no heavy-weapons breaches since T+18; arms registry >=95%; gun crime below baseline; TC police at full strength; Charter Court operational with no backlog; parity functioning with no boycotts; VIV used only lawfully; Green Trade Windows without anomalies; SDZ tenders transparent; Property Fund paying on schedule; grid stable; Stage-2 ports/airspace still in force; EEZ panel quarterly and escrow working; no harassment of survey vessels","Joint quarterly Green Certificate - no certificate, no trade basket","Snapback and cure: any KPI amber->red suspends the basket immediately; 30-day cure window; otherwise suspended until next quarterly assessment","Paper trail prepared beforehand: Verification Annex, Trade Basket Annex, Public Dashboard Protocol, Incident Matrix"]},{"p":"Phase 5 - consolidation and international embedding","w":"Post T+36; CIEA convergence to year 15-20","a":["Charter Court constitutionalises protections; annual Unity Review","EU/UN/OSCE tripartite compliance memorandum; annual RoC-TC Canton-Turkey economic summit","Curricula updated; cultural/sporting/municipal exchanges","CIEA years 3-10 scale-up, years 10-20 benchmarked convergence and VAT/customs integration once compliance, enforcement and revenue-sharing triggers are met","Property appeals taper, Fund winds down, residual cases to ordinary courts"],"g":["CIEA graduation trigger levels (still an open policy question)"]},{"p":"Win-Win strategies execution order (alternative package)","w":"18-36 months","a":["Framework deal (OSTH, bicameral power-share, belonging guarantees) signed together with the VWV roadmap","Launch RDT, Property Bonds, policing transition","Open Green Channel+ trade and North First procurement","Stand up JOGC; schedule ports/airports","Begin mixed-cities pilots and education charter","Seat Truth & Reconciliation Panel; progress redeployments"],"g":["Reviews at 18 and 30 months with snap-back/snap-forward clauses"]},{"p":"CSAP alternative withdrawal clock","w":"Months 0-48","a":["Months 0-18: freeze force levels, draw down heavy equipment, joint inventory with UN","Months 18-36: reduce foreign troops by >80%, consolidate to one temporary cantonment","Months 36-48: full exit, facilities transferred, long-term civil security instruments activated"],"g":["Civil Security Support Mission mandate 5 years + one 3-year extension"]}]},{"title":"Cyprus–U.S. Strategic Leverage Blueprint: A Non-Military Roadmap (August 2025)","thesis":"Assuming Turkey refuses to withdraw from northern Cyprus despite incentives, the Republic of Cyprus should make the United States its main lever by giving Washington tangible, exclusive-feeling strategic, energy, financial and intelligence stakes in Cyprus so that any threat to Cyprus becomes a threat to U.S. assets and balance sheets. The U.S. then applies non-military, multi-domain, 'sanctions-lite but persistent', reversible pressure on Ankara (export controls, targeted sanctions, IMF/G7 conditionality, occupied-territory legislation, defence-industrial realignment, a Mediterranean Stability Bloc, transparent public diplomacy) until the occupation costs more than it yields. Every stick is paired with a face-saving off-ramp: a UN-registered Phased Withdrawal Protocol over 3–5 years (Milestones A–E) verified by a UN/OSCE/EU triad, with escrowed rewards (Reunification Trust Fund of EUR 6–8bn, a Southeast Türkiye Development Facility, sanctions relief, SME credit lines, EU technical talks) and automatic snap-back if milestones slip. Guardrails are no kinetic escalation, no permanent NATO rupture, no pushing Turkey into Russia/Iran dependency, and no humiliation narrative. All Cypriot concessions to the U.S. are meant to be time-bound, revenue-positive, EU-law compatible and reversible, protected by a 'Bulwark Annex' of red lines, escrow, audits and arbitration. Author: Samuel Akosa Onyejekwe (Policy Analyst / Mechanical Engineer, Limassol); a project proposal (Doc ID CY-MOD-MOI-CIS-NSC-005, Rev 00) addressed to Cyprus's Ministries of Interior and Defence, the Cypriot Intelligence Service and the National Security Council.","strategies":[{"t":"Lock in U.S. commitment via a Cyprus–U.S. Strategic Security & Economic Partnership (SSEP)","a":"Republic of Cyprus (Leverage Cell chaired by NSC head) with U.S. NSC/State/Defence/Treasury/Energy/Commerce/intelligence community","c":"security","s":"Cyprus proposes a stack of binding and quasi-binding instruments rather than one mega-treaty: DCA (20 yrs, renewable in 5-yr increments, 2-yr termination notice), SOFA, ACSA (10 yrs), GSOMIA (15 yrs, 48-hour breach response), Priority Access & Use Agreement (20 yrs), Energy & Infrastructure Participation Agreement (20 yrs first-call rights), Pre-positioning & Resilience MoU (non-lethal, 10 yrs), Intelligence & Maritime Surveillance Annex, optional ship-rider/VBSS MoU and NGA geospatial arrangement. It grants rotational 'exclusive joint-use' of naval/air facilities with guaranteed berths, runway slots and surge rights, U.S.-priority access to logistics/energy hubs, and a joint maritime watchfloor fusing radar, AIS, satellite ISR and civil aviation feeds. In return Cyprus formally asks ('the price') for an executive determination that the north is occupied territory, a Treasury banking advisory, a ready tiered sanctions tool, a defence tilt, congressional support for a Reunification Trust Fund, and public messaging, captured in a Side-Letter of Assurances. Access Annex A (ports): Limassol Berths 6 and 7 (draft >=15 m, 300 m quay, 10 days/month), Larnaca Berth 3 (12.5 m, 250 m, 5 days/month), Vasilikos–Mari LNG-capable berth (14 m, 220 m, 5 days/month), 24-hour vacate in contingency, 11 kV shore power. Annex B (air): Larnaca Runway 04/22 (3,000 m, up to 4 sorties/week, Apron C four medium slots), Paphos/Andreas Papandreou Runway 11/29 (2,700 m, up to 8 sorties/week, Apron Bravo three heavy slots), Troodos UAV site (1,200 m runway, two MQ-9-class hangars); 60 min emergency / 3 h routine notice, 30 min in contingency; 50/50 cost-sharing of upgrades; 5-year review.","w":"Week 0–2 negotiating machine; Week 2–6 site mapping; Week 4–10 legal instruments; Week 6–12 joint-use model; Week 8–16 logistics/energy quid pro quo; Week 10–24 watchfloor; Week 12–20 cost-sharing. Milestones: M1 Month 3 term-sheets initialled; M2 Month 6 DCA/SOFA/GSOMIA signed; M3 Month 9 phase-1 upgrades and watchfloor IOC; M4 Month 12 first pre-positioning lots, ISR FOC, energy rights formalised.","x":[["Turkey","Rhetoric and air/naval posturing; expected to see that damaging Cyprus now directly harms U.S. interests"],["Cypriot public","Pushback against a 'foreign base'"],["Non-U.S. bidders / EU","Procurement complaints"],["United Kingdom","Concern about overlapping authority with SBAs"],["United States","Provides FMF / Section 333 funds, priority Excess Defence Articles (radars, counter-UAS, patrol craft upgrades), aligned Treasury/Commerce compliance posture, DFC/EXIM credit windows"]],"b":["Cyprus becomes a permanent U.S. Mediterranean anchor; threats to Cyprus are perceived as threats to U.S. assets","Port/airfield upgrades, jobs, scholarships/training, emergency-response capacity","U.S. gains logistics resilience, allied energy security, undersea-cable protection, presence without Turkish permission"],"r":["Domestic optics of 'foreign base'","EU procurement challenge","UK/SBA sensitivities","Turkish retaliation","Cyber intrusion on watchfloor"],"m":["'Rotational presence' language, cap permanent staff, publish economic benefits, parliamentary oversight visits","Lawful use of security exemptions; define 'first-call' as early engagement not sole-source","Deconfliction MoU and joint SAR exercises with UK","U.S. ship visits and ISR presence plus an open off-ramp narrative","Zero-trust design, continuous monitoring, red-team exercises, quarterly audits","Sovereignty clauses: all facilities remain Cypriot-owned; Cyprus keeps external perimeter and audit rights"]},{"t":"Embed Cyprus in U.S. Indo-European energy corridors","a":"Cyprus (Ministry of Energy, new Corridor Delivery Authority) with U.S. State/Energy/Treasury, DFC, EXIM, U.S. energy majors","c":"energy","s":"Sign a government-to-government Bilateral Corridor Compact designating priority infrastructure (Vasilikos LNG or FLNG, FSRUs, subsea pipelines, interconnectors), pre-qualified priority companies, New York/English governing law, and national-security clauses for a coordinated response if the corridor is threatened. A lean Corridor Delivery Authority (with EU observers) runs tenders; upstream is locked to U.S. operators via time-boxed first-call rights and farm-downs; midstream is two-track (LNG-first Track A; staged pipeline Track B toward Greece/Italy at 8->16->24 bcm/yr, with tie-ins for Israeli/Egyptian gas). A Cyprus–U.S. Master Offtake Vehicle signs SPAs, books capacity and charters ships, with 60–70% of capacity long-term contracted and 30–40% spot. Financing (DFC/EXIM, EIB, Energy Stability Bonds, political-risk and war-risk insurance) makes the corridor 'too big to fail' for the U.S., so the occupation becomes the binding constraint Washington must solve; FIDs are stage-gated to Turkish drawdown milestones.","w":"Day 0–90 BCC signed, CDA stood up, MOV incorporated, DFC/EXIM engagement letters; Month 4–9 appraisal sprint, FEED, SPA term sheets, insurance pool; Month 10–15 FID on LNG Track A, ship charters, ground-break; Month 18–24 first LNG cargoes, Milestone B triggers financing sweeteners; Year 3–4 pipeline leg A in service, Train 2/FLNG-2, hydrogen-ready upgrades.","x":[["United States","Moves Cyprus from a 'case in diplomacy' to a protected economic project; Navy and Treasury become owners of corridor continuity"],["Turkey","Possible naval harassment or disputed-waters interference; finds withdrawal cheaper than defiance once financing and sanctions relief are tied to verified steps"],["European Commission / buyers","Engaged and supportive given anchor volumes, interconnector hedges, hydrogen-ready design"]],"b":["Reunification becomes a U.S.-defended commercial priority","Every occupation-caused delay visibly harms U.S. firms, European buyers and financiers","Cyprus becomes regional gas aggregator and hub; redundancy between LNG and pipeline","Face-saving economic packages for Turkey post-withdrawal"],"r":["Pipeline politics","LNG price softness","EU procurement/antitrust issues from favouring U.S. firms","Local-content rules delaying FID","Sanctioned counterparties entering the chain"],"m":["Two-track redundancy","EPCI tender lotting preserving competition; published justifications for negotiated procedures","Realistic schedule-tied local content","Contractual automatic rerouting if a sanctioned counterparty appears","Communications that create positive pressure, not humiliation"]},{"t":"Master Offtake Vehicle with standard-form SPA and Tolling Agreement term sheets (New York law)","a":"Cyprus–U.S. Master Offtake Vehicle; Cyprus LNG Facility Authority (public-private JV with U.S. operator)","c":"energy","s":"SPA: MOV sells to European utilities/traders for 10–20 years, FOB Cyprus or DES, price = a x TTF + b with optional Brent floor/ceiling, USD payment within 10 banking days, 90% take-or-pay, free destination within EU/Balkans/Med, ICC arbitration seated in New York, investment-grade credit support (BBB-/Baa3). Tolling Agreement: 15 years, fixed capacity fee indexed to U.S. CPI, 90% take-or-pay, fuel gas 8–9% in kind, LCIA London arbitration, 12-month fee guarantee. In both, occupation-related interference is explicitly excluded from neutral force majeure and instead triggers make-whole payments from a Business Interruption Facility, so Turkey cannot be used as an excuse to escape liability.","w":"Term sheets Month 4–9 of corridor timeline","x":[["Lenders","Treat contracts as bankable due to credit support, take-or-pay and backstops"]],"b":["U.S. jurisdictional reach via USD, New York law, ICC/LCIA","Embeds Cyprus LNG in U.S.-controlled legal, financial and insurance ecosystems","Bankability"],"r":[],"m":["Planned maintenance notice >=6 months; unplanned outages compensated if >30 days"]},{"t":"Corridor Insurance Pool (war-risk + business interruption)","a":"Syndicate led by Lloyd's, U.S. insurers and European reinsurers; public backstop DFC, EXIM, MIGA; overseen by Cyprus–U.S. Corridor Authority and independent trustee","c":"economic","s":"A 10-year renewable pool covering naval harassment, blockade, interdiction, seizure of cargoes and occupation-related shutdowns across the Cyprus EEZ, Vasilikos LNG, FLNG and the subsea pipeline. Payout is automatic if the UN/OSCE verification cell certifies interference, or AIS/ADS-B data confirms a blockade/hostile act, or the Corridor Authority declares force majeure certified by the insurers' surveyor. Because DFC and EXIM are guarantors, each occupation-linked disruption costs U.S. agencies money, raising the U.S. incentive to end the occupation, while being framed as 'regional risk management' rather than punishment.","w":"Set in Month 4–9; 10-year tenor aligned with SPAs","x":[["United States","Direct financial exposure creates sustained interest in corridor stability"],["Turkey","Can accept framing as regional risk management"]],"b":["Bankability for DFC, EXIM, EIB and private banks","Premium reductions tied to U.S. Navy/Cyprus MDA posture"],"r":[],"m":["USD 50m war-risk deductible per event; 15-day BI waiting period","Escrow account for transparent disbursement"]},{"t":"Tender scoring matrix tilted to U.S. majors while EU-compliant","a":"Cyprus Ministry of Energy / Corridor Delivery Authority; evaluation committee with EU observer and external auditor","c":"energy","s":"Use the non-price award criteria allowed by Directives 2014/25/EU and 2014/24/EU so criteria 'appear neutral but in practice tilt' to U.S. bidders: Technical capacity 25% (deepwater >1,000 m, LNG trains >5 mtpa, pipelines >200 km); HSE 15% (LTIFR <0.2, ISO 14001/45001); Cybersecurity 15% (NIST CSF, ISO 27001, NATO/EU MDA integration); Supply-chain transparency and sanctions compliance 15% (OFAC/AML, blockchain traceability); Financial strength 10% (rating >=A-, self-finance >20% capex); Innovation/tech transfer 10%; Sustainability 5%; Local content 5%. Minimum qualifying score 70/100; U.S. majors expected to score 85–95+.","w":"","x":[["Non-U.S. bidders","Even aggressive price bids score poorly on HSE, cyber, sanctions compliance and technical depth"]],"b":["U.S. majors 'win cleanly without appearance of favoritism'"],"r":["EU procurement challenge (implicit)"],"m":["Proportionality, equal treatment, transparency, mixed evaluation committee"]},{"t":"Congressional policy brief framing the occupation as a U.S. energy-security risk","a":"Cyprus / 'Policy & Energy Security Taskforce' to U.S. Congress committees","c":"information","s":"A draft brief quantifies U.S. exposure (corporate stakes, export value, insurance premia, NATO deconfliction cost) and asks Congress for six things: a resolution designating the north 'occupied territory' (Crimea precedent); a tiered sanctions framework with executive snap-back; direction to DOE/State to prioritise U.S. participation in East Med LNG via Cyprus; mandated DFC/EXIM priority financing; expanded DoD access agreements;","w":"","x":[["U.S. Congress","Treats reunification as an economic and strategic imperative rather than a talking point"]],"b":["Creates the congressional finding that occupation materially impairs U.S. energy-security interests"],"r":[],"m":[]},{"t":"Trigger coordinated economic leverage on Turkey","a":"U.S. execution cell (NSC, Treasury OFAC/FinCEN, State L/EB/DDTC, Commerce BIS, DoD) with G7, EU EEAS, UK OFSI, Canada, Japan, IMF Executive Directors; Cyprus MoF/Energy/Defence/Central Bank","c":"economic","s":"A 12-step playbook: map supply chains, entities, finance channels and a market-sensitivity baseline; issue a new IEEPA Executive Order authorising blocking sanctions, sectoral measures and a 50 Percent Rule; add North-linked Turkish entities to the Entity List / Military End-User List with presumption of denial and shift ITAR policy; designate a narrow first wave of 10–20 state-linked firms with a 30–60 day wind-down licence; publish FinCEN red-flag advisories to drive voluntary bank de-risking; and have G7 Executive Directors require 'prior actions' (construction freeze, Varosha design, UN/OSCE site verification) before any IMF programme or exceptional access. Pressure is deliberately light, persistent and compounding on the lira, sovereign yields/CDS and listed equities, with pre-announced off-ramps at Milestones A–E.","w":"Day 0–7 cell; Day 1–21 mapping; Day 7–30 authorities; Day 30–90 export restrictions; Day 45–120 designations; Day 60–180 IMF leverage. Cadence: Week 1 advisory and rulemaking notice; Week 6 first designations; Week 10 allies mirror; Week 12–18 IMF/G7 language surfaces.","x":[["Banks/insurers","Self-de-risk and self-censor ahead of formal bans, creating FX pressure"],["Markets","Higher sovereign risk premia, costlier refinancing, equity underperformance of exposed firms"],["Turkish state-linked firms","Lobby Ankara for a face-saving exit"],["Turkey","Possible NATO blowback, pivot to Russia/China, domestic backlash"]],"b":["Raises financial and reputational cost of occupation without broad embargo","Reversible, rules-based: compliance unlocks relief"],"r":["NATO blowback","Pivot to Russia/China","Domestic backlash in Turkey","Over-compliance harming civilians"],"m":["Keep measures narrow and entity-based; avoid broad secondary sanctions; constant NATO de-confliction","Pair with post-withdrawal carrots (EXIM credit lines for Turkish non-defence SMEs)","Respectful narrative: 'economic modernisation and lawful trade', never 'defeat'","General licences for food, medicine, medical devices, remittances, internet tools, academic/cultural exchanges; no energy or food export shocks; FAQs","Civil penalties prioritised over criminal unless wilful"]},{"t":"Undermine Turkey's occupation legitimacy in U.S. law (Occupied Cyprus Accountability and Stabilisation Act)","a":"U.S. Congress (Hellenic Caucus-led bipartisan sponsors) plus Executive implementation (President, OFAC, BIS, State, CBP, FinCEN, USAID/DFC/EXIM)","c":"legal","s":"(ii) makes it unlawful for U.S. persons and U.S.-owned or controlled foreign subsidiaries to transact, finance, insure, invest in, export to, import from or service the occupied area, blocks property of material supporters, and presumes goods from the area inadmissible absent clear and convincing evidence; (iii) authorises optional narrow secondary sanctions, a procurement bar, INA visa restrictions, FinCEN/§311 measures; and (iv) authorises and appropriates a Reunification Trust Fund paid out only on verified milestones. Implementation follows via a national-emergency declaration, OFAC 'Cyprus Occupied Territory Sanctions Regulations' (31 C.F.R. Part 5xx), BIS, CBP, State and FinCEN action.","w":"Hearing path 3–4 weeks; in master blueprint, passage in Phase III (Day 271–540). Sunset on certified full withdrawal with five-year snap-back authority.","x":[["Banks, insurers, auditors, shipping registries, multinationals","Treat the north as high-risk and off-limits even beyond the letter of the law"],["U.S. Executive","May threaten veto; defused by limited waiver"],["Turkey","Faces legal and reputational isolation; association with occupation becomes toxic in ESG, academia, sport, conferences"]],"b":["Legal hook to which sanctions, trade bans, procurement bars and visa restrictions attach","Severs 'commercial oxygen' to the occupied zone","Pre-loads reconstruction carrots so they are 'real, not theoretical'","Political durability if the executive wobbles"],"r":["Separation-of-powers challenge","WTO/GATT challenge","Veto threat","Humanitarian harm","Industry lobbying against"],"m":["Frame under GATT Article XXI national-security and public-morals exceptions, mirroring Crimea measures","Limited reportable waiver","Codified humanitarian exemptions and quarterly humanitarian impact reviews","90-day wind-down licence, advisory hotline, FAQs"]},{"t":"Military-industrial realignment against Turkish leverage","a":"United States (State pol-mil, DoD/EUCOM, export-control agencies, Congress) with Greece and Cyprus","c":"security","s":"Three lines of effort. A: rechannel combat airpower – fast-track F-16 Viper upgrades and F-35A onboarding for Greece, stand up a regional Maintenance, Repair & Overhaul Unit in Greece, relocate avionics/landing-gear/composites workshare and a spares distribution hub to Greece/Cyprus, and give Cyprus 'airpower without fighters' (NASAMS/Patriot-class IAMD, 3D radars, IFF Mode-5, coastal anti-ship batteries, maritime patrol/ISR, Link-16/JREAP-C). B: re-site 2–3 recurring U.S.-led multilateral exercises (ASW/air defence, MCM/SAR, integrated air picture)  (C) an 'Eastern Med Green Lane' of pre-cleared customs corridors Cyprus–Greece–Italy–France with mutual AEO recognition, LNG/FSRU, interconnectors, cables and DFC/export-credit lines only for MSB-compliant routes; (D) harmonised port/airport practice notes and advisories that refuse documents implying recognition, plus fast-track arbitration for post-withdrawal claims; (E) joint public diplomacy. The effect is 'transparency as pressure': lawful lanes get faster, cheaper and safer while North-linked commerce becomes slower, riskier and costlier.","w":"Week 0–4 charter; Week 2–6 governance. Phase 1 (Month 0–3) form and signal; Phase 2 (Month 3–9) make the network real; Phase 3 (Month 9–18) harden the encirclement.","x":[["Turkey","Any disruption attempt 'looks like opposing safety and de-confliction'; must choose normalisation or deeper Russia/Iran dependence with sanctions exposure; possible migration leverage"],["Shippers, investors, traders","Self-select into MSB lanes"],["Insurers","Apply risk-based premia for North-linked calls"]],"b":["Occupation becomes 'Turkey versus everyone else'","Lowers pride-costs for Ankara to pivot; framed as invitation not punishment"],"r":["NATO disruption","Migration leverage","Energy price shock","Incidents at sea/air"],"m":["Safety-framed activities de-linked from alliance votes; U.S.–Turkey de-confliction hotline","EU migration support to frontline states; fund SAR capacity","Stage FSRU/LNG and interconnectors early","INCSEA-style rules and independent incident boards","No blockade behaviour; no violations of international law"]},{"t":"Ethical public diplomacy and civic dialogue inside Turkey","a":"United States and Cyprus via USAID, National Endowment for Democracy, universities, chambers of commerce, cultural diplomacy; Turkish host partners lead where possible","c":"societal","s":"A fully transparent programme (no fronts, bots, dark ads, micro-targeting or partisan advocacy; compliant with Turkish law) built on three factual lenses: economic cost of non-normalisation for Turkish SMEs, missed EU trade opportunities, and youth/future. Tracks: open economic dialogue (SME clinics on CE marking/digital customs, a public Trade Scenario Tool calculator, maritime and insurance forums); youth and academia (joint labs, exchanges, bi-national incubator); culture (Mediterranean Futures Festival, city-to-city twinning); independent media (data rooms, media-literacy modules); B2B bridges (sector roundtables, compliance mentors). Aim is informed constituencies whose own interests favour de-escalation, so pressure on Ankara also arises from within.","w":"0–2 months listening, survey, pilot SME clinic; 3–6 months trade tool, capstones, festival, media trainings; 6–12 months national scale-up; 12–24 months institutionalise and publish impact report.","x":[["Turkish government","May narrow civic space; programme pivots to strictly technical/economic and university-level content"],["Turkish youth and SMEs","Develop a generational narrative favouring U.S./EU ties and a settled Cyprus"]],"b":["Normalises cooperation and lowers social cost of supporting pragmatic solutions","Raises opportunity cost of non-normalisation using data and real projects, not propaganda"],"r":["Government sensitivities","Disinformation","Participant safety"],"m":["Pivot to apolitical programming","Pre-bunking and 'truth sandwich' corrections","Secure venues, duty-of-care, optional anonymity","Full disclosure of funding and honoraria"]},{"t":"Phased exit deal with face-saving for Turkey (Phased Withdrawal Protocol)","a":"United States as deal sponsor (White House and State) with EU and UN as co-witnesses; Joint Implementation Commission (Cyprus, Turkey, U.S., EU, UN, OSCE)","c":"diplomatic","s":"A UN-registered protocol over 60 months (compressible to 36) with three pillars. A: timed withdrawal – standstill and verified baseline (Month 0–3), cantonment (3–6), then Milestones A (10–15% out, Month 6–12), B (20%, two bases vacated, demining, 12–18), C (60%, paramilitary dissolved, Varosha monitored opening, 18–30), D (80%, major bases closed, border regime normalised, 30–42), E (100%, remediation, 42–60). B: a U.S.-brokered Southeast Türkiye Development Facility (DFC/EXIM, EBRD/World Bank/EIB, IPA-style envelopes, private capital with >=30% local content) funding irrigation, hospitals, logistics parks, 50–100 vocational centres, renewables and heritage tourism, paid per milestone. C: a post-withdrawal non-aggression and maritime cooperation pact (INCSEA-style rules, joint SAR, spill response, cable/pipeline protection, 24/7 Nicosia–Ankara–U.S./EU/UN hotlines, 30-day technical panel -> 60-day ministerial -> arbitration). Benefits sit in two escrowed trust funds and release only on triad certification; a yellow/orange/red snap-back ladder applies to delay.","w":"Month 0–6 stabilise; 6–18 initial pullback (20%); 18–36 structural drawdown (<=40% of baseline remaining); 36–48 penultimate (<=20%); 48–60 final (0%).","x":[["Turkey","Can name the deal around economic modernisation and safety, claim 'mission accomplished' and strategic victory; may defect or delay, triggering snap-back"],["Turkish Cypriots","Protected by mentored community policing, minority guarantees, RTF investment; isolated spoilers possible"]],"b":["Complete lawful reunification for Cyprus","Jobs/infrastructure in Turkey's southeast, EU technical talks, lower shipping insurance for Turkey","Property justice: tribunal with return/exchange/compensation options and an 18-month decision target per case"],"r":["Turkish defection or delay","Domestic backlash in Turkey","Spoilers in the north"],"m":["Yellow (<=30 days late): freeze tranches, compliance notice, JIC emergency; Orange (31–90 days): reimpose paused sanctions, widen export-control reviews; Red (>90 days): extend sanctions, G7 export-credit holds, insurance advisories; off-ramp always open","No-humiliation rule: veterans programme, co-witnessed ceremonies with neutral language ('mission transition')","Audit wall: independent procurement monitors, public dashboards, whistleblower hotline"]},{"t":"Reunification Trust Fund (RTF)","a":"U.S. (USAID, DFC, EXIM), European Commission, Government of Cyprus, Turkish-Cypriot representatives; UN/OSCE controller co-signs","c":"economic","s":"A pre-funded, escrowed reconstruction fund for the north that disburses strictly on verified withdrawal milestones: power/water grids, hospitals, schools, housing, environmental remediation, claims tribunal operations, land-records systems, workforce transition. It is the main positive incentive showing that the only path to trade, investment and aid runs through verified withdrawal.","w":"Announced Phase III; tranches Month ~18 (planning), ~24 (infra tranche 1), ~36 (tranche 2), ~48 (tranche 3), ~60 (major disbursement and close-out); terminates on full withdrawal","x":[["Turkish-Cypriot actors","See the only viable economic path in verified withdrawal and reunification"]],"b":["Carrots are credible and visible in advance"],"r":[],"m":["Escrow; freeze if verification fails"]},{"t":"Exclusive naval and air facilities (long-term U.S. lease)","a":"Republic of Cyprus","c":"security","s":"Headline incentive table offers a long-term U.S. lease of upgraded ports and airfields in Limassol or Larnaca, extending U.S. Navy reach in the Eastern Mediterranean without Turkish permission. Later sections restate this as rotational, paid, reversible access.","w":"","x":[],"b":["U.S. naval reach without Turkish permission"],"r":["Conflicts with later red line of no permanent bases/exclusivity"],"m":[]},{"t":"Energy contract priority (20+ year rights for U.S. firms)","a":"Republic of Cyprus","c":"energy","s":"20+ year rights for U.S. firms in Cyprus's EEZ gas and renewables, securing U.S. energy influence in Europe's diversification strategy.","w":"","x":[],"b":["U.S. energy influence in Europe"],"r":[],"m":[]},{"t":"Regional command hub (U.S. Eastern Mediterranean Command HQ in Cyprus
