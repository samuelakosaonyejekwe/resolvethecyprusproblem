    if (s.id === 'lira') return { label: T('Lira against the euro, 12 months'), value: (s.dep >= 0 ? '−' : '+') + Math.abs(s.dep).toFixed(1) + '% (€1 = ₺' + s.rate.toFixed(2) + ')',
      why: T('A weaker lira raises the value Ankara places on Western capital, trade and market access.') };
    return { label: s.id, value: '', why: '' };
  };

  /* Theme names: as filter buttons and as the small tags on each headline. */
  L.themes = Object.keys(THEMES);
  L.themeName = function (k) { return { talks: T('Talks'), military: T('Military'), energy: T('Energy'), europe: T('Europe'), pressure: T('Pressure') }[k] || k; };
  L.themeTag = function (k) { return { talks: T('talks'), military: T('military'), energy: T('energy'), europe: T('europe'), pressure: T('pressure') }[k] || k; };

  function load() {
    if (L.data) return L.data;
    try { L.data = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { L.data = null; }
    if (L.data) L.data.signals = signals(L.data); /* rebuilt, so copies saved by earlier versions carry no wording */
    return L.data;
  }

  function save() { try { localStorage.setItem(KEY, JSON.stringify(L.data)); } catch (e) {} }
  function emit() { L.listeners.forEach(function (f) { try { f(L.data, L.busy); } catch (e) {} }); }

  L.onChange = function (f) { L.listeners.push(f); };
  L.get = load;
  L.stale = function () { var d = load(); return !d || Date.now() - d.t > MAX_AGE; };

  /* Each source succeeds or fails on its own; old values are kept on failure. */
  L.refresh = function (wikiTitles, pvMap) {
    if (L.busy) return Promise.resolve(load());
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return Promise.resolve(load());
    L.busy = true; emit();
    var d = Object.assign({ status: {} }, load() || {});
    d.status = Object.assign({}, d.status);
    function part(name, p) {
      return p.then(function (v) { d[name] = v; d.status[name] = { ok: true, t: Date.now() }; })
        .catch(function (e) { d.status[name] = { ok: false, t: Date.now(), err: String(e && e.message || e), kept: !!d[name] }; })
        .then(function () { d.signals = signals(d); if (d.status[name].ok) d.t = Date.now(); L.data = d; save(); emit(); });
    }
    /* GDELT asks for at most one request every five seconds. */
    function retry(f) { return gate().then(f).catch(function () { return gate().then(f); }); }
    var gd = part('news', retry(news)).then(function () { return part('tone', retry(tone)); });
    return Promise.all([gd, part('fx', lira()), part('wb', worldBank()), part('wiki', wiki(wikiTitles || [])), part('research', research()), part('attn', attention(pvMap || {})), part('press', press()), part('official', official()), gd.then(function () { return part('feed', retry(feed)); })]).then(function () {
      var ok = Object.keys(d.status).some(function (k) { return d.status[k].ok && Date.now() - d.status[k].t < 60000; });
      if (ok) d.t = Date.now();
      L.data = d; L.busy = false; save(); emit();
      return d;
    });
  };

  L.sources = function () {
    return [
      { id: 'research', name: 'OpenAlex', what: T('Recent scholarly articles on the Cyprus question'), url: 'https://openalex.org/' },
      { id: 'attn', name: T('Wikimedia pageviews'), what: T('Daily readership of the reference articles for each subject: a measure of world attention (last five weeks)'), url: 'https://wikimedia.org/api/rest_v1/' },
      { id: 'press', name: T('Newspapers\' own feeds'), what: T('Headlines read directly from Greek Cypriot, Turkish Cypriot, Greek and regional newspapers, in their own languages (last 21 days)'), url: 'https://philenews.com/' },
      { id: 'official', name: T('UK Parliament and US Federal Register'), what: T('What governments have put on the record: ministers\' written answers on Cyprus, and US government notices and rules'), url: 'https://questions-statements.parliament.uk/' },
      { id: 'feed', name: T('GDELT Project'), what: T('Current headlines, statements and meetings sorted by the subject of each move (last 21 days)'), url: 'https://www.gdeltproject.org/' },
      { id: 'news', name: T('GDELT Project'), what: T('Worldwide news index: headlines mentioning the Cyprus question (last 21 days)'), url: 'https://www.gdeltproject.org/' },
      { id: 'tone', name: T('GDELT Project'), what: T('Average tone of Cyprus–Türkiye coverage (four months)'), url: 'https://www.gdeltproject.org/' },
      { id: 'fx', name: T('Frankfurter (ECB reference rates)'), what: T('Euro–lira and euro–dollar exchange rates'), url: 'https://frankfurter.dev/' },
      { id: 'wb', name: T('World Bank Open Data'), what: T('GDP, growth, inflation, military spending, population for Cyprus, Türkiye, Greece'), url: 'https://data.worldbank.org/' },
      { id: 'wiki', name: T('Wikipedia'), what: T('Current summaries of past plans, talks, rulings and comparable cases'), url: 'https://en.wikipedia.org/' }
    ];
  };

  root.Live = L;
})(typeof self !== 'undefined' ? self : this);
</script>
<script>/* The complete user guide. Content only: every sentence goes through T() so
   it can be shown in any of the tool's languages. */
(function (root) {
  'use strict';

  root.GUIDE = function (T, M, esc) {
    function p(s) { return '<p>' + s + '</p>'; }
    function ul(a) { return '<ul class="list">' + a.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>'; }
    function ol(a) { return '<ol class="list">' + a.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ol>'; }
    function h(s) { return '<h3>' + s + '</h3>'; }
    var n = 0;
    function sec(title, body, open) {
      n += 1;
      return '<details class="lib-item guide-sec"' + (open ? ' open' : '') + '><summary>' + n + '. ' + title + '</summary>' + body + '</details>';
    }

    var out = '';

    out += sec(T('What this tool is'), p(T('The Cyprus Strategy Board is a decision-support tool. It treats the Cyprus question as a game with ten players, in the sense of game theory and of chess: every stakeholder has interests, every decision by one changes the situation for all, and the others answer.')) +
      p(T('You take the seat of one stakeholder. You choose a move. The tool then shows how each of the other nine is likely to answer, what the situation looks like after all those answers, who gains and who loses, and which move and which sequence of moves would serve you best. It also produces a SWOT analysis, a risk register, a payoff matrix, a stakeholder map and a robustness test for any move.')) +
      p(T('It is an aid to thinking, not an oracle. It makes assumptions explicit, applies them consistently, and lets you change them. What it gives you are reasoned scenarios with probabilities, never certainties about what a government will do.')), true);

    out += sec(T('Quick start in six steps'), ol([
      T('<b>Choose your stakeholder</b> on the opening page. You can change seat at any time by tapping the title at the top.'),
      T('<b>Read the board.</b> The first card names the present situation; the ten bars show where each measure stands and, with a ▼, where you would like it to be.'),
      T('<b>Decide who plays the others.</b> "Computer plays them" lets the tool answer for the other nine. "I choose their moves" lets you set every reply yourself.'),
      T('<b>Tap a move</b> in the list. A panel opens with what the move does, the replies, the resulting situation and each stakeholder\'s gain or loss. Nothing is committed yet.'),
      T('<b>Press "Play this move"</b> to commit. The board advances one round, which stands for about six months. Use "Undo round" to step back.'),
      T('<b>Open "Best path" and "Analysis"</b> for the recommended sequence several rounds ahead and for the full assessment of any single move.')]));

    out += sec(T('The ten stakeholders'), p(T('Each stakeholder is modelled by three things: an <b>ideal point</b> on every measure (where it would like that measure to be), a <b>weight</b> on every measure (how much it cares), and a list of <b>moves</b> it can make. It also has a <b>power</b> score from 0 to 100 used for the stakeholder map and the collective objective, and a degree of <b>inertia</b>: how much a move must be worth before it bothers to act at all.')) +
      ul(M.players.map(function (q) { return '<b>' + esc(q.name) + '.</b> ' + esc(q.role); })) +
      p(T('Three stakeholders are <b>veto players</b>: the Republic of Cyprus, the Turkish Cypriots and Türkiye. No settlement can come into being or last without each of them. The "Sustainable" objective exists because of them.')) +
      p(T('The full profile of each stakeholder, with interests, red lines, leverage and vulnerabilities, is in Library → Stakeholders.')));

    out += sec(T('The position: ten measures'), p(T('The state of the Cyprus question at any moment is described by ten measures, each scored from 0 to 100 between two named extremes. The starting scores are judgments anchored in facts from the public record; those facts are listed in Library → Assumptions, where you can also move every starting score.')) +
      ul(M.dims.map(function (d) { return '<b>' + esc(d.name) + '</b> — ' + esc(d.desc) + ' <span class="mute">(0 = ' + esc(d.lo) + '; 100 = ' + esc(d.hi) + ')</span>'; })) +
      p(T('On every bar the blue fill is the present score and the ▼ is your stakeholder\'s ideal. When a move is selected, a green band shows movement toward your ideal and a red band movement away from it.')) +
      h(T('Named situations')) + p(T('The tool gives every position one of six names, by fixed rules:')) +
      ul([
        T('<b>Armed crisis</b>: Stability below 22.'),
        T('<b>Verified reunification</b>: Settlement track at 78 or more and Demilitarisation at 65 or more.'),
        T('<b>Partition entrenched</b>: Settlement track at 22 or less.'),
        T('<b>Convergence</b>: Settlement track at 60 or more and Trust at 50 or more.'),
        T('<b>Confrontation</b>: Cost of the status quo for Ankara at 60 or more while Stability is below 45.'),
        T('<b>Managed stalemate</b>: everything else. This is where the board starts.')]));

    out += sec(T('Payoff: how satisfaction is measured'), p(T('A stakeholder\'s <b>payoff</b> is a number from 0 to 100 that says how close the present position is to that stakeholder\'s ideal world. For each measure the tool takes the distance between the score and the stakeholder\'s ideal, turns it into closeness, and multiplies by the stakeholder\'s weight for that measure. The weighted results are added up. A payoff of 100 would mean every measure sits exactly on the ideal.')) +
      p(T('Everything else follows from this. A move is good for a stakeholder if it raises that stakeholder\'s payoff once all replies are in. Two stakeholders are "with" each other when the changes each wants point the same way, and "against" each other when they point opposite ways. That is recalculated at every position, so alignments shift as the game moves.')) +
      p(T('Ideal points and weights are the heart of the model. You can inspect and change them for any stakeholder in Library → Assumptions.')));

    out += sec(T('Moves'), p(T('A move is a concrete action a stakeholder can take. Each move has:')) +
      ul([
        T('<b>Effects</b>: by how many points it shifts which measures. These are shown as small tags, for example "Trust +5".'),
        T('<b>Chance of success</b>: the probability that it works as intended. If it fails, some moves have a stated backfire effect.'),
        T('<b>Political cost</b>, from 0 to 10: the effort, money or political capital it takes. Each point of cost takes a quarter of a payoff point off the value of the move for the stakeholder making it.'),
        T('<b>Conditions</b>: some moves need a measure to be above or below a level, or need another move to have been played first. A referendum, for instance, needs a signed roadmap. Moves whose conditions are not met are listed under "not available yet", with the reason.'),
        T('<b>One-off or repeatable</b>: most moves can be played once. A few can be repeated, each repetition having a little more than half the effect of the one before.'),
        T('<b>Commitment</b>: a few moves are obligations entered into earlier. The more guarantees are in place (escrowed money, verification, snap-back), the more a stakeholder would lose by not following through, and the tool counts that.')]) +
      p(T('Two general rules apply to all effects. First, <b>diminishing returns</b>: the closer a measure already is to an extreme, the harder it is to push it further that way. Second, <b>time is not neutral</b>: at the end of every round the settlement track, trust, pressure on Ankara and Turkish Cypriot standing slip back slightly, and stability recovers slightly. Doing nothing is therefore also a choice with consequences.')) +
      p(T('The moves of the Republic of Cyprus are drawn from the source blueprints and carry the name of the blueprint they come from. The moves of the other stakeholders reflect options those actors have actually used or openly discussed.')));

    out += sec(T('A round, step by step'), ol([
      T('You play one move, or "Hold position".'),
      T('The other nine stakeholders answer one after another in a fixed order: Republic of Cyprus, Turkish Cypriots, Türkiye, Greece, European Union, United States, United Kingdom, United Nations, Russia, regional partners (leaving out your own seat). Each sees what has already happened in the round.'),
      T('The effects of all ten moves are applied to the position.'),
      T('The small end-of-round drift is applied.'),
      T('The round is written into the game record and the next round begins from the new position.')]) +
      p(T('One round stands for roughly six months of real time.')));

    out += sec(T('Two ways to play: computer or manual'), h(T('Computer plays them')) +
      p(T('The tool plays the other nine stakeholders, as a chess program plays the other side. Each answers with the move that serves its own interests best, and you see the probability of each answer and the alternatives it considered. Use this mode to find out what is likely to happen.')) +
      h(T('I choose their moves')) +
      p(T('You decide what every other stakeholder does. When you select your move, the panel shows a list for each of the nine with all the moves open to them, each starting on "Hold position". Change any of them and the result updates at once. You can hand any single stakeholder back to the computer with "Let the computer choose".')) +
      p(T('Use manual mode to test a specific "what if", to replay events as they really unfolded, to prepare for the reply you fear most, or to run a table exercise in which people around the table each speak for one stakeholder.')) +
      p(T('You can switch between the two modes at any round. Rounds played manually are marked "manual" in the game record. In manual mode the scores next to your moves, the Best path page and the Analysis page still show the computer\'s own estimate, for guidance.')));

    out += sec(T('How the computer predicts replies'), p(T('For each stakeholder in turn, the tool values every move open to it, including holding. The value of a move is the stakeholder\'s payoff after the move, counted half immediately and half after the stakeholders still to play in that round have made their own best replies. This is the look-ahead: a stakeholder does not only ask "what does this do for me now" but also "what will the others do about it".')) +
      p(T('From that value the tool subtracts the move\'s cost and adds any commitment value. "Hold position" receives a bonus equal to the stakeholder\'s inertia, because large institutions do not act for marginal gains.')) +
      p(T('The move with the highest value is the predicted reply. The <b>probability</b> shown beside it comes from how far ahead of the alternatives it is: when two options are nearly equal the split is close to even, and when one is clearly better it approaches certainty. Game theorists call this a quantal-response rule. It is an honest way to say "this is our best estimate, and this is how sure the model is".')) +
      p(T('Each reply is tagged by what it does to you: "helps you", "hurts you" or "neutral", with the size of the effect on your payoff.')));

    out += sec(T('How the best move is chosen'), p(T('For every move open to you, the tool plays the round forward with the computer answering for the others, then continues for two more rounds in which everyone, including you, keeps choosing well. It then looks at where you stand.')) +
      h(T('Three objectives')) + ul([
        T('<b>My payoff</b>: only your own payoff counts.'),
        T('<b>Sustainable</b>: your payoff, reduced by 1.3 points for every point by which the worst-hit veto player ends below where it started, and by a quarter of any fall in Stability. A result that leaves a veto player worse off than today invites that player to undo it. This is the default.'),
        T('<b>Collective</b>: the average payoff of all ten stakeholders, weighted by their power.')]) +
      h(T('The score next to each move')) +
      p(T('The number beside each move compares it with simply waiting: +0.50 means that three rounds on you stand half a payoff point better than if you had held this round. "Hold position" is the baseline. The move at the top with the green edge is the engine\'s choice.')) +
      h(T('Prospects')) +
      p(T('Some moves pay off only when someone else responds: an offer has value because it may be accepted. The tool therefore adds a term for prospects: how much more attractive your move has made the replies that would help you, and how much less attractive those that would hurt you. This is what allows it to recommend groundwork, such as putting guarantees in place before asking for a signature.')));

    out += sec(T('The Best path page'), p(T('This page answers: "what sequence of moves should I play over the coming years?" It searches several rounds ahead, keeping the four most promising lines of play at every step and widening each with your six best candidate moves. It runs the search three times, from cautious to ambitious, and keeps the line whose end position is best for you. This sequence is the <b>critical path</b>: the order matters because early moves create the conditions for later ones.')) +
      ul([
        T('<b>Settings</b>: the objective and the number of rounds to look ahead (3 to 10).'),
        T('<b>Headline result</b>: your payoff today, at the end of the best path, and if you only wait.'),
        T('<b>Critical path, step by step</b>: each step shows your move, the replies the computer predicts with their probabilities, the named situation afterwards and the change in your payoff.'),
        T('<b>Where the position ends up</b>: the ten bars from start to end of the path.'),
        T('<b>Odds, allowing for surprises</b>: 240 simulated futures. In each one, every move succeeds or fails by its own chance, and stakeholders sometimes take their second or third choice in proportion to how close their options are. The coloured bar shows how often each named situation results. The three payoff figures are the pessimistic case (one in ten is worse), the typical case and the optimistic case (one in ten is better).'),
        T('<b>If you only wait</b>: the same simulation with you holding every round, for comparison.')]) +
      p(T('"Play step 1 on the board" commits the first move. Come back to this page after each round: the path is recalculated from the new position, because the others may not have answered as predicted.')));

    out += sec(T('The Analysis page'), p(T('This page assesses one move in the present position. Choose the move in the first box.')) +
      ul([
        T('<b>Reading</b>: a plain-language verdict: how the move ranks, what it does to your payoff, who will push back and who will support, and any sustainability warning.'),
        T('<b>SWOT</b>: Strengths and Weaknesses are yours: what the move itself does toward or away from your ideals, its chance of success and cost, and your standing leverage and vulnerabilities. Opportunities and Threats come from the others: predicted helpful and harmful replies with their probabilities, less likely alternatives worth watching, moves that become possible afterwards, stakeholders who change sides, veto players left worse off, and changes in stability.'),
        T('<b>Risk register</b>: each thing that could go wrong, with its likelihood, its impact on your payoff, a High / Medium / Low rating (likelihood times impact) and a mitigation.'),
        T('<b>Head-to-head payoff matrix</b>: your five strongest options against one opponent\'s five strongest, as if only the two of you moved. Each cell shows your gain and theirs. A highlighted cell is an <b>equilibrium</b>: neither side could do better by changing its own choice alone. A <b>dominant option</b> is one that is at least as good as your others whatever the opponent does.'),
        T('<b>Stakeholder map</b>: each other stakeholder placed by power (height) and by whether it currently pulls with you (right) or against you (left).'),
        T('<b>How sure is the recommendation?</b>: the advice is recalculated 24 times with every weight, ideal point and move effect randomly disturbed by up to about a third. The percentage is how often the same move stays on top. Above 60% the advice is robust; below 35% it is fragile and close alternatives are listed. The bars underneath show which starting conditions matter most, by shifting each measure 15 points down and up.'),
        T('<b>Lens table</b>: the result of the round sorted into political, security, economic, energy, legal and social changes.'),
        T('<b>What history says</b>: real precedents that resemble the move, with outcome and lesson.')]) +
      p(T('"Print / save PDF" produces a paper or PDF copy of the page.')));

    out += sec(T('Live intelligence'), p(T('Whenever the tool is open and your device is online, it fetches current data directly from public sources. No server belonging to this tool is involved, so the data keeps flowing as long as the sources themselves are up, on any user\'s device, anywhere. The last data fetched is stored on your device and used when you are offline. Data is refreshed when you open the tool, when you return to it, when a connection comes back, and at most every three hours while it stays open. "Refresh now" forces an update.')) +
      h(T('Sources')) + ul([
        T('<b>GDELT Project</b>: an index of worldwide news. Used for headlines about the Cyprus question from the last three weeks, and for the average tone of coverage about Cyprus and Türkiye over four months.'),
        T('<b>European Central Bank reference rates</b> (through the Frankfurter service): the euro–lira exchange rate over the last twelve months.'),
        T('<b>World Bank Open Data</b>: GDP, growth, inflation, military spending and population for Cyprus, Türkiye and Greece.'),
        T('<b>Wikipedia</b>: current summaries for the precedents in the Library.'),
        T('<b>Newspapers\' own feeds</b>: headlines read directly from Greek Cypriot, Turkish Cypriot, Greek and regional newspapers that publish an open feed, in their own languages.'),
        T('<b>UK Parliament and US Federal Register</b>: the official record of ministers\' answers on Cyprus and of United States government notices and rules.'),
        T('<b>Wikimedia pageviews</b>: the public count of how many people read each Wikipedia article each day. Used to measure world attention to the subject of every move.'),
        T('<b>OpenAlex</b>: an open index of the world\'s scholarly research. Used for the most recent articles on the Cyprus question.')]) +
      h(T('How live data changes the model')) +
      p(T('Live data is turned into a small number of <b>signals</b>. Each signal nudges the starting position, by a capped amount, and is listed on the page with its reading and its exact effect. You can untick any signal, or switch all of them off.')) +
      ul([
        T('<b>News tone</b>: if coverage in the last two weeks is more hostile or calmer than the four-month average, starting Stability moves down or up by four points per point of tone difference, at most 8.'),
        T('<b>Talks in the headlines</b>: when more than 30% of headlines concern negotiations, starting Trust rises; when fewer, it falls; at most 5 points either way.'),
        T('<b>Military matters in the headlines</b>: when more than 25% of headlines are military, starting Stability falls; when fewer, it rises; at most 5 points.'),
        T('<b>Legal and sanctions pressure in the headlines</b>: when more than 20% concern courts, sanctions or resolutions, starting pressure on Ankara rises; when fewer, it falls; at most 5 points.'),
        T('<b>The lira</b>: the percentage the lira has lost against the euro in twelve months raises, by the same percentage and at most 40%, the weight Türkiye gives to its Western ties and to the economy.')]) +
      h(T('Live evidence for every move')) +
      p(T('Every move belongs to a subject, such as settlement talks, offshore gas, sanctions or the crossings. For each subject the tool gathers two kinds of current evidence. The first is attention: how many people a day are reading the reference articles on that subject on Wikipedia, taken from Wikimedia\'s public readership figures for the last five weeks. The second is headlines: the current news feeds are sorted on your device by subject, and reports of what leaders have said and of summits, conferences and meetings are picked out. Only headlines plainly about the subject are counted.')) +
      p(T('When you select a move, in computer mode or manual mode, the panel shows this evidence under the heading "Live evidence": readers a day in the last week and in the four weeks before, the change between them, a small chart, and the latest statements, meetings and reports with links to their sources. The same card appears on the Analysis page.')) +
      p(T('The evidence also enters the calculation. When attention to a subject has risen by a quarter or more, 5 percentage points are added to the chance of success of its moves, because attention gives decision-makers reason and cover to act. When attention has dropped by a fifth or more, 3 points are taken off. Otherwise nothing changes. This applies to every stakeholder\'s moves, so the predicted replies, the scores, the best path and the odds all reflect the present state of the world. The rule can be switched off under Live intel → Evidence by subject.')) +
      h(T('What governments are saying, and what they have put on record')) +
      p(T('Attention is not intent. To get closer to intent, the tool reads current headlines directly from newspapers on both sides of the island and in Greece, in Greek, Turkish and English, as well as from the news index. A headline that reports a named leader or office speaking about the Cyprus question is attributed to that stakeholder and read, from its wording, as conciliatory or hard-line.')) +
      p(T('When a stakeholder has at least three such statements in the last three weeks, the balance between conciliatory and hard-line ones tilts its predicted choices slightly toward moves of the same kind. A government that has been talking about dialogue is judged a little more likely to choose a cooperative reply; one that has been issuing warnings, a little more likely to choose a confrontational one. The table under Live intel → "What each government is saying" shows the counts and the latest statement for each stakeholder, and the tilt can be switched off there.')) +
      p(T('The Live intel page also shows the official record from primary sources: written answers given by United Kingdom ministers to Parliament on Cyprus, and notices and rules published by the United States government. Public words and official records are evidence of stated policy. They can still differ from what a government privately intends, which no tool can observe.')) +
      p(T('The Live intel page also lists the most recent scholarly articles on the Cyprus question from the OpenAlex index of world research, for background reading.')) +
      h(T('Why the lira is there')) +
      p(T('Türkiye\'s decision is the one on which the outcome turns, and most of the levers available to others are economic: a customs-union upgrade, investment, sanctions, access to markets and capital. How heavily such levers weigh depends on how much Türkiye\'s economy needs outside money and confidence at that moment. The lira\'s exchange rate is the one hard, public, daily number that shows this. A sharply weaker lira means incentives and pressure count for more in Ankara. The north of Cyprus also uses the lira, so the same slide erodes living standards there.')) +
      p(T('A game in progress is replayed from the adjusted start when signals change, so your moves are kept.')));

    out += sec(T('The Library'), ul([
      T('<b>Stakeholders</b>: one card for each of the ten, with role, what it cares about most, interests, red lines, leverage, vulnerabilities and its list of moves. "Play as" switches your seat.'),
      T('<b>Blueprint strategies</b>: the catalogue of proposals in the source blueprints, searchable by any word. Each entry gives the actor, a summary, expected responses, benefits, risks and mitigations, and for each blueprint its game-theory logic and sequencing. These are proposals, and figures inside them are planning estimates. The entries are shown in English, the language of the source documents.'),
      T('<b>Precedents</b>: earlier attempts on Cyprus and comparable cases elsewhere, each marked success, failure or mixed, with the lesson and, when online, a current summary from Wikipedia.'),
      T('<b>Assumptions</b>: every number in the model. Move a slider and all predictions are recalculated at once. "Restore defaults" undoes your changes. Your changes are kept on your device only.'),
      T('<b>Method & install</b>: a short statement of the method, installation, the single-file copy, mirror addresses and sources.')]));

    out += sec(T('Saving, sharing and starting again'), ul([
      T('<b>Automatic saving</b>: your seat, your game, your settings and your changed assumptions are stored on your device and restored the next time you open the tool.'),
      T('<b>Undo round</b> takes back the last round. <b>New game</b> returns to the starting position for the same stakeholder.'),
      T('<b>Share</b> produces a link that contains your stakeholder and the moves played, including manual replies. Anyone opening the link sees the same game. Changed assumptions are not part of the link.'),
      T('<b>Print / save PDF</b> on the Analysis page produces a document for a briefing or a file.')]));

    out += sec(T('Finding your way around'), ul([
      T('<b>Tabs</b>: Board, Best path, Analysis, Live intel, Library and Guide. On a phone they sit at the bottom of the screen; on a computer under the title bar.'),
      T('<b>Back and forward arrows</b> at the top left retrace the pages you have visited. Your device\'s own back button does the same.'),
      T('<b>Previous and next buttons</b> at the foot of every page lead through the tabs in order.'),
      T('<b>The title</b> at the top returns to the choice of stakeholder.'),
      T('<b>Language</b>: the selector at the top switches between English, Greek and Turkish at once, keeping your game.'),
      T('<b>◐</b> switches between light and dark display.'),
      T('<b>Esc</b> on a keyboard closes the move panel or a dialog.')]));

    out += sec(T('Installing and using offline'), p(T('The tool is a web application that installs like an app and then needs no connection.')) +
      ul([
        T('<b>iPhone and iPad</b>: open the address in Safari, tap the Share button, choose "Add to Home Screen".'),
        T('<b>Android</b>: tap "Install app" at the top, or open the browser menu and choose "Install app" or "Add to Home screen".'),
        T('<b>Windows, Mac, Linux, Chromebook</b>: in Chrome or Edge, press "Install app" at the top or the install icon in the address bar. In Safari on a Mac, use File → "Add to Dock".'),
        T('<b>Any other browser</b>: simply visit the address once. The tool stores itself on the device and opens from the same address without a connection afterwards.')]) +
      p(T('Once installed or visited, the tool works in airplane mode. Only live data needs a connection; without one, the last data fetched is used and the indicator at the top says "Offline".')) +
      p(T('<b>Updates</b> arrive by themselves: when you are online the tool checks for a newer version in the background and uses it the next time it is opened.')) +
      p(T('<b>Single-file copy</b>: under Library → Method & install you can download the whole tool as one file. It opens in any browser from a memory stick, an e-mail attachment or a shared folder, with no installation and no connection. This copy does not update itself.')) +
      p(T('<b>If the main address is unreachable</b>, an installed copy and the single-file copy keep working, and any mirror addresses are listed under Library → Method & install.')));

    out += sec(T('Privacy'), p(T('The tool has no accounts, no tracking and no server of its own that receives anything from you. Your seat, your games and your assumptions never leave your device unless you share a link yourself. The only requests your device makes are to the public data sources named above, which see an ordinary request for public data.')));

    out += sec(T('Limits and responsible use'), ul([
      T('The model knows ten measures and about a hundred moves. Real politics has more of both. Events outside the model, such as an election, a war elsewhere or a change of leader, can overturn any forecast.'),
      T('Ideal points, weights and effects are structured judgments, not measurements. They are published in full so that they can be challenged. If you disagree with one, change it and see whether the advice changes.'),
      T('Probabilities express the model\'s own confidence given its assumptions. They are not frequencies observed in history.'),
      T('The tool describes what stakeholders are likely to do, not what they ought to do. A move being predicted is not an endorsement of it.'),
      T('Use it to prepare, to compare options, to test your reasoning against a consistent opponent, and to explain a strategy to others. Do not use it as the sole basis for a decision of state.')]));

    out += sec(T('Worked example'), p(T('You sit as the Republic of Cyprus, in computer mode, with the Sustainable objective.')) +
      ol([
        T('The board opens on "Managed stalemate". Türkiye and Russia stand to your left on the stakeholder map; Greece, the European Union and the United Nations to your right.'),
        T('The move list is ordered by score. Tap the top move. The panel shows, for instance, that the Turkish Cypriots are likely to answer with a cooperative step and Russia with a spoiling one, and that your payoff rises once all replies are in.'),
        T('Before committing, open Analysis. The SWOT lists which later moves this one opens. The robustness test tells you whether the advice survives if the assumptions are off.'),
        T('Play the move. The game record shows the round, and the board now starts from the new position.'),
        T('Open Best path with eight rounds ahead. You will typically see groundwork first (security guarantees, escrowed funds, benefits for Turkish Cypriots), because those make a later signature by Türkiye worth more to Ankara and a later referendum safer.'),
        T('Switch to manual mode and ask the hard question: "what if Türkiye answers with naval pressure instead?" Set that reply yourself and see what it costs you and what you could do next.')]));

    out += sec(T('Glossary'), ul([
      T('<b>Commitment device</b>: an arrangement that makes it costly to go back on a promise, such as money held in escrow or automatic snap-back of benefits.'),
      T('<b>Critical path</b>: the sequence of moves on which the outcome depends, in the order they must happen.'),
      T('<b>Dominant option</b>: a move that is at least as good as your alternatives whatever the other side does.'),
      T('<b>Equilibrium</b> (Nash equilibrium): a pair of moves from which neither side can improve by changing its own move alone.'),
      T('<b>Escrow</b>: money or benefits held by a third party and released only when agreed steps are verified.'),
      T('<b>Ideal point</b>: where a stakeholder would like a measure to be.'),
      T('<b>Inertia</b>: the minimum gain a stakeholder needs before it acts instead of holding.'),
      T('<b>Payoff</b>: a stakeholder\'s satisfaction with a position, from 0 to 100.'),
      T('<b>Prospects</b>: the value of having made helpful replies by others more likely.'),
      T('<b>Round</b>: one move by you and one reply by each other stakeholder; about six months.'),
      T('<b>Signal</b>: a small, capped adjustment of the starting position derived from live data.'),
      T('<b>Snap-back</b>: the automatic withdrawal of benefits when an agreed step is missed.'),
      T('<b>Veto player</b>: a stakeholder without whose consent a settlement cannot come about or last.'),
      T('<b>Weight</b>: how much a stakeholder cares about a measure.')]));

    return out;
  };
})(typeof self !== 'undefined' ? self : this);
</script>
<script>document.addEventListener("DOMContentLoaded",function(){/* Interface for the Cyprus Strategy Board. */
(function () {
  'use strict';
  var M0 = window.MODEL, E = window.Engine, L = window.Live, I = window.I18N, T = I.T;
  var M = I.model(M0); /* the model in the current language; rebuilt when the language changes */
  var LS = 'cy.app.v2';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var view = $('#view'), sheet = $('#sheet');
  E.T = T;

  var A = { pid: null, tab: 'board', sel: null, mode: 'sustainable', horizon: 6, live: true, sigOff: {}, own: [],
    cat: 'all', play: 'auto', manual: {}, lib: 'players', q: '', opp: null, theme: null, custom: { base: {}, w: {}, ideal: {} }, newsTheme: 'all' };
  var C = null, S = null, stack = [], cache = {}, KB = null, deferred = null;

  /* Tables of labels are functions so that they follow the current language. */
  function TABS() { return [['board', '♟', T('Board')], ['path', '➤', T('Best path')], ['analysis', '◫', T('Analysis')], ['live', '◉', T('Live intel')], ['library', '☰', T('Library')], ['guide', '?', T('Guide')]]; }
  function MODES() {
    return { self: [T('My payoff'), T('Maximise your own stakeholder\'s payoff, whatever it does to the others.')],
      sustainable: [T('Sustainable'), T('Your payoff, minus a penalty whenever a party that can block the outcome (Republic of Cyprus, Turkish Cypriots, Türkiye) ends worse off than today, or stability erodes. Deals that leave a veto player worse off do not last.')],
      collective: [T('Collective'), T('The power-weighted average payoff of all ten stakeholders.')] };
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function P(id) { return C.players[id].src; }
  function dim(i) { return M.dims[i]; }
  function sgn(v, dp) { var r = v.toFixed(dp === undefined ? 1 : dp); return (v > 0 ? '+' : '') + r; }
  function pct(v) { return Math.round(v * 100) + '%'; }
  function cls(v, t) { t = t || 0.3; return v > t ? 'good' : v < -t ? 'bad' : ''; }
  function toast(msg) { var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 3200); }
  /* "A and B and C", with the joining word open to translation. */
  function andList(a) { return a.reduce(function (x, y) { return T('{0} and {1}', x, y); }); }

  /* ---------- persistence ---------- */
  function save() {
    try {
      localStorage.setItem(LS, JSON.stringify({ pid: A.pid, tab: A.tab, mode: A.mode, horizon: A.horizon, live: A.live, sigOff: A.sigOff, own: A.own, play: A.play, custom: A.custom, theme: A.theme, opp: A.opp }));
    } catch (e) {}
    var h = A.pid ? '#p=' + A.pid + (A.own.length ? '&m=' + A.own.join(',') : '') : '';
    try { history.replaceState(history.state, '', location.pathname + location.search + h); } catch (e) {}
  }
  function restore() {
    try { Object.assign(A, JSON.parse(localStorage.getItem(LS) || '{}')); } catch (e) {}
    var m = /#p=([A-Z]+)(?:&m=([\w.,~=-]+))?/.exec(location.hash);
    if (m && M.players.some(function (p) { return p.id === m[1]; })) { A.pid = m[1]; A.own = m[2] ? m[2].split(',') : []; }
    A.custom = Object.assign({ base: {}, w: {}, ideal: {} }, A.custom || {});
    A.sel = null; A.manual = {};
    if (A.play !== 'manual') A.play = 'auto';
  }

  /* ---------- page history: back and forward arrows, and the device's own back button ---------- */
  var navI = 0, navMax = 0;
  function navState() { return { i: navI, pid: A.pid, tab: A.tab, lib: A.lib }; }
  function navPush() {
    navI += 1; navMax = navI;
    try { history.pushState(navState(), '', location.href); } catch (e) {}
    save(); navButtons();
  }
  function navButtons() {
    var b = $('#navBack'), f = $('#navFwd');
    if (b) b.disabled = navI <= 0;
    if (f) f.disabled = navI >= navMax;
  }
  window.addEventListener('popstate', function (e) {
    var st = e.state;
    if (!st || st.i === undefined) return;
    navI = st.i;
    if (st.pid !== A.pid) { A.pid = st.pid; if (st.pid) { A.own = []; replay(); } }
    A.tab = st.tab || 'board'; A.lib = st.lib || 'players'; A.sel = null; A.manual = {};
    $('#modal').hidden = true;
    save(); render(); window.scrollTo(0, 0);
  });

  /* ---------- model assembly: defaults + user edits + live signals ---------- */
  function activeSignals() {
    var d = L.get();
    if (!A.live || !d || !d.signals) return [];
    return d.signals.filter(function (s) { return !A.sigOff[s.id]; });
  }
  function build() {
    var m = JSON.parse(JSON.stringify(M));
    m.dims.forEach(function (d) { if (A.custom.base[d.id] !== undefined) d.base = A.custom.base[d.id]; });
    m.players.forEach(function (p) {
      Object.keys(A.custom.w[p.id] || {}).forEach(function (k) { p.w[k] = A.custom.w[p.id][k]; });
      Object.keys(A.custom.ideal[p.id] || {}).forEach(function (k) { p.ideal[k] = A.custom.ideal[p.id][k]; });
    });
    activeSignals().forEach(function (s) {
      if (s.dim && s.adj) m.dims.forEach(function (d) { if (d.id === s.dim) d.base = E.clamp(d.base + s.adj); });
      if (s.weight) m.players.forEach(function (p) { if (p.id === s.weight.player) s.weight.dims.forEach(function (k) { p.w[k] = (p.w[k] || 0) * s.weight.factor; }); });
    });
    /* Live agenda: a move whose subject is climbing the world's news gets a
       slightly better chance of working; one whose subject is fading, slightly
       worse. */
    if (A.live && !A.sigOff.momentum) m.moves.forEach(function (mv) {
      var ag = L.agenda(mv.topic), k = ag ? ag.k : null, ps = mv.ps === undefined ? 0.8 : mv.ps;
      if (k === 'rising') mv.ps = Math.min(0.95, ps + 0.05);
      else if (k === 'fading') mv.ps = Math.max(0.05, ps - 0.03);
    });
    /* What each government has been saying lately tilts its choices a little. */
    if (A.live && !A.sigOff.voices) { var vs = L.voices(); m.players.forEach(function (pl) { pl.lean = vs[pl.id] ? vs[pl.id].lean : 0; }); }
    C = E.compile(m);
    replay();
  }

  /* ---------- live evidence on the subject of a move ---------- */
  function wantTopics(first) {
    var list = [];
    function add(t) { if (t && M.topics[t]) list.push({ id: t, q: M.topics[t].q, must: M.topics[t].must, sub: M.topics[t].sub }); }
    if (first && M.topics[first] && M.topics[first].own) { add(first); L.want(list, true); list = []; }
    Object.keys(M.topics).forEach(function (t) { if (M.topics[t].own) add(t); });
    L.want(list, false);
  }
  function momentumName(k) { return { rising: T('rising'), steady: T('steady'), fading: T('fading') }[k] || ''; }
  function momentumTag(k) { return '<span class="tag ' + (k === 'rising' ? 'good' : k === 'steady' ? 'info' : 'warn') + '">' + momentumName(k) + '</span>'; }
  function evidence(m) {
    if (m.hold || !m.src.topic) return '';
    var id = m.src.topic, tp = M.topics[id], ag = L.agenda(id), rp = L.reports(id, tp), base = M0move(m.id), d = L.get() || {};
    var h = '<section class="card"><h3>' + T('Live evidence: {0}', esc(tp.name)) + '</h3><p class="help">' + T('What the world is paying attention to on the subject of this move right now: how many people a day are reading the reference articles on it (Wikimedia), and the current headlines on it, read directly from Greek Cypriot, Turkish Cypriot and Greek newspapers and from the GDELT news index. Fetched by your device and renewed every few hours.') + '</p>';
    if (!ag && !rp.length && !d.attn && !d.news && !d.press) return h + '<p class="help">' + (navigator.onLine === false ? T('You are offline and no evidence on this subject has been saved yet.') : T('Fetching current evidence… it appears here in a few seconds.')) + '</p></section>';
    if (ag) {
      h += '<div class="kv"><div><b>' + ag.r7.toLocaleString(locale()) + '</b><span>' + T('readers a day, last 7 days') + '</span></div><div><b>' + ag.r28.toLocaleString(locale()) + '</b><span>' + T('readers a day, 4 weeks before') + '</span></div><div><b class="' + cls(ag.ratio - 1, 0.2) + '">' + sgn((ag.ratio - 1) * 100, 0) + '%</b><span>' + T('change in attention') + ' ' + momentumTag(ag.k) + '</span></div></div>' + spark(ag.series, 'var(--info)');
      var eff = !A.live || A.sigOff.momentum ? T('Live adjustment is switched off, so the chance of success is unchanged.') :
        ag.k === 'rising' ? T('Attention to this subject is up by a quarter or more, so decision-makers have reason and cover to act: chance of success raised from {0} to {1}.', pct(base), pct(m.ps)) :
        ag.k === 'fading' ? T('Attention to this subject has dropped by a fifth or more, so an initiative has less to carry it: chance of success lowered from {0} to {1}.', pct(base), pct(m.ps)) :
        T('Attention is steady: chance of success unchanged at {0}.', pct(m.ps));
      h += '<p style="margin-top:8px"><b>' + T('Effect on the result:') + '</b> ' + eff + '</p>';
    } else h += '<p class="help">' + T('Readership figures for this subject are not available yet; the chance of success is unchanged.') + '</p>';
    function items(f, n) { return rp.filter(f).slice(0, n).map(function (a) { return '<li><a href="' + esc(a.url) + '" target="_blank" rel="noopener" lang="' + a.lang + '">' + esc(a.title) + '</a> <span class="help">' + esc(a.domain) + ' · ' + esc(a.date) + '</span></li>'; }).join(''); }
    rp = rp.slice().sort(function (x, y) { return (y.lang === I18N.lang) - (x.lang === I18N.lang) || (x.date < y.date ? 1 : x.date > y.date ? -1 : 0); });
    var said = items(function (a) { return a.said; }, 3), meet = items(function (a) { return a.meet && !a.said; }, 3), rest = items(function (a) { return !a.said && !a.meet; }, 3);
    if (said) h += '<h3>' + T('What is being said') + '</h3><ul class="news">' + said + '</ul>';
    if (meet) h += '<h3>' + T('Meetings and conferences') + '</h3><ul class="news">' + meet + '</ul>';
    if (rest) h += '<h3>' + T('Other current reports') + '</h3><ul class="news">' + rest + '</ul>';
    if (!rp.length) h += '<p class="help">' + (tp.own && L.pending(id) ? T('Looking for current headlines on this subject…') : T('No headlines plainly on this subject in the last 21 days.')) + '</p>';
    else h += '<p class="help">' + T('{0} headlines on this subject in the last 21 days, from newspapers and the news index. Headlines are shown as published, those in your language first.', rp.length) + '</p>';
    return h + '</section>';
  }
  function M0move(id) { var r = M.moves.filter(function (x) { return x.id === id; })[0]; return r && r.ps !== undefined ? r.ps : 0.8; }
  function locale() { return I18N.lang === 'en' ? 'en-GB' : I18N.lang; }
  function replay() {
    S = E.newState(C); stack = []; cache = {};
    var kept = [];
    if (A.pid) A.own.forEach(function (entry) {
      var parts = String(entry).split('~'), id = parts[0], mv = C.moves[id], forced = null;
      if (!mv || mv.p !== A.pid || E.blocked(C, S, mv)) return;
      parts.slice(1).forEach(function (kv) { var a = kv.split('='); if (C.players[a[0]] && C.moves[a[1]]) { forced = forced || {}; forced[a[0]] = a[1]; } });
      var r = E.round(C, S, A.pid, id, { deep: true, forced: forced });
      r.manual = !!forced;
      stack.push({ S: S, r: r }); S = r.state; kept.push(entry);
    });
    A.own = kept;
  }

  function recs() {
    if (!cache.rec) {
      cache.rec = E.recommend(C, S, A.pid, { horizon: 3, mode: A.mode });
      var hold = cache.rec.filter(function (r) { return r.m.hold; })[0];
      cache.rec.forEach(function (r) { r.rel = r.gain - (hold ? hold.gain : 0); });
    }
    return cache.rec;
  }
  function recFor(id) { return recs().filter(function (r) { return r.m.id === id; })[0]; }

  /* The replies the user has chosen for the other players (manual play). */
  function forcedMap() {
    var f = {};
    C.order.forEach(function (q) {
      if (q === A.pid) return;
      var v = A.manual[q];
      if (v === 'auto') return;
      f[q] = v && C.moves[v] && !E.blocked(C, S, C.moves[v]) ? v : q + '.hold';
    });
    return f;
  }

  /* The step-by-step guide on each page is open the first time the page is
     visited and folded away afterwards, to leave the room to the content. */
  function seenPage(title) {
    var k = 'cy.seen.' + A.tab, was = false;
    try { was = localStorage.getItem(k) === '1'; localStorage.setItem(k, '1'); } catch (e) {}
    if (seenPage.now === A.tab) return false;      /* still on the first visit */
    if (!was) seenPage.now = A.tab;
    return was;
  }

  /* Every page opens with what it shows and how to use it. */
  function intro(title, lead, steps) {
    return '<section class="card intro"><h1>' + title + '</h1><p class="lead">' + lead + '</p>' +
      (steps ? '<details class="explain"' + (seenPage(title) ? '' : ' open') + '><summary>' + T('How to use this page') + '</summary><ol class="list">' + steps.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ol></details>' : '') + '</section>';
  }

  /* ---------- small renderers ---------- */
  function outcomeOf(x) { return M.outcomes[E.classify(C, x)]; }

  function gauges(x, ghost, pid) {
    return '<div class="gauges">' + M.dims.map(function (d, i) {
      var v = x[i], g = ghost ? ghost[i] : null, ideal = pid ? C.players[pid].ideal[i] : null, gh = '';
      if (g !== null && Math.abs(g - v) >= 0.5) {
        var lo = Math.min(v, g), w = Math.abs(g - v), toward = ideal === null ? g > v : Math.abs(g - ideal) < Math.abs(v - ideal);
        gh = '<span class="ghost ' + (toward ? 'up' : 'down') + '" style="left:' + lo + '%;width:' + w + '%"></span>';
      }
      return '<div class="g" title="' + esc(d.desc) + '"><div class="gl"><b>' + esc(d.name) + '</b><span class="num">' + Math.round(v) +
        (g !== null && Math.abs(g - v) >= 0.5 ? ' → <b class="' + (gh.indexOf('up') > 0 ? 'good' : 'bad') + '">' + Math.round(g) + '</b>' : '') + '</span></div>' +
        '<div class="track"><span class="fill" style="width:' + v + '%"></span>' + gh + (ideal !== null && C.players[pid].w[i] > 0.02 ? '<span class="ideal" style="left:' + ideal + '%" title="' + esc(T('Your ideal point')) + '"></span>' : '') + '</div>' +
        '<div class="ends"><span>' + esc(d.lo) + '</span><span>' + esc(d.hi) + '</span></div></div>';
    }).join('') + '</div>';
  }

  function fxChips(m) {
    var out = m.fx.map(function (f) { return '<span class="' + (f[1] > 0 ? 'up' : 'down') + '">' + esc(dim(f[0]).short || dim(f[0]).name) + ' ' + sgn(f[1], 0) + '</span>'; });
    return '<div class="fx">' + out.join('') + '</div>';
  }

  function stance(a) { return a > 0.25 ? 'ally' : a < -0.25 ? 'opp' : 'swing'; }
  function STANCE(st) { return { ally: T('With you'), opp: T('Against you'), swing: T('Swing') }[st]; }
  function stanceLow(st) { return { ally: T('with you'), opp: T('against you'), swing: T('swing') }[st]; }

  function spark(series, color) {
    if (!series || series.length < 2) return '';
    var mn = Math.min.apply(null, series), mx = Math.max.apply(null, series), r = mx - mn || 1;
    var pts = series.map(function (v, i) { return (i / (series.length - 1) * 100).toFixed(1) + ',' + (40 - (v - mn) / r * 36 - 2).toFixed(1); }).join(' ');
    return '<svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>';
  }

  /* ---------- header / tabs ---------- */
  function langOptions(names) {
    return I.codes.map(function (c) { return '<option value="' + c + '"' + (c === I.lang ? ' selected' : '') + '>' + esc((names ? I.names : I.labels)[c]) + '</option>'; }).join('');
  }
  /* The fixed parts of the page, which index.html carries in English. */
  function fixed() {
    function set(sel, attrs, text) {
      var el = $(sel);
      if (!el) return;
      Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
      if (text !== undefined) el.textContent = text;
    }
    document.title = T('Cyprus Strategy Board — game-theory decision support');
    set('#navBack', { 'aria-label': T('Back to the previous page'), title: T('Back') });
    set('#navFwd', { 'aria-label': T('Forward to the next page'), title: T('Forward') });
    set('.top .brand', { 'aria-label': T('Cyprus Strategy Board, choose stakeholder') });
    set('.top .brand b', null, T('Cyprus Strategy Board'));
    set('#net', { title: T('Connection and data freshness') });
    set('#installBtn', null, T('Install app'));
    set('.top [data-a="theme"]', { 'aria-label': T('Switch light or dark theme'), title: T('Light / dark') });
    set('#tabs', { 'aria-label': T('Sections') });
    set('#lang', { 'aria-label': T('Language'), title: T('Language') });
    set('#boot', null, T('Setting up the board…'));
    var s = $('#lang');
    if (s) { if (!s.options.length) s.innerHTML = langOptions(); s.value = I.lang; }
  }
  function chrome() {

    h += '<section class="card"><h2>' + T('Critical path, step by step') + '</h2><p class="help">' + T('Your recommended moves in order. Replies in green help you, in red hurt you; the percentage is how likely the computer thinks each reply is.') + '</p><ol class="steps">' + p.steps.map(function (r, i) {
      var acts = r.replies.filter(function (y) { return !y.chosen.m.hold; }), o = outcomeOf(r.after), du = E.utility(C, A.pid, r.after) - E.utility(C, A.pid, r.before);
      return '<li><b>' + esc(r.move.src.name) + '</b> <span class="tag">' + (r.move.hold ? T('wait') : T('{0} success', pct(r.move.ps))) + '</span><br><span class="help">' + esc(r.move.src.desc) + '</span>' +
        '<div style="margin:6px 0;font-size:.86rem">' + (acts.length ? T('<b>Predicted replies:</b> {0}', acts.map(function (y) { var im = E.utility(C, A.pid, y.after) - E.utility(C, A.pid, y.before); return '<span class="' + cls(im) + '">' + esc(P(y.pid).short) + ' — ' + esc(y.chosen.m.src.name) + ' (' + pct(y.chosen.p) + ')</span>'; }).join('; ')) : T('All other players hold.')) + '</div>' +
        '<span class="tag" style="color:' + o.color + '">' + o.icon + ' ' + esc(o.name) + '</span> <span class="num ' + cls(du) + '">' + T('your payoff {0}', sgn(du)) + '</span></li>';
    }).join('') + '</ol>' + (p.steps[0] && !p.steps[0].move.hold ? '<button class="btn accent" data-a="playfirst">' + T('Play step 1 on the board') + '</button>' : '') + '</section>';

    h += '<section class="card"><h2>' + T('Where the position ends up') + '</h2><p class="help">' + T('Start (blue bar) to end of the best path (coloured band). ▼ marks your ideal.') + '</p>' + gauges(S.x, p.s.x, A.pid) + '</section>';

    function odds(mc) {
      var keys = Object.keys(M.outcomes).filter(function (o) { return mc.odds[o]; });
      return '<div class="stack">' + keys.map(function (o) { return '<i style="width:' + mc.odds[o] * 100 + '%;background:' + M.outcomes[o].color + '" title="' + esc(M.outcomes[o].name) + ' ' + pct(mc.odds[o]) + '"></i>'; }).join('') + '</div><div class="legend">' +
        keys.sort(function (a, b) { return mc.odds[b] - mc.odds[a]; }).map(function (o) { return '<span><i style="background:' + M.outcomes[o].color + '"></i>' + esc(M.outcomes[o].name) + ' <b class="num">' + pct(mc.odds[o]) + '</b></span>'; }).join('') + '</div>';
    }
    function range(mc) { return T('Your payoff: pessimistic {0} · typical {1} · optimistic {2}', mc.p10.toFixed(0), mc.p50.toFixed(0), mc.p90.toFixed(0)); }
    h += '<section class="card"><h2>' + T('Odds, allowing for surprises') + '</h2><p class="help">' + T('{0} simulated futures over {1} rounds. In each one, moves can fail and players sometimes pick their second or third choice, in proportion to how close the options are.', k.mc.runs, k.mc.horizon) + '</p>' +
      '<h3>' + T('Following the best path') + '</h3>' + odds(k.mc) + '<p class="help num">' + range(k.mc) + '</p>' +
      '<h3 style="margin-top:12px">' + T('If you only wait') + '</h3>' + odds(k.mc0) + '<p class="help num">' + range(k.mc0) + '</p></section>';
    return h;
  }

  /* ---------- analysis ---------- */
  function swot(rec) {
    var p = P(A.pid), cp = C.players[A.pid], m = rec.m, r = rec.first, s = [], w = [], o = [], t = [];
    m.fx.forEach(function (f) {
      var i = f[0], toward = Math.abs(S.x[i] + f[1] - cp.ideal[i]) < Math.abs(S.x[i] - cp.ideal[i]);
      if (cp.w[i] < 0.03) return;
      (toward ? s : w).push(toward ? T('The move itself shifts <b>{0}</b> by {1}, toward your ideal.', esc(dim(i).name), sgn(f[1], 0)) : T('The move itself shifts <b>{0}</b> by {1}, away from your ideal.', esc(dim(i).name), sgn(f[1], 0)));
    });
    if (!m.hold && m.ps >= 0.75) s.push(T('High chance of working as intended ({0}).', pct(m.ps)));
    (p.leverage || []).slice(0, 3).forEach(function (l) { s.push(esc(l)); });
    if (!m.hold && m.ps < 0.65) w.push(m.fail.length ? T('Uncertain execution: {0} chance it fails, which would shift {1}.', pct(1 - m.ps), m.fail.map(function (f) { return esc(dim(f[0]).name) + ' ' + sgn(f[1], 0); }).join(', ')) : T('Uncertain execution: {0} chance it fails.', pct(1 - m.ps)));
    if (m.src.cost >= 3) w.push(T('Significant political or financial cost to you ({0}/10).', m.src.cost));
    (p.vuln || []).slice(0, 3).forEach(function (l) { w.push(esc(l)); });
    r.replies.forEach(function (y) {
      var im = replyImpact(y), nm = '<b>' + esc(P(y.pid).name) + '</b>';
      if (y.chosen.m.hold) return;
      if (im > 0.3) o.push(T('{0} is likely ({1}) to answer with "{2}", worth {3} to you.', nm, pct(y.chosen.p), esc(y.chosen.m.src.name), sgn(im)));
      else if (im < -0.3) t.push(T('{0} is likely ({1}) to answer with "{2}", costing you {3}.', nm, pct(y.chosen.p), esc(y.chosen.m.src.name), sgn(im)));
      y.ranked.slice(1, 3).forEach(function (k) {
        if (k.p < 0.15 || k.m.hold) return;
        var after = E.apply(C, y.before, k.m, S.used, 'exp'), d = E.utility(C, A.pid, after) - E.utility(C, A.pid, y.before);
        if (d < -1) t.push(T('Less likely ({0}), {1} could instead choose "{2}" ({3} for you).', pct(k.p), nm, esc(k.m.src.name), sgn(d)));
        if (d > 1) o.push(T('Less likely ({0}), {1} could instead choose "{2}" ({3} for you).', pct(k.p), nm, esc(k.m.src.name), sgn(d)));
      });
    });
    var unlocked = [];
    C.order.forEach(function (q) { C.byPlayer[q].forEach(function (k) { if (E.blocked(C, S, k) && !E.blocked(C, r.state, k)) unlocked.push(esc(P(q).short) + ': ' + esc(k.src.name)); }); });
    if (unlocked.length) o.push(T('Opens moves that are closed today — {0}.', unlocked.slice(0, 5).join('; ')));
    var al = E.alignment(C, r.after, A.pid), al0 = E.alignment(C, S.x, A.pid);
    C.order.forEach(function (q) {
      var nm = '<b>' + esc(P(q).name) + '</b>';
      if (q === A.pid) return;
      if (stance(al0[q]) !== 'ally' && stance(al[q]) === 'ally') o.push(T('{0} moves into alignment with you after this round.', nm));
      if (stance(al0[q]) !== 'opp' && stance(al[q]) === 'opp') t.push(T('{0} moves into opposition after this round.', nm));
      if (C.players[q].veto && E.utility(C, q, r.after) < E.utility(C, q, S.x) - 1) t.push(T('{0} can block any settlement and ends the round worse off ({1}) — a defection risk.', nm, sgn(E.utility(C, q, r.after) - E.utility(C, q, S.x))));
    });
    var st = C.di.stability, ds = r.after[st] - S.x[st];
    if (ds < -3) t.push(T('Stability falls by {0} points; miscalculation becomes more likely.', Math.abs(ds).toFixed(0)));
    if (ds > 3) o.push(T('Stability rises by {0} points, widening everyone\'s room for compromise.', ds.toFixed(0)));
    if (rec.rel > 0.3) o.push(T('Three rounds out, the line that starts here is worth {0} more to you than waiting.', sgn(rec.rel, 2)));
    if (rec.rel < -0.3) t.push(T('Three rounds out, the line that starts here leaves you {0} against waiting.', sgn(rec.rel, 2)));
    function ul(a, none) { return '<ul>' + (a.length ? a.slice(0, 7).map(function (x) { return '<li>' + x + '</li>'; }).join('') : '<li class="mute">' + none + '</li>') + '</ul>'; }
    return '<div class="swot"><div class="s"><h3>' + T('Strengths <small>yours, helpful</small>') + '</h3>' + ul(s, T('No particular strength in play.')) + '</div><div class="w"><h3>' + T('Weaknesses <small>yours, harmful</small>') + '</h3>' + ul(w, T('No notable weakness exposed.')) + '</div>' +
      '<div class="o"><h3>' + T('Opportunities <small>from others</small>') + '</h3>' + ul(o, T('No supportive reply predicted this round.')) + '</div><div class="t"><h3>' + T('Threats <small>from others</small>') + '</h3>' + ul(t, T('No hostile reply predicted this round.')) + '</div></div>';
  }

  function risks(rec) {
    var r = rec.first, m = rec.m, rows = [];
    function rate(p, im) { var s = p * Math.min(10, Math.abs(im)); return s > 2.2 ? [T('High'), 'bad'] : s > 0.8 ? [T('Medium'), 'warn'] : [T('Low'), 'good']; }
    if (!m.hold && m.ps < 1) {
      var im = E.utility(C, A.pid, E.apply(C, S.x, m, S.used, 'fail')) - E.utility(C, A.pid, E.apply(C, S.x, m, S.used, 'ok'));
      rows.push([T('Your move fails to deliver'), 1 - m.ps, im, m.src.mit || T('Prepare the ground first: line up partners and a fallback before committing publicly.')]);
    }
    r.replies.forEach(function (y) {
      y.ranked.slice(0, 3).forEach(function (k) {
        if (k.m.hold || k.p < 0.12) return;
        var d = E.utility(C, A.pid, E.apply(C, y.before, k.m, S.used, 'exp')) - E.utility(C, A.pid, y.before);
        if (d < -0.8) rows.push([esc(P(y.pid).name) + ': ' + esc(k.m.src.name), k.p, d, k.m.src.counter || T('Raise the cost or lower the benefit of this reply before you move; keep a channel open to {0}.', esc(P(y.pid).name))]);
      });
    });
    rows.sort(function (a, b) { return b[1] * Math.abs(b[2]) - a[1] * Math.abs(a[2]); });
    if (!rows.length) return '<p class="help">' + T('No material risk identified for this move in the coming round.') + '</p>';
    return '<div class="tblwrap"><table><thead><tr><th>' + T('Risk') + '</th><th>' + T('Likelihood') + '</th><th>' + T('Impact on you') + '</th><th>' + T('Rating') + '</th><th>' + T('Mitigation') + '</th></tr></thead><tbody>' + rows.slice(0, 8).map(function (x) {
      var rt = rate(x[1], x[2]);
      return '<tr><td>' + x[0] + '</td><td class="c">' + pct(x[1]) + '</td><td class="c bad">' + sgn(x[2]) + '</td><td class="c"><span class="tag ' + rt[1] + '">' + rt[0] + '</span></td><td>' + x[3] + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  }

  /* Dimensions are grouped by the English lens key; only the heading shown is translated. */
  function lens(rec) {
    var r = rec.first, groups = {};
    M.dims.forEach(function (d, i) { (groups[d.lens] = groups[d.lens] || []).push(i); });
    return '<div class="tblwrap"><table><thead><tr><th>' + T('Lens') + '</th><th>' + T('What changes this round') + '</th></tr></thead><tbody>' + Object.keys(groups).map(function (g) {
      var parts = groups[g].map(function (i) { var d = r.after[i] - S.x[i]; return Math.abs(d) < 0.5 ? null : T('{0} <b class="num">{1}</b> (to {2})', esc(dim(i).name), sgn(d, 0), Math.round(r.after[i])); }).filter(Boolean);
      return '<tr><th>' + esc((M.lens || {})[g] || g) + '</th><td>' + (parts.length ? parts.join('; ') : '<span class="mute">' + T('No material change') + '</span>') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  }

  function matrix() {
    var opp = A.opp && A.opp !== A.pid ? A.opp : (A.pid === 'TR' ? 'ROC' : 'TR');
    var mx = E.matrix(C, S, A.pid, opp, 5);
    function isNe(i, j) { return mx.ne.some(function (n) { return n[0] === i && n[1] === j; }); }
    var h = '<label class="help">' + T('Against') + ' <select data-c="opp">' + C.order.filter(function (q) { return q !== A.pid; }).map(function (q) { return '<option value="' + q + '"' + (q === opp ? ' selected' : '') + '>' + esc(P(q).name) + '</option>'; }).join('') + '</select></label>' +
      '<div class="tblwrap" style="margin-top:8px"><table><thead><tr><th>' + esc(P(A.pid).short) + ' ↓ / ' + esc(P(opp).short) + ' →</th>' + mx.B.map(function (b) { return '<th>' + esc(b.src.name) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      mx.A.map(function (a, i) { return '<tr><th>' + esc(a.src.name) + '</th>' + mx.cells[i].map(function (c, j) { return '<td class="c' + (isNe(i, j) ? ' ne' : '') + '">' + sgn(c.a - mx.base.a) + ' / ' + sgn(c.b - mx.base.b) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
    var pairs = mx.ne.map(function (n) { return T('"{0}" against "{1}"', esc(mx.A[n[0]].src.name), esc(mx.B[n[1]].src.name)); }).join('; ');
    h += '<p class="help">' + T('Each cell: your payoff change / theirs, if both play those moves and nobody else acts.') + ' ';
    h += (!mx.ne.length ? T('No pure-strategy equilibrium among these options: each side keeps wanting to switch, so expect manoeuvring.') : mx.ne.length > 1 ? T('Highlighted: equilibria — neither side can do better by switching alone ({0}).', pairs) : T('Highlighted: the equilibrium — neither side can do better by switching alone ({0}).', pairs)) + ' ';
    if (mx.domA >= 0) h += T('Your dominant option: "{0}" is at least as good whatever they do.', esc(mx.A[mx.domA].src.name)) + ' ';
    if (mx.domB >= 0) h += T('Their dominant option: "{0}".', esc(mx.B[mx.domB].src.name));
    return h + '</p>';
  }

  function map() {
    var al = E.alignment(C, S.x, A.pid), W = 320, H = 220;
    var pts = C.order.filter(function (q) { return q !== A.pid; }).map(function (q) {
      var x = 30 + (al[q] + 1) / 2 * (W - 50), y = H - 26 - C.players[q].power / 100 * (H - 46);
      return '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="11" fill="' + P(q).color + '"/><text x="' + x.toFixed(0) + '" y="' + (y + 3).toFixed(0) + '" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">' + esc(P(q).short) + '</text>';
    }).join('');
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:760px;height:auto;display:block;margin:0 auto" role="img" aria-label="' + esc(T('Stakeholder map: power against alignment with you')) + '">' +
      '<rect x="30" y="10" width="' + (W - 50) / 2 + '" height="' + (H - 36) + '" fill="var(--opp)" opacity=".08"/><rect x="' + (30 + (W - 50) / 2) + '" y="10" width="' + (W - 50) / 2 + '" height="' + (H - 36) + '" fill="var(--ally)" opacity=".08"/>' +
      '<line x1="30" y1="' + (H - 26) + '" x2="' + (W - 20) + '" y2="' + (H - 26) + '" stroke="var(--mute)"/><line x1="30" y1="10" x2="30" y2="' + (H - 26) + '" stroke="var(--mute)"/>' +
      '<text x="34" y="' + (H - 8) + '" font-size="9" fill="var(--mute)">' + T('against you') + '</text><text x="' + (W - 22) + '" y="' + (H - 8) + '" font-size="9" fill="var(--mute)" text-anchor="end">' + T('with you') + '</text>' +
      '<text x="12" y="18" font-size="9" fill="var(--mute)" transform="rotate(-90 12 18)" text-anchor="end">' + T('more power ↑') + '</text>' + pts + '</svg>' +
      '<p class="help">' + T('Upper right: strong partners — keep them close. Upper left: strong opponents — the players whose incentives you must change. Lower half: weaker voices that still shape legitimacy.') + '</p>';
  }

  function sens() {
    if (!cache.sens) {
      setTimeout(function () { cache.sens = E.sensitivity(C, S, A.pid, { mode: A.mode, runs: 24 }); if (A.tab === 'analysis') render(); }, 60);
      return '<p class="loading">' + T('Stress-testing the recommendation…') + '</p>';
    }
    var s = cache.sens, top = C.moves[s.top], others = Object.keys(s.wins).filter(function (k) { return k !== s.top; }).sort(function (a, b) { return s.wins[b] - s.wins[a]; });
    var span = Math.max.apply(null, s.tornado.map(function (t) { return Math.max(Math.abs(t.lo - s.baseScore), Math.abs(t.hi - s.baseScore)); }).concat([0.5]));
    var h = '<p>' + T('With every weight, ideal point and move effect randomly disturbed ({0} trials), "<b>{1}</b>" stays the top move in {2} of them.', s.runs, esc(top.src.name), '<b class="' + (s.robustness >= 0.6 ? 'good' : s.robustness >= 0.35 ? 'warn' : 'bad') + '">' + pct(s.robustness) + '</b>') + ' ' +
      (s.robustness >= 0.6 ? T('The recommendation is robust.') : s.robustness >= 0.35 ? T('The recommendation is fairly sensitive to assumptions; weigh the alternatives.') : T('The recommendation is fragile — several moves are close. Treat it as one good option, not the answer.')) + '</p>';
    if (others.length) h += '<p class="help">' + T('Challengers: {0}', others.slice(0, 3).map(function (k) { return esc(C.moves[k].src.name) + ' (' + pct(s.wins[k] / s.runs) + ')'; }).join(' · ')) + '</p>';
    h += '<h3>' + T('Which starting conditions matter most') + '</h3><div class="torn">' + s.tornado.slice().sort(function (a, b) { return Math.abs(b.hi - b.lo) - Math.abs(a.hi - a.lo); }).map(function (t) {
      var a = (t.lo - s.baseScore) / span * 50, b = (t.hi - s.baseScore) / span * 50, d = M.dims[C.di[t.dim]];
      function seg(v, col) { return '<i style="' + (v >= 0 ? 'left:50%' : 'right:50%') + ';width:' + Math.abs(v) + '%;background:var(--' + col + ')"></i>'; }
      return '<span>' + esc(d.name) + '</span><span class="tb">' + seg(a, 'warn') + seg(b, 'info') + '</span><span class="num help">' + sgn(t.lo - s.baseScore) + ' / ' + sgn(t.hi - s.baseScore) + '</span>';
    }).join('') + '</div><p class="help">' + T('Effect on your best achievable score if each dimension started 15 points lower (amber) or higher (blue).') + '</p>';
    return h;
  }

  function precedents(m) {
    var ids = m.src.prec || [], list = M.precedents.filter(function (p) { return ids.indexOf(p.id) >= 0; });
    if (!list.length) list = M.precedents.filter(function (p) { return (p.cats || []).indexOf(m.src.cat) >= 0; }).slice(0, 3);
    if (!list.length) return '';
    return '<section class="card"><h2>' + T('What history says about moves like this') + '</h2><p class="help">' + T('Real past attempts that resemble this move, on Cyprus or elsewhere, with how they ended and the lesson. Tap one to open it.') + '</p>' + list.map(precItem).join('') + '</section>';
  }
  function precItem(p) {
    var w = (L.get() || {}).wiki || {}, x = w[p.wiki], out = { success: T('success'), failure: T('failure'), mixed: T('mixed') }[p.outcome] || p.outcome;
    return '<details class="lib-item"><summary>' + esc(p.name) + ' <span class="tag ' + (p.outcome === 'success' ? 'good' : p.outcome === 'failure' ? 'bad' : 'warn') + '">' + esc(out) + '</span> <span class="meta">' + esc(p.year) + '</span></summary><p>' + T('<b>Lesson:</b> {0}', esc(p.lesson)) + '</p>' +
      (x ? '<p class="help">' + esc(x.extract) + ' <a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + T('Wikipedia') + '</a></p>' : '') + '</details>';
  }

  function viewAnalysis() {
    var R = recs(), rec = (A.sel && recFor(A.sel)) || R[0];
    var h = intro(T('Analysis'), T('A full assessment of one move for <b>{0}</b> in the current position: strengths and weaknesses, risks, how it plays against a chosen opponent, who holds power, and how far the advice can be trusted. All of it is calculated with the computer playing the other stakeholders.', esc(P(A.pid).name)), [
      T('Pick the move to analyse in the first box (it starts on the move you selected on the board, or the engine\'s choice).'),
      T('Read each section from top to bottom; every section begins with a line saying what it shows.'),
      T('Use <b>Print / save PDF</b> to keep or share the assessment.')]) +
      '<section class="card"><div class="row between"><h2>' + T('Move under analysis') + '</h2><button class="btn small" data-a="print">' + T('Print / save PDF') + '</button></div>' +
      '<label class="help">' + T('Move under analysis') + ' <select data-c="sel">' + R.map(function (r) { return '<option value="' + r.m.id + '"' + (r === rec ? ' selected' : '') + '>' + esc(r.m.src.name) + ' (' + sgn(r.rel, 2) + ')</option>'; }).join('') + '</select></label>' +
      '<p style="margin-top:8px">' + esc(rec.m.src.desc) + '</p>' + verdict(rec) + '</section>';
    h += '<section class="card"><h2>' + T('SWOT for {0}', esc(P(A.pid).name)) + '</h2><p class="help">' + T('Generated from this exact position: your own leverage and exposure, plus what the other players are predicted to do in reply.') + '</p>' + swot(rec) + '</section>';
    h += '<section class="card"><h2>' + T('Risk register') + '</h2><p class="help">' + T('What could go wrong with this move in the coming round, how likely it is, how much it would cost you, and what to do about it.') + '</p>' + risks(rec) + '</section>';
    h += '<section class="card"><h2>' + T('Head-to-head payoff matrix') + '</h2><p class="help">' + T('The classic game-theory table: your five strongest options against one opponent\'s five strongest. Choose the opponent below.') + '</p>' + matrix() + '</section>';
    h += '<div class="grid two"><section class="card"><h2>' + T('Stakeholder map') + '</h2><p class="help">' + T('Every other stakeholder placed by how much power it has (height) and whether it currently pulls with you or against you (left to right).') + '</p>' + map() + '</section><section class="card"><h2>' + T('How sure is the recommendation?') + '</h2><p class="help">' + T('A stress test. The model\'s assumptions are judgments, so this re-runs the advice many times with those judgments deliberately disturbed.') + '</p>' + sens() + '</section></div>';
    h += '<section class="card"><h2>' + T('Political, security, economic, energy, legal and social lens') + '</h2><p class="help">' + T('The same result sorted by field, so a specialist in any one area can see what changes for them after this round.') + '</p>' + lens(rec) + '</section>';
    h += evidence(rec.m) + precedents(rec.m);
    return h;
  }
