s, corporate exits from the north","Risk control: pre-coordinate NATO issue triage; keep alliance deliverables separate"]},{"p":"Phase III – Legal isolation and formal off-ramp","w":"Day 271–540","a":["Pass the Occupied Cyprus Act; Presidential Executive Determination that the north is 'occupied territory'","Publish tiered, reversible U.S. Sanctions Framework","Table the Phased Withdrawal Protocol (3–5 years; UN/OSCE/EU verification)","Announce the Reunification Trust Fund (Cyprus–U.S.–EU capitalised)","Expand naval/air access agreements and pre-positioning"],"g":["Milestone A (Month 18): construction freeze + troop baseline -> PWP signing bonus (trade facilitation projects in Turkey's southeast) / technical customs-union review","Milestone B (Month 24): Varosha monitored opening + 5,000 troops withdrawn -> limited sanctions relief on named entities","Milestone C (Month 36): dissolution of occupation-specific paramilitary/policing -> U.S. export-import credit lines for Turkish non-defence SMEs","Milestone D (Month 48): border regime normalisation + 80% troop withdrawal -> backing for EU–Turkey technical talks (aviation, customs)","Milestone E (Month 60): full withdrawal and handover of military sites -> major RTF disbursement, Turkey–Cyprus trade corridor","Stick: automatic snap to next sanctions tier if a milestone is missed by 90 days; G7 export-credit freezes"]},{"p":"Phase IV – Withdrawals and asset transitions","w":"Day 541–1080","a":["Sequenced base closures and site handovers; UN/OSCE monitoring detachments; 'Cyprus Gendarmerie' units trained by the EU for transitional security","Escrow for contested titles; claims tribunal with capped timelines; RTF-funded public works in the north","Maritime and air safety compacts; AIS/ADS-B transparency corridor across the island"],"g":["Carrots: RTF tranches, graduated delistings, U.S. non-defence commercial missions to Turkey","Sticks: freeze tranches, broaden entity lists, enhanced export controls if inspections obstructed","Metrics: sites vacated, tribunal case throughput, customs throughput"]},{"p":"Phase V – Finalisation and normalisation","w":"Day 1081–1825","a":["Certification of full withdrawal; termination of occupation-related measures","Long-term Cyprus–Turkey non-aggression and maritime safety pact witnessed by U.S./EU","Integration of northern infrastructure; EU regional funds unlocked; private capital crowd-in","U.S.–Cyprus strategic review converting rotational footprints into an enduring Mediterranean Stability Hub"],"g":["EU Council acknowledgment; U.S. certification to Congress","Hard criteria: zero foreign troops, verified base closures, normalised customs/traffic, functioning claims tribunal, incident-free maritime and air corridors for 12+ months","Snap-back authority retained for 5 additional years"]},{"p":"Escalation ladder if Turkey refuses cooperation","w":"Parallel to phases","a":["Tier 1: expanded compliance advisory; insurance/reinsurance cautions for North-linked commerce","Tier 2: additional entity designations; export-control tightening; coordinated G7 export-credit holds","Tier 3: U.S. defence procurement re-routed away from Turkish supply chains; broader financial measures on state-linked banks tied to the north","Tier 4 (ceiling): secondary sanctions on a narrow ring of occupation-enabling entities"],"g":["Rule: always pair sticks with a credible off-ramp (pause/reversal on verified steps)"]},{"p":"U.S. sanctions playbook ladder (Part 7)","w":"Week 0 to Month 6","a":["Week 0–2: announce intent; OFAC/BIS advisories; 7031(c) visa bans; Global Magnitsky designations on top targets","Week 3–6: Cyprus Occupation Executive Order (Crimea-style); first wave of banks/firms; Entity List/MEU adds","Month 2–4: expand CAATSA; §311 special measures on complicit financial rails","Month 4–6: maritime/aviation and sectoral financing directives; condition F-16 pipeline","Snap option: temporary ministry designations, lifted if benchmarks met"],"g":["Verifiable de-escalation steps trigger lifting"]},{"p":"Phased Withdrawal Protocol schedule (Section 1.8 version)","w":"Month 0–60 (compressible to 36)","a":["Month 0–3: tribunal law and RTF charter (Cyprus); standstill and baseline data (Turkey); verifiers deployed","Month 3–6: Varosha safety plan; cantonment; Development Facility set up","Month 6–12: claims intake opens; first withdrawals; SAR drills","Month 12–18: utilities works; two base closures and demining; SME credit line design","Month 18–30: border pilot normalisation; paramilitary dissolved, 60% out; INCSEA-style rules enforced","Month 30–42: mixed patrols; 80% out, major bases closed; EU technical talks support","Month 42–60: full handover; 100% out and remediation sign-off; final verification and sunset report"],"g":["Milestone A Month 6–12 (~10–15% reduction) -> prep funds and planning grants","Milestone B Month 12–18 (~20%) -> Development Facility tranche 1, RTF early works","Milestone C Month 18–30 (~60%) -> SME credit lines, bigger RTF infrastructure","Milestone D Month 30–42 (~80%) -> EU–Turkey technical talks support","Milestone E Month 42–60 (100%) -> final tranches, sunset of sticks"]},{"p":"Bulwark Annex bolt-on steps (before engagement)","w":"Pre-engagement","a":["Step 1: Cabinet red lines and enabling laws","Step 2: attach Bulwark Annex to DCA, SOFA, Access Annexes, SPAs/TAs, Insurance Pool and Withdrawal Protocol","Step 3: constitute verification triad and JIC; publish dashboards and 30/15-day trigger logic","Step 4: stand up escrow and the Strategic Partnership Account","Step 5: insert dispute and make-whole language in all commercial terms","Step 6: publish EU/UK compliance notes and SBA deconfliction MoU","Step 7: pre-agree the yellow/orange/red snap-back ladder and public comms text"],"g":["No U.S. privilege takes effect until verification rails exist"]}]},{"title":"A Holistic Global Strategy to Prevent Military Aggression Against Cyprus (June 2025)","thesis":"Military deterrence alone cannot protect the Republic of Cyprus from renewed aggression, chiefly from Turkey; Cyprus must instead pursue 'holistic deterrence' by embedding itself in so many global economic, legal, energy, security, humanitarian and technological systems that attacking it becomes prohibitively costly for the aggressor and for everyone else. The governing idea is 'irresistible entanglement': Cyprus should not beg for protection but make protecting it profitable and unavoidable, so that allies defend it out of self-interest. Turkey is to be handled with a mix of quiet carrots (non-energy trade, conditional energy-hub participation, face-saving off-ramps via Gulf and Israeli mediators) and silent sticks (pre-drafted elite sanctions, automatic economic, legal and cyber triggers, ambiguous tripwire defence guarantees). The conclusion calls for a 'New Cyprus Doctrine' that moves Cyprus from a reactive small state to a proactive 'micro-power' and for the strategy to be institutionalised through a National Strategy Council for Deterrence and Resilience.","strategies":[{"t":"Strategic Global 'Business Immunity Network'","a":"partner states and multinationals as co-signatories","c":"economic","s":"Cyprus quietly signs modular 'immunity' micro-agreements with major economies so that Cypriot projects in energy, maritime, banking, tourism, tech and agritech sit under each partner's economic-security umbrella. Each agreement carries an 'Automatic Economic Solidarity Clause': if a Cyprus-based project is attacked, the partner reacts economically against the aggressor. Later rebranded publicly as the 'Cyprus Strategic Economic Security Network'.","w":"Feb internal approval; Mar legal consultations abroad; Apr soft outreach to France, UAE, India, Germany; May draft sample agreements; Jun first bilateral mini-pacts (tourism, fintech, maritime, AI research); Jul add USA, Japan, Saudi Arabia under 'Business Partnership Plus' branding; Aug media soft-leaks; Sep formalise framework with 5-10 country partnerships; Oct invite MNCs; Nov public signing ceremonies in Paris, New Delhi, Berlin, Abu Dhabi, New York; Dec quietly add physical/cyber defence extension clauses.","x":[["Turkey","Hears rumours of economic 'tripwires' via controlled leaks to Reuters, Bloomberg and the FT and begins to hesitate before escalating rhetoric or action."],["USA","Via Greek-American and Cypriot-American intermediaries, gives silent agreement that damage to Cyprus-linked US investments triggers automatic economic retaliation."],["UAE / Saudi Arabia","Investments in Cypriot tourism, ports and energy hubs quietly covered by Saudi and UAE defence doctrines, arranged at private investment forums in Abu Dhabi, Dubai and Riyadh."],["India","Accepts Cyprus as its Mediterranean 'economic outpost', with defence-cyber cooperation as a bonus."],["France / Germany","Their banks' investments are embedded in Cypriot tech-finance so any attack triggers a European bank backlash."],["Israel","Venture capital enters Cypriot energy and tech under Israeli business doctrine protection."]],"b":["An attack on Cyprus is perceived as an attack on the business interests of the USA, Germany, France, UAE and others - 'massive deterrence without firing a shot'","Cyprus becomes 'untouchable' through entanglement of commercial interests rather than military force alone","Investment inflows and positioning as 'new Singapore of the Med' / global safe haven for secure business"],"r":[],"m":["Keep all actions invisible to Turkey until irreversible","Offer mutual benefit first, embed immunity clauses quietly afterwards"]},{"t":"Cyprus Global Sovereignty Partnership (CGSP) with EU-Led Defence Guarantees","a":"President of Cyprus with Defence and Foreign Affairs leadership; willing EU states (France, Germany, Italy, Greece, later Spain, Portugal, Netherlands, Sweden); European Defence Agency","c":"security","s":"A mini-treaty among willing EU states declaring that a threat to Cyprus is treated as a threat to all, triggering diplomatic, economic and if necessary military action - without naming Turkey. Publicly it is disguised as a 'Mediterranean Stability Compact / Initiative' stressing disaster response and small-state rights. The intended effect is 'ambiguous tripwire defence': Turkey can never know whether an attack triggers full EU retaliation.","w":"2025 monthly: Jan white paper; Feb private leader meetings; Mar closed-door EU foreign ministers' mini-summits; Apr draft Framework of Understanding; May align with EDA; Jun form 'EU-CGSP Circle'; Jul quiet bilateral defence addenda; Aug court Spain, Portugal, Netherlands, Sweden; Sep soft launch at UNGA side events as 'Mediterranean Stability Compact'; Oct rapid-deployment protocols and exercise simulations; Nov political declaration signed without naming Turkey; Dec push into European Council conclusions and EDA planning.","x":[["Turkey","Faces psychological and legal uncertainty; tones down public threats as risk of 'uncertain retaliation' rises."],["France","Private commitment via presidential advisers to defend Cyprus militarily if absolutely needed; leads drills with Italy."],["Germany","Silent cyber defence pact for Cypriot banks and critical infrastructure, embedded in EU cyber cooperation agreements."],["Italy","Naval commanders pre-agree fast movement of assets via private rules-of-engagement exercises."],["EU High Representative","After private briefings, states publicly that any threat to Cyprus's sovereignty would damage EU stability."],["UN","Emergency mediation mechanisms pre-arranged so Cyprus remains 'the peaceful party'."]],"b":["Credible, legally binding yet politically low-key deterrent without escalation","Discourages Turkish risk-taking","Makes each helper see protecting Cyprus as protecting 'their own power, money, security, and influence'"],"r":["Open military alliances could provoke Turkey directly (flagged by the document itself)"],"m":["Never name Turkey; stress humanitarian, rescue, peacekeeping and economic-cooperation narratives","Operate under a neutral name","Low-profile exercises"]},{"t":"Preemptive Energy Diplomacy Expansion ('Energy Web Defence')","a":"Cyprus (special 'Energy Ambassadors' - senior diplomats or energy CEOs); regional states, Gulf funds, US/EU guarantors, energy majors","c":"energy","s":"Before Turkey can isolate Cyprus over the Greece-Cyprus-Israel power cable, Cyprus rapidly multiplies energy deals with Egypt, Israel, Jordan, UAE, Saudi Arabia, the EU and the US so that damaging any Cypriot energy project harms many states and companies at once. Mechanisms include redundant Israel-Cyprus pipelines and LNG routes, Egyptian LNG processing of Cypriot gas, Gulf investment (Masdar, ACWA Power) in solar and green hydrogen, widening the EastMed Gas Forum into an EastMed Energy Forum, Exim Bank/EIB guarantees, a EUR 5 billion Cyprus-EU-Gulf Energy Stability Fund, gas-to-hydrogen R&D centres and small military-security clauses inside investment contracts. Foreign state-backed companies get small ownership stakes so they have 'skin in the game'.","w":"2025 monthly: Jan blueprint; Feb envoys to UAE, Saudi Arabia, Israel, Egypt, Jordan, EU, US; Apr MoUs with UAE and Saudi Arabia; May expand EastMed forum (Jordan, Italy, France); Jun US-EU investment guarantees; Jul public Phase I announcements (new LNG facility, solar hydrogen plant, redundant Israel-Cyprus pipelines, Cyprus-Egypt-EU LNG export agreement); Aug gas-to-hydrogen R&D centres; Sep Energy Partnership Summit in Nicosia; Oct launch Energy Stability Fund; Nov naval/air/cyber protection agreements for energy sites; Dec binding commercial agreements with at least 5 companies and 5 countries.","x":[["Turkey","Would have to confront multiple hostile energy stakeholders rather than Cyprus alone; becomes 'publicly confused and hesitant'; learns of protections through anonymous briefings to correspondents who cover Turkey."],["France / Egypt","Joint drills for rapid protection of offshore platforms and LNG terminals, disguised as search-and-rescue."],["USA / UAE","Build a silent offshore cyber defence ring around rigs and terminals via private-sector cooperation."],["US Congress","Lobbied with the doctrine 'protect Cyprus gas = protect American energy investments'."],["Energy majors","Accept co-ownership of blocks, 25-year tax stability and seats on an Energy CEO Advisory Panel; lobby home governments."]],"b":["Any threat to Cypriot energy becomes a multilateral crisis, 'not just a Cyprus problem'","Turkey cannot single out Cyprus diplomatically, economically or militarily","Energy sector becomes 'an untouchable multinational network of co-owned sovereignty'","Future-proofing through hydrogen transition"],"r":["Chinese involvement in strategic systems (document cautions to keep full control of digital, cyber, grid and fuel systems)"],"m":["Offer China only non-strategic roles (LNG tanker construction, port machinery, wind turbine parts manufacturing)","Redundant pipeline and LNG routes","'Energy disruption insurance' backed by EU or US","Side letters insulating early investors from political risk"]},{"t":"Global 'Micro-Investment' Treaty Alliances ('Cyprus 1000' programme)","a":"Cyprus - Micro-Investment Alliance Taskforce (MIAT: Finance, Foreign Affairs, Commerce, Defence ministries plus external legal advisers); special investment envoys to 100 countries","c":"economic","s":"Cyprus signs hundreds of micro-scale investment treaties worth EUR 250,000 to EUR 5 million each with dozens of countries, SMEs, cooperatives, NGOs, universities, funds and diaspora investors, so that even the smallest attack on Cyprus harms thousands of stakeholders worldwide. Three treaty templates are used - Bilateral Micro-Investment Agreement (BMIA), Cooperative Joint Venture Pact (CJVP) and Multilateral Mini-Fund Consortium Agreement (MMFCA) - each with 'Sovereignty Trigger Clauses' that activate investor-state dispute settlement (WTO, ICC, ICSID) and disruption-retaliation clauses if Cyprus is attacked. A multilingual online investment gateway takes proposals; a 'Shield List' of investors is published instantly on attack to show 'who Turkey is hurting globally'; a 'Cyprus Global Micro-Investment Atlas' is distributed to all UN missions. Slogan: 'Own a Piece of Cyprus = Own a Stake in Peace'.","w":"2025: Jan launch 'Cyprus 1000' roadmap; Feb taskforce; Mar treaty templates; Apr quiet outreach to embassies and trade attaches; May open digital platform; Jun first 100 micro-treaties (Africa, Latin America, South Asia, Balkans); Jul medium multinationals; Aug media campaign 'Cyprus Belongs to the World'; Sep trade treaties with 10+ countries and 50 countries reached; Oct defence-linked micro projects (drones, cyber, logistics); Nov diaspora investment channels; Dec publish Global Investment Atlas.","x":[["Turkey","'Paralysed from attack' by overlapping diplomatic, financial and public backlash risks worldwide."],["Small and mid-size states","Join for visibility, development benefits, visa waivers, EU/Schengen gateway access and co-branding (e.g. 'Gambia-Cyprus AI Training Center')."],["G20 members","3-5 lobbied to mention 'protection of economic investments in vulnerable democracies' in summit statements."],["NGOs","Own micro-projects and run public pressure campaigns if Cyprus is attacked."],["India","Uses micro-investments as a backdoor for military supply-chain testbeds and an informal defence-logistics pivot into the Mediterranean."],["UAE / Israeli tech startups","Take micro-labs with full operational freedom plus private non-aggression clauses binding them to influence their governments for Cyprus."]],"b":["Cyprus becomes economically 'sticky' and 'omnipresent' worldwide","Backlash comes from thousands of economic stakeholders, not just governments","'Many small hooks make a net stronger than one rope'","Nested dependencies inside EU-US tech frameworks raise the cost of attack"],"r":[],"m":["All micro-investments logged on blockchain-backed cloud servers mirrored in Germany and Singapore so ownership is traceable in a crisis"]},{"t":"EU Rapid Response Special Forces & Naval Presence Expansion for Cyprus","a":"France, Greece, Italy, Romania, Spain; EU Military Staff, EDA, EEAS, ENISA; quiet US/NATO support","c":"security","s":"Permanently station a multinational EU deterrent in Cyprus: rotating special forces (France's Commandos Marine, Greece's Z' MAK, Italy's COMSUBIN, Romania's special forces), 2-4 naval vessels on continuous patrol, 2-3 transport aircraft (A400M or C-130) plus UAV squadrons, and a Nicosia-based EU Cyber Command Cell. Legal basis is bilateral and EU-wide Status of Forces Agreements and a Cypriot law recognising EU-led military responses under Article 42.7. A 'Joint Eastern Med Rapid Response Command' and a Cyprus-based multinational battalion make the island 'a living tripwire for European defence'. Bases, ports (Limassol, Larnaca) and runways are upgraded for dual use, financed as 'resilience' investments through the EIB and EU Structural Funds.","w":"2025: Jan directive; Feb talks with France and Greece; Mar closed-door EU defence ministers' meeting; Apr silent EU military assessment mission; May draft SOFA; Jun 'Hybrid Defence Protocol' rotational deployments; Jul naval surveillance integration; Aug first joint naval-air exercises; Sep infrastructure upgrades (runway extension, drone base, command centre); Oct battalion announced; Nov cyber command wing in Nicosia or Larnaca; Dec formal EU declaration of 'Forward Defence Presence'.","x":[["Turkey","Loses surprise advantage; 'confusion in red lines = high risk in aggression'; public statements shift from aggression to 'diplomatic balance' by Q4 2025."],["France","Guarantees permanent naval rotation in return for TotalEnergies protection deals;"],["Greece","Revives a Cyprus-Greece joint command committee; one strategic defence zone without a formal treaty."],["Germany / Estonia","Merge cyber defence nodes with Cyprus; Germany co-runs military-grade cybersecurity centres."],["Italy","Uses Cyprus as forward naval base under a 'Maritime Security Memorandum' signed in Rome."],["UK","Agrees a 'Denial Clause' barring Turkish naval or intelligence use of Akrotiri."],["USA","Quiet endorsement; engineers add military-compatible reinforcements to Limassol port."],["EU Council PSC","France, Germany, Greece and Italy lead a confidential working group preparing collective military response documents."]],"b":["Immediate physical deterrence; 'any Turkish move would spark instant EU response'","EU troops airlifted anywhere in the Eastern Mediterranean within 1-2 hours","Offensive counter-cyber capability; defence of grid, undersea cables, financial systems","'NATO-lite' fortress without NATO membership"],"r":["Perception of escalation (document counters: 'What's already stationed is not escalation - it's defence readiness')"],"m":["Quiet, low-publicity deployments and drills","Disguising funding as resilience investment"]},{"t":"Turkey Reconciliation Buffer via Non-Energy Economic Treaties ('Economic Firewall')","a":"Cyprus (business envoys, Chambers of Commerce proxies) with Turkish chambers and firms; intermediaries Germany, UAE, Qatar, Saudi Arabia, Israel, UK; EU, IMF, WTO, OSCE, UNDP, ILO oversight","c":"economic","s":"Build quiet, indirect Cyprus-Turkey economic interdependence in sectors unrelated to the energy dispute - agro-trade, shipping and bunkering, tourism circuits, fintech outsourcing, vocational training, cultural co-production and a neutral Famagusta-Gazimagusa free trade corridor under UN/EU oversight - so Turkish exporters, shippers and hoteliers have something to lose. Deals are routed through third-party flags (e.g. Jordan), shell holdings in Malta or Greece and confidential MoUs with Turkish chambers that bypass Ankara. Under 'double book diplomacy' Cyprus keeps a public book (energy defence, cable sovereignty) and a private book (shared profit channels). All deals carry a pre-agreed freeze mechanism backed by third-party retaliation clauses, and Brussels inserts a trigger clause into the EU-Turkey customs union suspending trade privileges if a member state is coerced.","w":"2025: Jan strategy draft; Feb backchannel to Turkish business elite; Mar sector mapping; Apr exploratory talks via EU-Turkey customs dialogue; May pilot agreement making Cyprus a logistics hub for Turkish exports to North Africa; Jun tourism syndicates (Antalya-Limassol packages); Jul Turkish fintechs in Cypriot SEZs under firewall rules; Aug Cyprus-Turkey-Azerbaijan agritech and cold-chain corridor via Limassol; Sep convergence platform; Oct joint vocational training; Nov non-binding Cyprus-Turkey Economic Peace Charter with ILO or OSCE; Dec public framing 'Stability Through Shared Prosperity' via ECFR and Carnegie.","x":[["Turkey (government)","Feels both a threat if hostile and a reward if cooperative; avoids military action through 2025; gets a 'face-saving peace' - 'avoids looking weak while being neutralised'."],["Turkish business elite","Gains EU export access and cheap peace PR; lobbies visibly against Ankara aggression because war means asset seizure, tariffs and embargoes."],["Turkish public","Softened by leaked stories of benefits to farmers, exporters and hotel chains; target 10% polling shift away from hostility."],["UAE / Qatar","Privately assure Ankara that attacking Cyprus means loss of Gulf investment in Turkish construction, tourism and airlines; co-finance corridors."],["Germany","Mediates TUSIAD-Cypriot dialogues, stressing how fragile Turkish exports become if Cyprus closes its 'logistical backdoor to the EU'."],["EU","Grants Turkey preferential Neighbourhood aid if Cyprus-Turkey trade grows; deploys quiet trade monitoring teams (not troops)."],["IMF / WTO","Score Turkish-Cypriot trade peace initiatives positively in Turkey's risk assessments."]],"b":["Reduces Turkey's incentive to escalate over the cable or offshore gas","'Tie Turkish wallets to Cypriot peace - make war a financial suicide'","Deterrence 'without appeasement'; Turkey's feeling of being cornered is reduced","Tourism and trade revenue for Cyprus"],"r":["Political obstacles to direct Cyprus-Turkey dealings","Nationalist backlash ('nationalist noise')","Turkey may distrust direct Cypriot overtures"],"m":["Third-party flagged intermediaries and neutral shell holdings","No-political-statement firewall rules; Turkish digital services capped at 49% local content","Gulf sponsorship and guarantees","Revocable participation clauses and incentive-linked freezing mechanism","UNDP/EU/OSCE-funded programmes"]},{"t":"Global 'Neutrality Anchor' Declarations / Neutrality Anchor Clause (NAC)","a":"Cyprus (President, Attorney General, Ministries of Foreign Affairs, Justice, Commerce; InvestCyprus; Chambers of Commerce); foreign governments, MNCs, institutions as counter-signatories","c":"legal","s":"Embed a standard sovereignty clause in every future treaty, tender, PPP, investment, aid grant, export licence and procurement contract, under soft names such as 'Sovereign Stability Clause' or 'Sovereign Integrity Assurance Clause'. The clause contains sovereignty-protection wording, a non-coercion commitment, a dispute-resolution pathway, recognition of Cyprus's neutrality rights and survival under political change; MNCs undertake not to withdraw, alter supply or punish Cyprus under Turkish pressure. Procurement rules make it mandatory in foreign contracts above EUR 5M and a national bill fixes it in foreign trade law. Partners pre-commit so that any later Turkish pressure automatically conflicts with their own legal obligations - 'tie hands gently before they have reason to act against you'.","w":"2025: Jan draft template; Feb government clearance; Mar test in 3-5 low-risk MoUs (Greece, India); Apr legal consultation tour (Paris, Brussels, Delhi, Washington, Dubai); May embed in economic contracts; Jun corporate anchoring; Jul 'Sovereign Cooperation Roundtable' with 10-20 states; Aug embed in aid and development grants; Sep think-tank endorsement (ECFR, EPRS); Oct link to defence MoUs from Strategies 2 and 5; Nov soft media reveal (FT, Brookings); Dec 50+ foreign partners signed.","x":[["Turkey","Isolated in attempts to coerce Cyprus; retaliation becomes 'a legal minefield' globally; private dissuasion evident by Q4 2025."],["Partner governments","Accept because the clause keeps them from being dragged into Cyprus-Turkey crossfire;"],["MNCs","Sign for 5-10% corporate tax discounts, 20-year regulatory stability and arbitration benefits."],["UN / EU / WTO","Asked for a UN resolution on non-alignment as a sovereign right, an EU Council conclusion on member-state freedom of alliance, and a WTO ruling that geopolitical coercion violates trade neutrality."],["Ireland, Austria, Switzerland","Table a non-binding resolution 'Sovereignty in Small States: Neutrality as Autonomy'."]],"b":["Discourages countries or companies from 'choosing Turkey over Cyprus'","'Peace becomes not just moral - but contractually mandatory'","A model for all small states under pressure","Automatic countermeasures (capital restrictions, travel bans, sanctions) pre-agreed in a 'Global Disruption Penalty Matrix'"],"r":[],"m":["Non-provocative clause names","Never naming Turkey; mirroring NAC language in UN/EU texts without naming Cyprus","Intelligence-backed mapping (Israeli, French, Greek) of likely Turkish pressure points to pre-immunise those deals"]},{"t":"Cyprus-Israel-Greece Joint Economic-Defence Compact (JEDC)","a":"Governments, parliaments and military chiefs of Cyprus, Israel and Greece; observers France, USA, India, UAE","c":"security","s":"Upgrade the trilateral relationship beyond the power cable into a formal compact covering defence coordination, joint procurement, cyber and AI, naval logistics, industry and disaster response - 'the Eastern Mediterranean's NATO-lite triad'. A JEDC Council (Defence Council, Economic Coordination Office, Cyber Forum) governs it; each parliament passes a JEDC Recognition Act and the three sign a 'Mutual Infrastructure Defence Agreement' treating an attack on one state's civilian infrastructure as an attack on all. Assets include a Rapid Response Taskforce HQ in Cyprus, shared radar tracking of Turkish naval assets, an Eastern Med Cyber Fusion Center, a defence industrial cluster in Limassol or Haifa, a JEDC Investment Fund and a roughly EUR 250M Trilateral Innovation Fund.","w":"2025: Jan drafting and approvals; Feb defence staff meetings; Mar JEDC Council; May quiet signing (Nicosia, Jerusalem or Thessaloniki); Jun first naval and cyber exercises; Jul joint infrastructure launches; Sep unified procurement framework; Oct grid cybersecurity integration; Nov first trilateral investment forum in Limassol; Dec codified in national laws.","x":[["Turkey","Faces a regional 'tripwire'; issues a statement of 'concern' but avoids escalation; at least one measurable softening of rhetoric."],["Israel","Unofficially commits to protect offshore platforms, fly ISR drones, and use its cyber force to disable Turkish surveillance; gains fallback base and 0% tax testing zones."],["Greece","Merges air defence and surveillance, pre-positions arms and munitions, builds a joint coastal response force stationed in Cyprus."],["USA","Receives intelligence-sharing protocols; indirect awareness/support dissuades Turkey."],["UAE / Saudi Arabia","Agree not to criticise; may join economic sub-frameworks (green shipping, ports)."]],"b":["'If you touch Cyprus, you touch all three'","Israel and Greece locked into Cyprus's future via military, economic and technological systems","Shared threat map and Emergency Digital Warfare Teams for grid, hospital and telecom defence","1,000 young professionals exchanged annually; 'Start-up Archipelago' brand"],"r":["Misunderstanding with the US or Gulf states; conflict with EU norms"],"m":["Backchannel US notification","Showing Gulf leaders the compact is defensive and non-escalatory","EU legal layering and PESCO compatibility","Low-profile signing"]},{"t":"Cyprus-India Strategic Technology and Defence Alliance","a":"Cyprus (President, MFA) and India (NSA office, MEA, MOD, Navy, DRDO, tech firms, funds)","c":"technology","s":"Cyprus offers customs-free EU shipping access via Limassol, a trade facilitation zone, adoption of Indian e-governance platforms (Aadhaar-style ID, UPI-style payments), a rupee investment corridor and endorsement of India's UNSC bid.","w":"2025: Jan blueprint; Feb backchannel to Indian NSA; Mar strategic dialogue invitation; Apr presidential visit to New Delhi; May digital corridor; Jun confidential naval mapping and port surveillance MoU; Jul R&D fund; Aug defence industrial matchmaking summit in Limassol; Sep drone testing; Oct university tie-ups; Nov maritime monitoring centre; Dec Civil-Military Strategic Charter signed at Goa Defence Dialogue 2025.","x":[["Turkey","Increased caution in anti-Cyprus military posture; 'politically boxed in by the EastMed-Indo-Pacific axis'."],["India","Sees Cyprus as leverage against the Turkey-Pakistan alignment; privately agrees not to back Turkish positions in BRICS/G20; unpublished clause provides a joint naval alert in the Med-Red Sea corridor if Cyprus is blockaded; warns Turkey silently."],["Indian defence industry","Sets up dual-use component factories and tax-free export production zones (DI-CYP)."],["USA","Under-the-radar trilateral on Med cyber drills, port container screening and a digital surveillance grid."]],"b":["Indian political and economic weight swings toward Cyprus","'Any aggression toward Cyprus = threat to India's navy, data, investments, satellites, students, and exports'","Cyprus gains radar, sonar and anti-submarine early warning co-funded by India","Cypriot data on Turkish naval movements shared for mutual awareness"],"r":[],"m":["Maritime base presented as unarmed; listening post under technical R&D cover"]},{"t":"World Court Proactive Arbitration Filing (before any milita   function mark() { try { root.document.documentElement.lang = I.lang; } catch (e) {} }

  I.T = function (text) {

  I.onChange = function (f) { listeners.push(f); };
  I.set = function (lang) {
    if (!known(lang)) lang = 'en';
    I.lang = lang;
    try { root.localStorage.setItem(KEY, lang); } catch (e) {}
    mark();
    listeners.forEach(function (f) { try { f(lang); } catch (e) {} });
  };

  /* A copy of the model with every translatable field taken from the pack
     where the pack has it. Ids, numbers and grouping keys are left alone. */
  I.model = function (M) {

        desc: 'Προώθηση υποθέσεων για περιουσίες και ανθρώπινα δικαιώματα και πίεση στο Συμβούλιο της Ευρώπης για το ποσό που επιδικάστηκε το 2014 και δεν έχει καταβληθεί.' },
      'roc.icj': { name: 'Εκ των προτέρων δικαστική κρίση για τα θαλάσσια δικαιώματα',
        desc: 'Προσφυγή σε διαιτησία ή αίτημα γνωμοδότησης για παρεμβάσεις στις θαλάσσιες ζώνες της Δημοκρατίας, προτού υπάρξει επεισόδιο. Η Τουρκία δεν είναι συμβαλλόμενο μέρος της Σύμβασης του ΟΗΕ για το Δίκαιο της Θάλασσας, γεγονός που περιορίζει ό,τι μπορεί να επιβληθεί.' },
      'roc.defence': { name: 'Εκσυγχρονισμός της άμυνας και ασκήσεις με εταίρους',
        desc: 'Αεράμυνα, περιπολικά σκάφη και επιτήρηση, με κοινές ασκήσεις με Ελλάδα, Γαλλία, Ισραήλ και Αίγυπτο. Στόχος είναι η αποτροπή χωρίς πρόκληση· η κρίση των πυραύλων του 1998 δείχνει τον κίνδυνο.' },
      'roc.fortress': { name: 'Κύπρος-Φρούριο: θωράκιση υποδομών και πολιτικής άμυνας',
        desc: 'Προστατευμένες εγκαταστάσεις διοίκησης και εφοδιασμού, καταφύγια, πλέγμα επιτήρησης, κυβερνοάμυνα, αποθέματα ενέργειας και νερού: ο εξαναγκασμός γίνεται δαπανηρός χωρίς να απειλείται κανείς.' },
      'roc.cgsp': { name: 'Εταιρική σχέση κυριαρχίας με πρόθυμα κράτη της ΕΕ',
        desc: 'Πρακτικό περιεχόμενο στη ρήτρα αμοιβαίας συνδρομής της ΕΕ (άρθρο 42.7) μαζί με ομάδα κρατών μελών: σχεδιασμός, παρουσία, συμφωνημένες αντιδράσεις.' },
      'roc.trilateral': { name: 'Εμβάθυνση της σύμπραξης Ισραήλ–Ελλάδας–Κύπρου',
        desc: 'Επέκταση του τριμερούς σχήματος πέρα από την ενέργεια, σε κοινές προμήθειες, κυβερνοασφάλεια, θαλάσσια ασφάλεια και βιομηχανία.' },
      'roc.msc': { name: 'Ίδρυση Συμβουλίου Σταθερότητας της Μεσογείου στη Λευκωσία',
        desc: 'Μόνιμο περιφερειακό φόρουμ για την ασφάλεια της ναυσιπλοΐας, την ενεργειακή διασύνδεση και την πρόληψη συγκρούσεων, ανοικτό σε όλα τα παράκτια κράτη που αποδέχονται τους κανόνες του.' },
      'roc.india': { name: 'Εταιρική σχέση τεχνολογίας και διαδρόμου με την Ινδία',
        desc: 'Ανάδειξη της Κύπρου σε μεσογειακό κόμβο του διαδρόμου Ινδίας–Μέσης Ανατολής–Ευρώπης, με δεσμούς στη ναυτιλία, την τεχνολογία και την αμυντική βιομηχανία.' },
      'roc.diaspora': { name: 'Ενεργοποίηση του δικτύου της διασποράς',
        desc: 'Οργάνωση των Κυπρίων του εξωτερικού, ιδίως στις ΗΠΑ, το Ηνωμένο Βασίλειο και την Αυστραλία, γύρω από πολιτική, νομική και επικοινωνιακή δράση.' },
      'roc.narrative': { name: 'Δημόσια διπλωματία για το κόστος της διαίρεσης',
        desc: 'Τεκμηρίωση της απώλειας πολιτιστικής κληρονομιάς, του εκτοπισμού και των αγνοουμένων, και ανάδειξη του οικονομικού οφέλους της επανένωσης για τις δύο κοινότητες.' },
      'roc.gulf': { name: 'Διακριτικός δίαυλος προς την Άγκυρα μέσω κρατών του Κόλπου',
        desc: 'Αξιοποίηση εταίρων που εμπιστεύεται η Άγκυρα για τη διερεύνηση διατυπώσεων που διασώζουν το γόητρο, μακριά από τη δημοσιότητα.' },
      'roc.buffer': { name: 'Κλίμακα αμοιβαιότητας με την Τουρκία σε λιμάνια και εναέριο χώρο',
        desc: 'Αμοιβαίο άνοιγμα βήμα προς βήμα: τουρκικά λιμάνια και εναέριος χώρος για πλοία και αεροσκάφη υπό κυπριακή σημαία, έναντι πρακτικών διευκολύνσεων για τους τουρκικούς μεταφορείς, με αφετηρία το μη ενεργειακό εμπόριο.' },
      'roc.nato': { name: 'Επιδίωξη εταιρικής σχέσης με το ΝΑΤΟ',
        desc: 'Αίτηση ένταξης στον Συνεταιρισμό για την Ειρήνη ως βήμα προς στενότερους δεσμούς. Απαιτείται ομοφωνία, άρα η Τουρκία μπορεί να την μπλοκάρει.' },
      'roc.hardline': { name: 'Αναστολή των επαφών έως ότου φύγουν τα στρατεύματα',
        desc: 'Άρνηση συνομιλιών και μέτρων οικοδόμησης εμπιστοσύνης έως ότου αρχίσει η αποχώρηση.' },

      'tr.twostate': { name: 'Πίεση για αναγνώριση δύο κρατών',
        desc: 'Εκστρατεία για αναγνώριση της «ΤΔΒΚ» και εμμονή στην κυριαρχική ισότητα ως βάση για οποιεσδήποτε συνομιλίες.' },
      'tr.reinforce': { name: 'Ενίσχυση της φρουράς και των βάσεων στον Βορρά',
        desc: 'Προσθήκη εγκαταστάσεων για μη επανδρωμένα αεροσκάφη, ναυτικών και αεροπορικών εγκαταστάσεων και αναβάθμιση των δυνάμεων.' },
      'tr.gunboat': { name: 'Ναυτική πίεση στις γεωτρήσεις στην ΑΟΖ της Δημοκρατίας',
        desc: 'Έκδοση αγγελιών προς ναυτιλλομένους, παρακολούθηση ερευνητικών σκαφών από κοντά και αποστολή γεωτρύπανων με συνοδεία, όπως το 2018–2020.' },
      'tr.varosha': { name: 'Άνοιγμα και άλλου τμήματος των Βαρωσίων υπό τουρκοκυπριακή διοίκηση',
        desc: 'Επέκταση του ανοίγματος του 2020 στην περίκλειστη πόλη, κατά παράβαση των ψηφισμάτων 550 και 789 του Συμβουλίου Ασφαλείας.' },
      'tr.integrate': { name: 'Στενότερη πρόσδεση του Βορρά στην Τουρκία',
        desc: 'Οικονομικά πρωτόκολλα, υποδομές και διοικητική εναρμόνιση που βαθαίνουν την εξάρτηση από την Άγκυρα.' },
      'tr.retaliate': { name: 'Αντίποινα σε εταίρους και έργα της Λευκωσίας',

      'tr.cbm': { name: 'Αποδοχή μέτρων οικοδόμησης εμπιστοσύνης',
        desc: 'Να προχωρήσουν νέα σημεία διέλευσης, διαλειτουργικότητα της κινητής τηλεφωνίας, ανταλλαγή ηλεκτρικής ενέργειας και κοινά έργα.' },
      'tr.talks': { name: 'Επιστροφή στις συνομιλίες του ΟΗΕ χωρίς προϋποθέσεις',
        desc: 'Εγκατάλειψη της απαίτησης για εκ των προτέρων αναγνώριση κυριαρχικής ισότητας και επανέναρξη από το σημείο όπου σταμάτησε το Κραν Μοντανά.' },
      'tr.partial': { name: 'Συμβολική μείωση στρατευμάτων ως μήνυμα',
        desc: 'Απόσυρση ενός ορατού τμήματος δυνάμεων, για να φανεί τι προσφέρει η άλλη πλευρά σε αντάλλαγμα.' },
      'tr.energydeal': { name: 'Συμμετοχή σε συμπεριληπτικό ενεργειακό πλαίσιο Αν. Μεσογείου',
        desc: 'Αποδοχή τεχνικής διευθέτησης για τα αμφισβητούμενα ύδατα και συμμετοχή στην περιφερειακή ενεργειακή συνεργασία.' },
      'tr.accept': { name: 'Υπογραφή οδικού χάρτη αποχώρησης έναντι ανταλλαγμάτων, ανά στάδια',
        desc: 'Συμφωνία για επαληθευμένη μείωση δυνάμεων βάσει ημερομηνιών, με αντάλλαγμα οικονομικά και πολιτικά οφέλη σε δεσμευμένο λογαριασμό, η οποία παρουσιάζεται στο εσωτερικό ως αναδιάταξη δυνάμεων κατ\' επιλογήν.' },
      'tr.withdraw': { name: 'Ολοκλήρωση της επαληθευμένης αποχώρησης',
        desc: 'Εφαρμογή του οδικού χάρτη: οι μονάδες αποχωρούν βάσει χρονοδιαγράμματος, οι εγκαταστάσεις παραδίδονται, οι ελεγκτές πιστοποιούν, τα ανταλλάγματα αποδεσμεύονται.',
        commitNote: 'Δεσμεύεται από τον υπογεγραμμένο οδικό χάρτη. Κάθε μηχανισμός δέσμευσης που έχει τεθεί σε ισχύ ανεβάζει το τίμημα της υπαναχώρησης: τα δεσμευμένα κεφάλαια, το σύμφωνο ασφάλειας με αυτόματη επαναφορά, η μετάβαση με εντολή του ΟΗΕ και οι δόσεις της ΕΕ.' },

      'tc.federal': { name: 'Κατάθεση ομοσπονδιακής πρότασης με πολιτική ισότητα',
        desc: 'Πρόταση για διζωνική δικοινοτική ομοσπονδία με αποτελεσματική συμμετοχή και χρονοδιάγραμμα.' },
      'tc.cbm': { name: 'Άνοιγμα σημείων διέλευσης και κοινές υπηρεσίες',

      'tc.greenline': { name: 'Εναρμόνιση με τα πρότυπα της ΕΕ και αύξηση του εμπορίου της Πράσινης Γραμμής',
        desc: 'Υιοθέτηση των κανόνων και της πιστοποίησης της ΕΕ για τα προϊόντα, ώστε αγαθά και υπηρεσίες να φτάνουν στην αγορά της ΕΕ.' },
      'tc.civic': { name: 'Στήριξη της δικοινοτικής πλατφόρμας πολιτών',
        desc: 'Συντεχνίες, εκπαιδευτικοί, επιμελητήρια και οργανώσεις νεολαίας που συνεργάζονται πέρα από τη διαχωριστική γραμμή.' },
      'tc.property': { name: 'Επιτάχυνση της Επιτροπής Ακίνητης Περιουσίας',
        desc: 'Ταχύτερες αποφάσεις και πραγματική απόδοση περιουσιών στους Ελληνοκυπρίους ιδιοκτήτες.' },
      'tc.recognition': { name: 'Επιδίωξη αναγνώρισης και απευθείας πτήσεων μέσω φιλικών κρατών',
        desc: 'Άσκηση πίεσης στον Οργανισμό Τουρκογενών Κρατών και σε άλλους για αναβαθμισμένο καθεστώς και απευθείας συνδέσεις.' },
      'tc.align': { name: 'Πλήρης ευθυγράμμιση με τη γραμμή της Άγκυρας',

      'tc.referendum': { name: 'Εκστρατεία υπέρ του ναι στο τουρκοκυπριακό δημοψήφισμα',

      'gr.calm': { name: 'Διατήρηση του διαλόγου Αθήνας–Άγκυρας',
        desc: 'Συνέχιση της ατζέντας των «ήρεμων νερών» που ξεκίνησε με τη Διακήρυξη των Αθηνών του 2023.' },
      'gr.defence': { name: 'Κοινός αμυντικός σχεδιασμός και αεροπορική κάλυψη της Κύπρου',
        desc: 'Αναβίωση του κοινού αμυντικού σχεδιασμού και ορατή παρουσία.' },
      'gr.interconnector': { name: 'Κατασκευή του Great Sea Interconnector',
        desc: 'Χρηματοδότηση και πόντιση του ηλεκτρικού καλωδίου Κρήτης–Κύπρου, παρά τις διαφωνίες για το κόστος και τις τουρκικές αντιρρήσεις.' },
      'gr.linkage': { name: 'Σύνδεση των αναβαθμίσεων ΕΕ–Τουρκίας με πρόοδο στο Κυπριακό',
        desc: 'Εμμονή, από κοινού με τη Λευκωσία, ότι η πρόσβαση στα αμυντικά ταμεία και η αναβάθμιση της τελωνειακής ένωσης εξαρτώνται από κινητικότητα.' },
      'gr.guarantee': { name: 'Προσφορά τερματισμού των εγγυητικών δικαιωμάτων και αντίστοιχης μείωσης στρατευμάτων',
        desc: 'Δήλωση ετοιμότητας για κατάργηση των εγγυήσεων του 1960 και απόσυρση του ελληνικού αποσπάσματος παράλληλα με την Τουρκία.' },

      'eu.package': { name: 'Προσφορά πακέτου κινήτρων υπό όρους στην Άγκυρα',
        desc: 'Εκσυγχρονισμός της τελωνειακής ένωσης, διευκόλυνση των θεωρήσεων και πρόσβαση στα αμυντικά ταμεία, που αποδεσμεύονται σε δόσεις έναντι επαληθευμένων βημάτων στο Κυπριακό.' },
      'eu.sanctions': { name: 'Υιοθέτηση στοχευμένων κυρώσεων',
        desc: 'Καταχώριση οντοτήτων που συνδέονται με μη εξουσιοδοτημένες γεωτρήσεις, τα Βαρώσια ή δραστηριότητες εποικισμού.' },
      'eu.tcfund': { name: 'Αύξηση της βοήθειας και απευθείας επαφή με τους Τουρκοκυπρίους',
        desc: 'Διεύρυνση του προγράμματος βοήθειας, υποτροφίες, εναρμόνιση προτύπων και προετοιμασία για το δίκαιο της ΕΕ.' },
      'eu.envoy': { name: 'Πολιτικό βάρος πίσω από τη διαδικασία του ΟΗΕ',
        desc: 'Απεσταλμένος της ΕΕ με ουσιαστικές αρμοδιότητες, που εργάζεται δίπλα στον ΟΗΕ, με τα εργαλεία της Ένωσης στο τραπέζι.' },
      'eu.unconditional': { name: 'Εμβάθυνση των σχέσεων με την Άγκυρα χωρίς όρους για το Κυπριακό',
        desc: 'Προώθηση της συνεργασίας στο εμπόριο, το μεταναστευτικό και την άμυνα, παρακάμπτοντας τις αντιρρήσεις της Λευκωσίας.' },
      'eu.defence': { name: 'Πρακτικό περιεχόμενο στη ρήτρα αμοιβαίας συνδρομής',
        desc: 'Σχεδιασμός, ναυτική παρουσία και συμφωνημένες αντιδράσεις για κράτος μέλος που απειλείται.' },
      'eu.energy': { name: 'Χρηματοδότηση ενεργειακών διασυνδέσεων Αν. Μεσογείου',
        desc: 'Επιχορηγήσεις και εγγυήσεις για διασύνδεση, LNG και υδρογόνο, που τερματίζουν την ενεργειακή απομόνωση του νησιού.' },

      'us.pact': { name: 'Στρατηγική εταιρική σχέση με τη Λευκωσία',
        desc: 'Αμυντική συνεργασία, βοήθεια στον τομέα της ασφάλειας και ενεργειακοί και χρηματοοικονομικοί δεσμοί.' },
      'us.condition': { name: 'Πωλήσεις όπλων υπό τον όρο βημάτων στο Κυπριακό',
        desc: 'Σύνδεση των παραδόσεων αεροσκαφών, των αναβαθμίσεων και της επανένταξης σε προγράμματα με επαληθεύσιμες κινήσεις.' },
      'us.sanctions': { name: 'Στοχευμένες καταχωρίσεις και έλεγχοι εξαγωγών',
        desc: 'Περιορισμένα, αναστρέψιμα μέτρα σε αξιωματούχους και εταιρείες που συντηρούν την κατοχή, το καθένα συνοδευόμενο από διέξοδο.' },
      'us.offramp': { name: 'Στήριξη πρωτοκόλλου σταδιακής αποχώρησης με δεσμευμένα ανταλλάγματα',
        desc: 'Το αμερικανικό βάρος πίσω από χρονοδιάγραμμα καταχωρισμένο στον ΟΗΕ, με ταμείο ανοικοδόμησης και κλιμακωτή χαλάρωση των μέτρων.' },
      'us.mediate': { name: 'Μεσολάβηση υψηλού επιπέδου που συνδέει το Κυπριακό με περιφερειακές συμφωνίες',
        desc: 'Απεσταλμένος με προεδρική στήριξη, που συνδέει το Κυπριακό με ενεργειακές ρυθμίσεις και ρυθμίσεις ασφάλειας τις οποίες επιθυμεί η Άγκυρα.' },
      'us.transact': { name: 'Προτεραιότητα στην Άγκυρα χωρίς σύνδεση με το Κυπριακό',
        desc: 'Πωλήσεις όπλων και χαλάρωση κυρώσεων με αντάλλαγμα συνεργασία σε άλλα μέτωπα.' },
      'us.energy': { name: 'Στήριξη των αμερικανικών εταιρειών και του ενεργειακού διαδρόμου μέσω Κύπρου',
        desc: 'Διπλωματική και οικονομική στήριξη στις αμερικανικές εταιρείες που δραστηριοποιούνται στην ΑΟΖ και στις υποδομές του διαδρόμου.' },

      'uk.guarantor': { name: 'Δήλωση ετοιμότητας για τερματισμό των εγγυητικών δικαιωμάτων',
        desc: 'Δήλωση ότι το Λονδίνο θα εγκαταλείψει τον ρόλο του 1960 στο πλαίσιο λύσης.' },
      'uk.sba': { name: 'Προσφορά εδάφους των βάσεων στο πλαίσιο λύσης',
        desc: 'Ανανέωση της προσφοράς που έγινε το 2004 και αργότερα για εκχώρηση περίπου του μισού εδάφους των βάσεων.' },
      'uk.broker': { name: 'Μεσολάβηση για το κεφάλαιο της ασφάλειας',
        desc: 'Αξιοποίηση των ρόλων του συντάκτη των κειμένων στο Συμβούλιο Ασφαλείας και της εγγυήτριας για τη σύνταξη μεταβατικού καθεστώτος ασφάλειας αποδεκτού και από τις δύο πλευρές.' },
      'uk.ankara': { name: 'Εμβάθυνση του αμυντικού εμπορίου με την Άγκυρα χωρίς όρους',
        desc: 'Πωλήσεις αεροσκαφών και βιομηχανική συνεργασία χωρίς αναφορά στο Κυπριακό.' },

      'un.convene': { name: 'Σύγκληση διευρυμένης συνάντησης και διορισμός απεσταλμένου με πλήρη εντολή',
        desc: 'Να βρεθούν στο ίδιο τραπέζι οι δύο πλευρές και οι τρεις εγγυήτριες δυνάμεις και να οριστεί μόνιμος απεσταλμένος.' },
      'un.cbm': { name: 'Μεσολάβηση για πρακτική συνεργασία',
        desc: 'Σημεία διέλευσης, αποναρκοθέτηση, κοιμητήρια, επιτροπές περιβάλλοντος και νεολαίας.' },
      'un.security': { name: 'Σχεδιασμός μετάβασης στην ασφάλεια με διεθνή εντολή',
        desc: 'Επαλήθευση, αστυνόμευση και μεταβατική αποστολή στη θέση του συστήματος εγγυήσεων.' },
      'un.report': { name: 'Κατονομασία της παρεμπόδισης στην έκθεση του Γενικού Γραμματέα',
        desc: 'Απόδοση ευθυνών για την έλλειψη προόδου.' },

      'ru.shield': { name: 'Προστασία του στάτους κβο στο Συμβούλιο Ασφαλείας',
        desc: 'Αντίθεση σε προθεσμίες, διαιτησία ή οποιαδήποτε αποστολή υπό δυτική ηγεσία.' },
      'ru.energy': { name: 'Εμβάθυνση των ενεργειακών δεσμών με την Άγκυρα',

    '<b>Commitment:</b> {0}': '<b>Δέσμευση:</b> {0}',
    '<b>Computer mode.</b> After your move, the app plays the other nine stakeholders: each answers with the reply that serves its own interests best, and you see the probability of each reply. Use this to find out what is likely to happen.': '<b>Τρόπος υπολογιστή.</b> Μετά την κίνησή σας, η εφαρμογή παίζει τα άλλα εννέα ενδιαφερόμενα μέρη: το καθένα απαντά με την κίνηση που εξυπηρετεί καλύτερα τα δικά του συμφέροντα, και εσείς βλέπετε την πιθανότητα κάθε απάντησης. Χρησιμοποιήστε τον για να μάθετε τι είναι πιθανό να συμβεί.',
    '<b>Firefox:</b> bookmark the page; it still works offline after the first visit.': '<b>Firefox:</b> προσθέστε τη σελίδα στους σελιδοδείκτες· μετά την πρώτη επίσκεψη λειτουργεί και εκτός σύνδεσης.',
    '<b>Lesson:</b> {0}': '<b>Δίδαγμα:</b> {0}',
    '<b>Limits.</b> This is a decision aid. It makes reasoning explicit and comparable; it cannot know private intentions, domestic shocks or events outside the ten dimensions. Scores are the authors\' structured judgments, informed by the source blueprints and the public record, and are open to edit under Assumptions. Treat outputs as scenarios with probabilities, not prophecy.': '<b>Όρια.</b> Πρόκειται για βοήθημα λήψης αποφάσεων. Κάνει το σκεπτικό ρητό και συγκρίσιμο· δεν μπορεί να γνωρίζει απόρρητες προθέσεις, εσωτερικούς κλυδωνισμούς ή γεγονότα εκτός των δέκα δεικτών. Οι βαθμολογίες είναι δομημένες κρίσεις των συντακτών, βασισμένες στα σχέδια δράσης των πηγών και σε δημόσια διαθέσιμα στοιχεία, και μπορούν να τροποποιηθούν στις Παραδοχές. Αντιμετωπίστε τα αποτελέσματα ως σενάρια με πιθανότητες, όχι ως προφητεία.',
    '<b>Manual mode.</b> After your move, you decide what each of the other nine stakeholders does. Nothing is predicted for you; every stakeholder starts on "Hold position" until you choose otherwise. Use this to test a "what if", replay real events, or play with other people around a table.': '<b>Χειροκίνητος τρόπος.</b> Μετά την κίνησή σας, αποφασίζετε εσείς τι κάνει καθένα από τα άλλα εννέα ενδιαφερόμενα μέρη. Δεν γίνεται καμία πρόβλεψη για λογαριασμό σας· κάθε μέρος ξεκινά από τη «Διατήρηση θέσης», ώσπου να επιλέξετε κάτι άλλο. Χρησιμοποιήστε τον για να ελέγξετε ένα «τι θα γινόταν αν», να αναπαραγάγετε πραγματικά γεγονότα ή να παίξετε με άλλους γύρω από ένα τραπέζι.',
    '<b>Moves.</b> You choose a move. Then either the computer plays the other nine stakeholders, each answering with the reply that serves it best, as a chess program would; or you switch to manual mode and choose their moves yourself.': '<b>Κινήσεις.</b> Επιλέγετε μια κίνηση. Στη συνέχεια, είτε ο υπολογιστής παίζει τα άλλα εννέα ενδιαφερόμενα μέρη, με το καθένα να απαντά με την κίνηση που το εξυπηρετεί καλύτερα, όπως θα έκανε ένα πρόγραμμα σκακιού· είτε περνάτε στον χειροκίνητο τρόπο και επιλέγετε εσείς τις κινήσεις τους.',
    '<b>Moves</b> shift dimensions by stated amounts, carry a chance of success, and may cost the mover political capital. Some need a precondition: a level of trust, or another player\'s earlier move.': '<b>Οι κινήσεις</b> μετατοπίζουν τους δείκτες κατά καθορισμένα μεγέθη, έχουν μια πιθανότητα επιτυχίας και μπορεί να κοστίζουν πολιτικό κεφάλαιο σε όποιον τις κάνει. Ορισμένες χρειάζονται μια προϋπόθεση: ένα επίπεδο εμπιστοσύνης ή μια προηγούμενη κίνηση άλλου παίκτη.',
    '<b>Odds</b> come from hundreds of simulated futures in which moves can fail and players sometimes take their second choice. <b>Robustness</b> comes from re-running the recommendation with every assumption randomly disturbed.': '<b>Οι πιθανότητες</b> προκύπτουν από εκατοντάδες προσομοιωμένα μέλλοντα, στα οποία οι κινήσεις μπορεί να αποτύχουν και οι παίκτες επιλέγουν ενίοτε τη δεύτερη προτίμησή τους. <b>Η ανθεκτικότητα</b> προκύπτει από την επανάληψη της σύστασης με κάθε παραδοχή τυχαία διαταραγμένη.',
    '<b>Players.</b> Ten stakeholders each have an ideal position and care about the dimensions to different degrees. That is all the model needs to compute who gains and who loses from any change.': '<b>Παίκτες.</b> Δέκα ενδιαφερόμενα μέρη έχουν το καθένα μια ιδεώδη θέση και ενδιαφέρονται για τους δείκτες σε διαφορετικό βαθμό. Αυτό αρκεί στο μοντέλο για να υπολογίσει ποιος κερδίζει και ποιος χάνει από κάθε μεταβολή.',
    '<b>Position.</b> Ten measurable dimensions describe where the Cyprus question stands today, from troop presence to energy cooperation. Live news and economic data nudge the starting position.': '<b>Θέση.</b> Δέκα μετρήσιμοι δείκτες περιγράφουν πού βρίσκεται σήμερα το Κυπριακό, από την παρουσία στρατευμάτων έως την ενεργειακή συνεργασία. Ζωντανές ειδήσεις και οικονομικά δεδομένα μετακινούν ελαφρά την αρχική θέση.',
    '<b>Precedents</b>: past successes and failures. <b>Assumptions</b>: every number in the model, adjustable. <b>Method & install</b>: how predictions are made, and how to install or download the tool.': '<b>Προηγούμενα</b>: παλαιότερες επιτυχίες και αποτυχίες. <b>Παραδοχές</b>: κάθε αριθμός του μοντέλου, με δυνατότητα προσαρμογής. <b>Μέθοδος και εγκατάσταση</b>: πώς γίνονται οι προβλέψεις και πώς εγκαθίσταται ή κατεβαίνει το εργαλείο.',
    '<b>Predicted replies:</b> {0}': '<b>Προβλεπόμενες απαντήσεις:</b> {0}',
    '<b>Prediction.</b> After your move every other player replies in turn. Each values its options by its payoff once the remaining players have also replied, and the reply probabilities follow from how far apart those values are (a quantal-response rule: close calls are uncertain, clear ones are near-certain).': '<b>Πρόβλεψη.</b> Μετά την κίνησή σας, κάθε άλλος παίκτης απαντά με τη σειρά του. Ο καθένας αποτιμά τις επιλογές του με βάση την απολαβή του αφού απαντήσουν και οι υπόλοιποι παίκτες, και οι πιθανότητες των απαντήσεων προκύπτουν από το πόσο απέχουν μεταξύ τους οι αξίες αυτές (κανόνας ποσοστημοριακής απόκρισης: οι οριακές περιπτώσεις είναι αβέβαιες, οι σαφείς σχεδόν βέβαιες).',
    '<b>Reading:</b>': '<b>Ανάγνωση:</b>',
    '<b>Result.</b> You see each predicted reply with its probability, the new position, every player\'s gain or loss, a SWOT and risk analysis, and the best path several rounds ahead.': '<b>Αποτέλεσμα.</b> Βλέπετε κάθε προβλεπόμενη απάντηση με την πιθανότητά της, τη νέα θέση, το κέρδος ή τη ζημία κάθε παίκτη, ανάλυση SWOT και κινδύνων, και τη βέλτιστη πορεία αρκετούς γύρους μπροστά.',
    '<b>Safari on Mac:</b> File → <b>Add to Dock</b>.': '<b>Safari σε Mac:</b> Αρχείο → <b>Προσθήκη στο Dock</b>.',
    '<b>Signals feeding the model</b> shows exactly how the data nudges the starting position. Untick any signal you do not want used.': 'Τα <b>Σήματα που τροφοδοτούν το μοντέλο</b> δείχνουν ακριβώς πώς τα δεδομένα μετακινούν την αρχική θέση. Αποεπιλέξτε όποιο σήμα δεν θέλετε να χρησιμοποιείται.',
    '<b>Sources</b> shows where each kind of data comes from and whether the last fetch worked.': 'Οι <b>Πηγές</b> δείχνουν από πού προέρχεται κάθε είδος δεδομένων και αν πέτυχε η τελευταία άντληση.',
    '<b>Stakeholders</b>: interests, red lines, leverage and weak points of each player, and the moves the model gives them.': '<b>Ενδιαφερόμενα μέρη</b>: συμφέροντα, κόκκινες γραμμές, μοχλοί πίεσης και αδύναμα σημεία κάθε παίκτη, και οι κινήσεις που του δίνει το μοντέλο.',
    '<b>Why this is here.</b> It is an early-warning gauge. GDELT scores the language of worldwide news coverage: below zero is negative, and a falling line means more hostile reporting about Cyprus and Türkiye. If the last two weeks are clearly worse than the four-month average, the model starts with slightly lower stability.': '<b>Γιατί βρίσκεται εδώ.</b> Είναι δείκτης έγκαιρης προειδοποίησης. Το GDELT βαθμολογεί τη γλώσσα της παγκόσμιας ειδησεογραφικής κάλυψης: κάτω από το μηδέν είναι αρνητική, και μια γραμμή που πέφτει σημαίνει πιο εχθρικά δημοσιεύματα για την Κύπρο και την Τουρκία. Αν οι δύο τελευταίες εβδομάδες είναι σαφώς χειρότερες από τον μέσο όρο του τετραμήνου, το μοντέλο ξεκινά με ελαφρώς χαμηλότερη σταθερότητα.',
    '<b>Why this is here.</b> Türkiye is the player whose decision matters most, and its economy is where outside incentives and pressure bite. The lira is the one daily, public, hard number that shows how exposed that economy is. When it has fallen a lot over twelve months, Ankara needs foreign capital, trade access and investor confidence more, so offers such as a customs-union upgrade, and threats to them, weigh more in its calculation. The model therefore raises the weight Türkiye gives to its Western ties and to the economy, by at most 40%. The north of Cyprus also uses the lira, so the same slide erodes Turkish Cypriot living standards. Untick the lira signal above to switch this off.': '<b>Γιατί βρίσκεται εδώ.</b> Η Τουρκία είναι ο παίκτης του οποίου η απόφαση μετρά περισσότερο, και η οικονομία της είναι το πεδίο όπου τα εξωτερικά κίνητρα και η πίεση πιάνουν τόπο. Η λίρα είναι ο ένας καθημερινός, δημόσιος, σκληρός αριθμός που δείχνει πόσο εκτεθειμένη είναι η οικονομία αυτή. Όταν έχει υποχωρήσει πολύ μέσα σε δώδεκα μήνες, η Άγκυρα χρειάζεται περισσότερο ξένα κεφάλαια, πρόσβαση στο εμπόριο και εμπιστοσύνη των επενδυτών, άρα προσφορές όπως η αναβάθμιση της τελωνειακής ένωσης, και οι απειλές εναντίον τους, βαραίνουν περισσότερο στους υπολογισμούς της. Γι\' αυτό το μοντέλο αυξάνει, το πολύ κατά 40%, τη στάθμιση που δίνει η Τουρκία στους δεσμούς της με τη Δύση και στην οικονομία. Και ο Βορράς της Κύπρου χρησιμοποιεί τη λίρα, άρα η ίδια διολίσθηση διαβρώνει το βιοτικό επίπεδο των Τουρκοκυπρίων. Αποεπιλέξτε παραπάνω το σήμα της λίρας για να το απενεργοποιήσετε.',
    '<span class="tag good">Engine\'s choice</span> <b>{0}</b> — no available move beats waiting this round.': '<span class="tag good">Επιλογή της μηχανής</span> <b>{0}</b> — καμία διαθέσιμη κίνηση δεν υπερτερεί της αναμονής σε αυτόν τον γύρο.',
    '<span class="tag good">Engine\'s choice</span> <b>{0}</b> — {1} better than waiting, after the other players reply.': '<span class="tag good">Επιλογή της μηχανής</span> <b>{0}</b> — {1} καλύτερα από την αναμονή, αφού απαντήσουν οι άλλοι παίκτες.',
    'A busy negotiation agenda signals diplomatic momentum; silence signals drift.': 'Μια γεμάτη διαπραγματευτική ατζέντα δείχνει διπλωματική δυναμική· η σιωπή δείχνει ότι τα πράγματα αφήνονται στην τύχη τους.',
    'A full assessment of one move for <b>{0}</b> in the current position: strengths and weaknesses, risks, how it plays against a chosen opponent, who holds power, and how far the advice can be trusted. All of it is calculated with the computer playing the other stakeholders.': 'Πλήρης αξιολόγηση μίας κίνησης στην τρέχουσα θέση (παίζετε ως: <b>{0}</b>): δυνατά σημεία και αδυναμίες, κίνδυνοι, πώς αποδίδει απέναντι σε επιλεγμένο αντίπαλο, ποιος έχει την ισχύ, και πόσο μπορεί κανείς να εμπιστευθεί τη συμβουλή. Όλα υπολογίζονται με τον υπολογιστή να παίζει τα άλλα ενδιαφερόμενα μέρη.',
    'A line of play as {0}': 'Γραμμή παιχνιδιού ως: {0}',
    'A stress test. The model\'s assumptions are judgments, so this re-runs the advice many times with those judgments deliberately disturbed.': 'Δοκιμή αντοχής. Οι παραδοχές του μοντέλου είναι κρίσεις· γι\' αυτό η συμβουλή υπολογίζεται εκ νέου πολλές φορές, με τις κρίσεις αυτές σκόπιμα διαταραγμένες.',
    'A weaker lira raises the value Ankara places on Western capital, trade and market access.': 'Μια ασθενέστερη λίρα αυξάνει την αξία που αποδίδει η Άγκυρα στα δυτικά κεφάλαια, στο εμπόριο και στην πρόσβαση στις αγορές.',
    'Adjustments are deliberately small and capped. They move the starting position of a new game; a game in progress is replayed from the adjusted start.': 'Οι προσαρμογές είναι σκόπιμα μικρές και έχουν ανώτατο όριο. Μετακινούν την αρχική θέση μιας νέας παρτίδας· μια παρτίδα σε εξέλιξη ξαναπαίζεται από την προσαρμοσμένη αφετηρία.',

    'Chance it works as intended: <b>{0}</b> · political cost to you: <b>{1}</b>/10': 'Πιθανότητα να λειτουργήσει όπως προβλέπεται: <b>{0}</b> · πολιτικό κόστος για εσάς: <b>{1}</b>/10',
    'Chance it works as intended: <b>{0}</b> · political cost to you: <b>{1}</b>/10 · source: {2}': 'Πιθανότητα να λειτουργήσει όπως προβλέπεται: <b>{0}</b> · πολιτικό κόστος για εσάς: <b>{1}</b>/10 · πηγή: {2}',
    'Change in each player\'s payoff (0–100 scale) once every reply is in.': 'Μεταβολή της απολαβής κάθε παίκτη (κλίμακα 0–100) αφού δοθούν όλες οι απαντήσεις.',
    'Choose <b>Add to Home Screen</b>, then <b>Add</b>.': 'Επιλέξτε <b>Προσθήκη στην οθόνη Αφετηρίας</b> και μετά <b>Προσθήκη</b>.',
    'Choose <b>Install app</b> or <b>Add to Home screen</b>.': 'Επιλέξτε <b>Εγκατάσταση εφαρμογής</b> ή <b>Προσθήκη στην αρχική οθόνη</b>.',
    'Choose each stakeholder\'s reply': 'Επιλέξτε την απάντηση κάθε ενδιαφερόμενου μέρους',
    'Choose how many rounds to look ahead (one round is about six months).': 'Επιλέξτε πόσους γύρους μπροστά θα γίνει η πρόβλεψη (ένας γύρος είναι περίπου έξι μήνες).',
    'Choose stakeholder': 'Επιλογή ενδιαφερόμενου μέρους',
    'Choose under <b>Who plays the other stakeholders?</b> whether the computer answers for them or you pick their moves yourself.': 'Επιλέξτε στο <b>Ποιος παίζει τα άλλα ενδιαφερόμενα μέρη;</b> αν θα απαντά γι\' αυτά ο υπολογιστής ή αν θα διαλέγετε εσείς τις κινήσεις τους.',
    'Choose what to optimise: your own payoff, a sustainable outcome, or the collective good.': 'Επιλέξτε τι θα βελτιστοποιηθεί: η δική σας απολαβή, μια βιώσιμη έκβαση ή το συλλογικό καλό.',
    'Close': 'Κλείσιμο',
    'Close all': 'Κλείσιμο όλων',
    'Coalition weight with you <b class="num">{0}</b>': 'Βάρος του συνασπισμού που είναι μαζί σας <b class="num">{0}</b>',
    'Collective': 'Συλλογικός',
    'Compare with <b>if you only wait</b>, then check the <b>odds</b> to see how the path fares when things go wrong.': 'Συγκρίνετε με το <b>αν απλώς περιμένετε</b> και έπειτα δείτε τις <b>πιθανότητες</b>, για να διαπιστώσετε πώς τα πηγαίνει η πορεία όταν τα πράγματα στραβώνουν.',
    'Computer mode: the app plays the other stakeholders. The percentage is the model\'s probability that the player picks that reply over its alternatives.': 'Τρόπος υπολογιστή: η εφαρμογή παίζει τα άλλα ενδιαφερόμενα μέρη. Το ποσοστό είναι η πιθανότητα, κατά το μοντέλο, να προτιμήσει ο παίκτης τη συγκεκριμένη απάντηση από τις εναλλακτικές του.',
    'Computer plays them': 'Παίζει ο υπολογιστής',
    'Confirm. The board appears with your other apps.': 'Επιβεβαιώστε. Το ταμπλό εμφανίζεται μαζί με τις άλλες εφαρμογές σας.',
    'Connection and data freshness': 'Σύνδεση και επικαιρότητα των δεδομένων',
    'Coverage over the last two weeks is calmer than the four-month norm.': 'Η κάλυψη των δύο τελευταίων εβδομάδων είναι πιο ήρεμη από τον μέσο όρο του τετραμήνου.',
    'Coverage over the last two weeks is more hostile than the four-month norm.': 'Η κάλυψη των δύο τελευταίων εβδομάδων είναι πιο εχθρική από τον μέσο όρο του τετραμήνου.',
    'Critical path, step by step': 'Κρίσιμη διαδρομή, βήμα προς βήμα',
    'Current summaries of past plans, talks, rulings and comparable cases': 'Τρέχουσες περιλήψεις παλαιότερων σχεδίων, συνομιλιών, δικαστικών αποφάσεων και συγκρίσιμων περιπτώσεων',
    'Cyprus': 'Κύπρος',
    'Cyprus Strategy Board': 'Cyprus Strategy Board',
    'Cyprus Strategy Board — game-theory decision support': 'Cyprus Strategy Board — υποστήριξη αποφάσεων με θεωρία παιγνίων',
    'Cyprus Strategy Board, choose stakeholder': 'Cyprus Strategy Board, επιλογή ενδιαφερόμενου μέρους',
    'Deciding as: {0}': 'Αποφασίζετε ως: {0}',
    'Decision support for every stakeholder': 'Υποστήριξη αποφάσεων για κάθε ενδιαφερόμενο μέρος',
    'Dimension': 'Δείκτης',
    'Direct effect of the move on the position, before anyone replies:': 'Άμεση επίδραση της κίνησης στη θέση, προτού απαντήσει οποιοσδήποτε:',
    'Done': 'Τέλος',
    'Download single-file copy': 'Λήψη αντιγράφου σε ένα αρχείο',
    'Each cell: your payoff change / theirs, if both play those moves and nobody else acts.': 'Κάθε κελί: μεταβολή της δικής σας απολαβής / της δικής του, αν παίξετε και οι δύο αυτές τις κινήσεις και δεν ενεργήσει κανείς άλλος.',
    'Each player wants the position to move in a particular direction. If that direction overlaps with yours, they are with you on the present board; if it runs opposite, they are against you. It changes as the position changes — today\'s opponent can become tomorrow\'s partner once the trade-offs shift.': 'Κάθε παίκτης θέλει η θέση να κινηθεί προς συγκεκριμένη κατεύθυνση. Αν η κατεύθυνση αυτή συμπίπτει με τη δική σας, είναι μαζί σας στο παρόν ταμπλό· αν είναι αντίθετη, είναι απέναντί σας. Αυτό αλλάζει καθώς αλλάζει η θέση — ο σημερινός αντίπαλος μπορεί να γίνει ο αυριανός εταίρος, μόλις μεταβληθούν τα ανταλλάγματα.',
    'Each score is how much better (+) or worse (−) than simply waiting the move leaves you, three rounds on, once every other player has answered with their best replies.': 'Κάθε βαθμολογία δείχνει πόσο καλύτερα (+) ή χειρότερα (−) σας αφήνει η κίνηση σε σύγκριση με την απλή αναμονή, ύστερα από τρεις γύρους, αφού κάθε άλλος παίκτης δώσει τις βέλτιστες απαντήσεις του.',
    'Effect on the model': 'Επίδραση στο μοντέλο',

    'Ten measures of the Cyprus question, each scored 0–100 between the two descriptions under its bar. The facts behind today\'s scores are listed under Library → Assumptions.': 'Δέκα δείκτες του Κυπριακού, ο καθένας βαθμολογημένος από 0 έως 100 ανάμεσα στις δύο περιγραφές κάτω από τη μπάρα του. Τα γεγονότα πίσω από τις σημερινές βαθμολογίες παρατίθενται στη Βιβλιοθήκη → Παραδοχές.',
    'The board': 'Το ταμπλό',
    'The board installs like an app on phones, tablets and computers and runs fully offline, including in airplane mode. Live data refreshes whenever a connection returns.': 'Το ταμπλό εγκαθίσταται σαν εφαρμογή σε τηλέφωνα, tablet και υπολογιστές και λειτουργεί πλήρως εκτός σύνδεσης, ακόμη και σε λειτουργία πτήσης. Τα ζωντανά δεδομένα ανανεώνονται όποτε επανέρχεται η σύνδεση.',
    'The board is a <b>spatial bargaining game</b>. The Cyprus question is described by ten dimensions scored 0–100. Each of ten stakeholders has an ideal point on every dimension and a weight for how much it cares. A player\'s payoff is its weighted closeness to its ideals — 100 would be its perfect world.': 'Το ταμπλό είναι ένα <b>χωρικό παίγνιο διαπραγμάτευσης</b>. Το Κυπριακό περιγράφεται με δέκα δείκτες βαθμολογημένους από 0 έως 100. Καθένα από τα δέκα ενδιαφερόμενα μέρη έχει ένα ιδεώδες σημείο σε κάθε δείκτη και μια στάθμιση για το πόσο το ενδιαφέρει. Η απολαβή ενός παίκτη είναι η σταθμισμένη εγγύτητά του στα ιδεώδη του — το 100 θα ήταν ο τέλειος κόσμος του.',
    'The board is already installed and running as an app on this device.': 'Το ταμπλό είναι ήδη εγκατεστημένο και λειτουργεί ως εφαρμογή σε αυτή τη συσκευή.',
    'The charts, table and headlines below are the raw material, for your own reading.': 'Τα γραφήματα, ο πίνακας και οι τίτλοι που ακολουθούν είναι η πρώτη ύλη, για τη δική σας ανάγνωση.',
    'The classic game-theory table: your five strongest options against one opponent\'s five strongest. Choose the opponent below.': 'Ο κλασικός πίνακας της θεωρίας παιγνίων: οι πέντε ισχυρότερες επιλογές σας απέναντι στις πέντε ισχυρότερες ενός αντιπάλου. Επιλέξτε τον αντίπαλο παρακάτω.',
    'The complete guide to the Cyprus Strategy Board: what it is, how to play, how every prediction and score is worked out, what each page shows, and how to install it. Tap a heading to open that section.': 'Ο πλήρης οδηγός του Cyprus Strategy Board: τι είναι, πώς παίζεται, πώς προκύπτει κάθε πρόβλεψη και κάθε βαθμολογία, τι δείχνει κάθε σελίδα και πώς εγκαθίσταται. Πατήστε μια επικεφαλίδα για να ανοίξετε την αντίστοιχη ενότητα.',
    'The engine prefers <b>{0}</b> ({1} against {2} here, compared with waiting).': 'Η μηχανή προτιμά: <b>{0}</b> ({1} έναντι {2} εδώ, σε σύγκριση με την αναμονή).',

    'The move itself shifts <b>{0}</b> by {1}, away from your ideal.': 'Η ίδια η κίνηση μετατοπίζει τον δείκτη «<b>{0}</b>» κατά {1}, μακριά από το ιδεώδες σας.',
    'The move itself shifts <b>{0}</b> by {1}, toward your ideal.': 'Η ίδια η κίνηση μετατοπίζει τον δείκτη «<b>{0}</b>» κατά {1}, προς το ιδεώδες σας.',

    'The position after your move and all nine replies, and what it does to each stakeholder.': 'Η θέση μετά την κίνησή σας και τις εννέα απαντήσεις, και τι σημαίνει για κάθε ενδιαφερόμενο μέρος.',
    'The power-weighted average payoff of all ten stakeholders.': 'Η μέση απολαβή και των δέκα ενδιαφερόμενων μερών, σταθμισμένη με την ισχύ τους.',

    'The recommendation is fragile — several moves are close. Treat it as one good option, not the answer.': 'Η σύσταση είναι εύθραυστη — αρκετές κινήσεις βρίσκονται κοντά. Αντιμετωπίστε την ως μία καλή επιλογή, όχι ως την απάντηση.',

    'The same board is published at independent addresses. If one is unreachable, use another; an installed copy keeps working regardless.': 'Το ίδιο ταμπλό δημοσιεύεται σε ανεξάρτητες διευθύνσεις. Αν κάποια δεν είναι προσβάσιμη, χρησιμοποιήστε άλλη· το εγκατεστημένο αντίγραφο συνεχίζει να λειτουργεί σε κάθε περίπτωση.',
    'The same result sorted by field, so a specialist in any one area can see what changes for them after this round.': 'Το ίδιο αποτέλεσμα ταξινομημένο ανά τομέα, ώστε ο ειδικός κάθε τομέα να βλέπει τι αλλάζει για εκείνον μετά από αυτόν τον γύρο.',

    'The strategies set out in the source blueprints by Samuel Akosa Onyejekwe, searchable. These are proposals, not established facts; figures and timings inside them are the author\'s planning estimates. The moves on the board are drawn from them.': 'Οι στρατηγικές που διατυπώνονται στα σχέδια δράσης των πηγών, του Samuel Akosa Onyejekwe, με δυνατότητα αναζήτησης. Πρόκειται για προτάσεις, όχι για αποδεδειγμένα γεγονότα· τα αριθμητικά στοιχεία και τα χρονοδιαγράμματα που περιέχουν είναι εκτιμήσεις σχεδιασμού του συντάκτη. Οι κινήσεις στο ταμπλό αντλούνται από αυτές.',
    'The strongest sequence of moves the computer can find for <b>{0}</b>, looking several rounds ahead with the app playing every other stakeholder. It is the critical path: the order matters, because early moves open later ones.': 'Η ισχυρότερη αλληλουχία κινήσεων που μπορεί να βρει ο υπολογιστής (παίζετε ως: <b>{0}</b>), με πρόβλεψη αρκετούς γύρους μπροστά και με την εφαρμογή να παίζει κάθε άλλο ενδιαφερόμενο μέρος. Είναι η κρίσιμη διαδρομή: η σειρά έχει σημασία, επειδή οι πρώτες κινήσεις ανοίγουν τις επόμενες.',
