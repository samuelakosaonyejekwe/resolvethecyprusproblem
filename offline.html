ilingual T+6 scorecards; quarterly benefit scorecards per stakeholder; quarterly property and benchmark dashboards; from T+36 monthly technical bulletins, quarterly summaries and an annual 'Unity Review' to both legislatures.","w":"","x":[],"b":["Reputational pressure; counters rumours and 'they tricked us' narratives"],"r":[],"m":[]},{"t":"Phase-5 consolidation and international embedding","a":"RoC, canton, EU, UN, OSCE, Turkey","c":"diplomatic","s":"Charter Court constitutionalises autonomy/sovereignty protections; annual Unity Review tabled in the RoC parliament and TC Canton Assembly; EU, UN and OSCE sign a tripartite compliance memorandum; a joint RoC-TC Canton-Turkey annual economic summit; curricula fully updated; regular cultural, sporting and municipal exchanges.","w":"Post T+36","x":[],"b":[],"r":[],"m":[]}],"games":[{"n":"Multi-player iterated cooperative game with finite phased horizon (tit-for-tat with enlargement)","i":"Cooperation must dominate in every subgame, so each round's reward and punishment are made automatic and visible rather than political."},{"n":"Mutual incentive cycle (three escalating rounds)","i":"Stakes rise as trust accumulates, so early defection is cheap to absorb and late defection is very costly to the defector."},{"n":"Illustrative payoff matrix - Round 2 (T+6)","i":"Universal cooperation strictly dominates defection for every player provided verification and snapback are trusted."},{"n":"Security-guarantee iterated coordination game with Payoff Escalation Mechanism","i":"Targeted sanction: a lone defector loses big while the others keep partial gains; multiple defections mean mutual loss (re-freeze, isolation, sanctions), so no one profits from torpedoing the process."},{"n":"Payoff escalation ladder by milestone","i":"Verification, not goodwill, is the trigger; rewards are escrowed and released only on certification."},{"n":"Multi-stage game tree (T+0, T+6, T+18, T+36)","i":"Makes the cooperative path visibly more rewarding and the defection path immediately costly."},{"n":"Commitment devices and assurance mechanisms (no-first-mover problem)","i":"The plan 'solves for trust': law, money and visible daily-life upgrades are fused into a clocked, refereed game where cooperation pays now and defection hurts immediately."}],"phases":[{"p":"Pre-negotiation foundations (roadmap 'Phase 0')","w":"0-6 months","a":["Written mandates from RoC President, TC leadership and Turkey for one-state framework, no permanent guarantor, benchmarked implementation","EU/UNSC/OSCE endorsement of the CSC concept","Quiet trilateral talks via UN Special Envoy + EU Special Representative; UK side channel","Preliminary EU agreement on CIEA and Protocol-10 roadmap","CBMs: Haspolat/Akracaga crossing with extended hours, TC athletes in RoC delegations, joint Ercan inspection, freeze on new facts on the ground","Six Technical Working Groups"],"g":["Mandates signed","TWGs operating"]},{"p":"Negotiations and legal framework (roadmap 'Phase 1')","w":"6-18 months (18 months to signature)","a":["Tracks A-E: security, constitutional, economic, property, public consent","Finalise Reunification Treaty, constitutional amendments, CSC annex","EU-RoC-TC CIEA agreement; RoC-Turkey commercial MoUs with milestone triggers","Map troop withdrawal sequence and matched Greek reductions; procure drones/monitoring tech","Outreach campaign, town halls, donor conferences","Draft referendum question; arrange observation mission"],"g":["Referendum-ready package"]},{"p":"First 180 days (do-now actions)","w":"Days 0-180","a":["Mutual freeze on new facts on the ground; open data rooms (property, utilities, budgets)","Draft TC Basic Law + RoC constitutional annex in parallel with CSC concept of operations","Pre-contract water/energy/ports/air packages with pricing, metering and milestone triggers","Capitalise CDB-North Window (EUR 2-3bn/7 yrs); choose SDZ sites; publish first procurement notices","Launch 'One State, Two Homes' narrative; pair-narrative history pilots","CIEA launch checklist: publish Rulebook, stand up CIEA Authority/OSBP/Green Trade Windows, accredit labs, switch on SPS corridors, issue first SME Passes, pilot SDZ incentives"],"g":[]},{"p":"Phase 0 - lock rules, referees and money","w":"First 90 days after agreement","a":["Days 8-21: zero-drafts of CSC, CSDP concept, referendum bill, CPF term sheet","Days 22-35: political initialling of the five-text attestation bundle (Turkey gives separate letter of assurances on non-interference)","Days 36-60: table UNSC resolution; EU Council process; introduce referendum bills; indicative CPF commitments into escrow","Days 61-75: UNSC and EU adoptions; parliaments pass referendum laws; CPF escrow accounts opened","Days 76-90: UN/EU force-generation lists, Elections Commission rules, donor notes of commitment, Phase-0 scorecard #1"],"g":["Gate 2: UNSC resolution adopted as drafted with tasks and snapback intact; UN letter of assist","Gate 3: EU Council Decision + OPLAN + sufficient force pledges","Gate 4: referendum law(s) gazetted, Elections Commission resourced, observer MoUs signed","Gate 5: CPF term sheet initialled, escrow opened with minimum coverage for first payout tranche, board appointment path agreed","Bundled dependency: failure of any one holds all; only all-green moves to T+0"]},{"p":"Phase 1 - Referenda and T+0","w":"Referendum night to Day 7 (missions' first 30-day report)","a":["Simultaneous referenda; same-night observer statement; final certification in 48-72 hours; Transitional Measures Ordinance countersigned","Force freeze: H-0 orders, H-6 spot checks, H-24 heavy-weapons seals, H-48 Force Posture Map, H-72 Compliance Bulletin #1","UNTSM, EU CSDP mission and OSCE grid deploy; hotlines live","Ercan: D0 Order of Assumption of Authority + AIP/NOTAM; D1-3 audits; D4 proving runs; D5-7 first international flights","Sports (D0-7) and education (D0-14) integration orders","Famagusta customs house / Green Trade Windows live D0-5","TC Assembly sworn, interim executive, parity ministers, Charter Court judges, JTAC","New crossings opened; initial tariff relief; Turkey Stage-1 shipping/overflight opening (per verification-gating table)"],"g":["Three linked gates before any sweetener opens: (1) dual Yes certified, (2) force freeze verified, (3) mission access granted","Verification gates: freeze confirmed; all heavy weapons sealed and inventoried; Green Trade Windows EU-compliant; Ercan operating under RoC/ICAO","Escrow release (Property Fund Tranche A, SDZ early works, utility pre-payments) only on UN/EU note 'freeze compliant, missions deployed, Ercan audited'","Snapback: movement above company size or broken seal freezes Day-1 incentives; mission access denial pauses customs/aviation openings; sub-ICAO finding suspends flights; referendum failure/taint means nothing triggers"]},{"p":"Phase 2 - T+6","w":"Month 6","a":["First unit-by-unit Turkish withdrawals from Order of Battle lists, matched by Greek non-SBA draw-down","TC Canton Police reach 70% of gazetted posts with 100% of hires trained","Stage-1 ports/airspace opening implemented (Turkish NOTAM/AIP, port access for RoC-flag ships; RoC facilitation for Turkish carriers)","SME Pass portal live; sector pilots in Morphou and Famagusta","Expand Green Trade Windows; grid integration begins with net-metering; EEZ joint technical panel starts; pilot Zone 1 opens; extended crossing hours"],"g":["Security gate: withdrawals vs schedule - green met; amber slippage <10% with 14-day remediation and escrowed openings; red >=10% or deception = snapback and UNSC/EU review","Governance gate: police 70% staffed - amber 65-69% (limited SME issuance); red <65% (pause SME Passes and ports/airspace escalation)","Connectivity gate: Stage-1 - amber = fee escrow; red = revert offending channel to pre-Stage-1","Economy gate: SME Passes - amber = caps; red = suspend new Passes","Also: no unilateral changes to property or territorial control; no significant security violations","Single T+6 Certificate from the Joint Verification Board (UN chair) only if all four gates green/amber; all T+6-linked fees/funding in escrow until issued; later breach snaps back to last certified phase"]},{"p":"Phase 3 - T+18 (the hinge)","w":"Month 18","a":["Full Turkish troop exit: zero personnel, weapons removed/destroyed with serial reconciliation, sites decommissioned and handed to RoC policing; mirror Greek draw-down","T+18 acquis basket switched on by module (justice/policing, selected market supervision, SPS corridors, AML/CFT basics)","Independent Property Commission issues decisions; first 1,000 cases decided; payouts via KYC/AML-compliant rails; appeals chamber functional","Stage-2 ports/airspace normalisation; EEZ revenue escrow functioning; arms registry complete","Unlocked: preferential SDZ tender access for Turkish firms, EU-wide recognition of northern universities, property quick-pay, joint RoC-Turkey energy/utility contracts, RoC support for narrowly defined EU-Turkey trade facilitation (per verification-gating table), EU visa facilitation for Turkey"],"g":["Triple-lock: UN, EU and OSCE each issue a green card; Phase-3 Certification Dossier; public monthly summary","Sequence Security -> Law -> Money: acquis modules only after exit certified; property disbursements at scale only when legal benchmarks are green","EU Benchmark Scorecard: agreed T+18 module set green; amber items have action plans","Snapback: any re-insertion or hidden cache freezes new benefits automatically; if demilitarisation certification slips new property disbursements pause (paid awards unaffected)"]},{"p":"Phase 4 - T+36","w":"Month 36","a":["UN mission shrinks to advisory/verification footprint (quarterly notes, rapid-reaction liaison, mixed incident board)","EU CSDP in lighter advisory mode; OSCE grid at lower tempo; JTAC permanent","RoC non-opposition to pre-annexed narrow EU-Turkey trade basket if all green","Unlocked (per verification-gating table): full integration of the North into EU customs/VAT, end of transitional tariffs, final opening of all maritime/air links, long-term RoC-Turkey commercial frameworks; customs/VAT integration plan drafted"],"g":["'All Green' dashboard for a sustained 6-12-month window: foreign troops = 0; no heavy-weapons breaches since T+18; arms registry >=95%; gun crime below baseline; TC police at full strength; Charter Court operational with no backlog; parity functioning with no boycotts; VIV used only lawfully; Green Trade Windows without anomalies; SDZ tenders transparent; Property Fund paying on schedule; grid stable; Stage-2 ports/airspace still in force; EEZ panel quarterly and escrow working; no harassment of survey vessels","Joint quarterly Green Certificate - no certificate, no trade basket","Snapback and cure: any KPI amber->red suspends the basket immediately; 30-day cure window; otherwise suspended until next quarterly assessment","Paper trail prepared beforehand: Verification Annex, Trade Basket Annex, Public Dashboard Protocol, Incident Matrix"]},{"p":"Phase 5 - consolidation and international embedding","w":"Post T+36; CIEA convergence to year 15-20","a":["Charter Court constitutionalises protections; annual Unity Review","EU/UN/OSCE tripartite compliance memorandum; annual RoC-TC Canton-Turkey economic summit","Curricula updated; cultural/sporting/municipal exchanges","CIEA years 3-10 scale-up, years 10-20 benchmarked convergence and VAT/customs integration once compliance, enforcement and revenue-sharing triggers are met","Property appeals taper, Fund winds down, residual cases to ordinary courts"],"g":["CIEA graduation trigger levels (still an open policy question)"]},{"p":"Win-Win strategies execution order (alternative package)","w":"18-36 months","a":["Framework deal (OSTH, bicameral power-share, belonging guarantees) signed together with the VWV roadmap","Launch RDT, Property Bonds, policing transition","Open Green Channel+ trade and North First procurement","Stand up JOGC; schedule ports/airports","Begin mixed-cities pilots and education charter","Seat Truth & Reconciliation Panel; progress redeployments"],"g":["Reviews at 18 and 30 months with snap-back/snap-forward clauses"]},{"p":"CSAP alternative withdrawal clock","w":"Months 0-48","a":["Months 0-18: freeze force levels, draw down heavy equipment, joint inventory with UN","Months 18-36: reduce foreign troops by >80%, consolidate to one temporary cantonment","Months 36-48: full exit, facilities transferred, long-term civil security instruments activated"],"g":["Civil Security Support Mission mandate 5 years + one 3-year extension"]}]},{"title":"Cyprus–U.S. Strategic Leverage Blueprint: A Non-Military Roadmap (August 2025)","thesis":"Assuming Turkey refuses to withdraw from northern Cyprus despite incentives, the Republic of Cyprus should make the United States its main lever by giving Washington tangible, exclusive-feeling strategic, energy, financial and intelligence stakes in Cyprus so that any threat to Cyprus becomes a threat to U.S. assets and balance sheets. The U.S. then applies non-military, multi-domain, 'sanctions-lite but persistent', reversible pressure on Ankara (export controls, targeted sanctions, IMF/G7 conditionality, occupied-territory legislation, defence-industrial realignment, a Mediterranean Stability Bloc, transparent public diplomacy) until the occupation costs more than it yields. Every stick is paired with a face-saving off-ramp: a UN-registered Phased Withdrawal Protocol over 3–5 years (Milestones A–E) verified by a UN/OSCE/EU triad, with escrowed rewards (Reunification Trust Fund of EUR 6–8bn, a Southeast Türkiye Development Facility, sanctions relief, SME credit lines, EU technical talks) and automatic snap-back if milestones slip. Guardrails are no kinetic escalation, no permanent NATO rupture, no pushing Turkey into Russia/Iran dependency, and no humiliation narrative. All Cypriot concessions to the U.S. are meant to be time-bound, revenue-positive, EU-law compatible and reversible, protected by a 'Bulwark Annex' of red lines, escrow, audits and arbitration. Author: Samuel Akosa Onyejekwe (Policy Analyst / Mechanical Engineer, Limassol); a project proposal (Doc ID CY-MOD-MOI-CIS-NSC-005, Rev 00) addressed to Cyprus's Ministries of Interior and Defence, the Cypriot Intelligence Service and the National Security Council.","strategies":[{"t":"Lock in U.S. commitment via a Cyprus–U.S. Strategic Security & Economic Partnership (SSEP)","a":"Republic of Cyprus (Leverage Cell chaired by NSC head) with U.S. NSC/State/Defence/Treasury/Energy/Commerce/intelligence community","c":"security","s":"Cyprus proposes a stack of binding and quasi-binding instruments rather than one mega-treaty: DCA (20 yrs, renewable in 5-yr increments, 2-yr termination notice), SOFA, ACSA (10 yrs), GSOMIA (15 yrs, 48-hour breach response), Priority Access & Use Agreement (20 yrs), Energy & Infrastructure Participation Agreement (20 yrs first-call rights), Pre-positioning & Resilience MoU (non-lethal, 10 yrs), Intelligence & Maritime Surveillance Annex, optional ship-rider/VBSS MoU and NGA geospatial arrangement. It grants rotational 'exclusive joint-use' of naval/air facilities with guaranteed berths, runway slots and surge rights, U.S.-priority access to logistics/energy hubs, and a joint maritime watchfloor fusing radar, AIS, satellite ISR and civil aviation feeds. In return Cyprus formally asks ('the price') for an executive determination that the north is occupied territory, a Treasury banking advisory, a ready tiered sanctions tool, a defence tilt, congressional support for a Reunification Trust Fund, and public messaging, captured in a Side-Letter of Assurances. Access Annex A (ports): Limassol Berths 6 and 7 (draft >=15 m, 300 m quay, 10 days/month), Larnaca Berth 3 (12.5 m, 250 m, 5 days/month), Vasilikos–Mari LNG-capable berth (14 m, 220 m, 5 days/month), 24-hour vacate in contingency, 11 kV shore power. Annex B (air): Larnaca Runway 04/22 (3,000 m, up to 4 sorties/week, Apron C four medium slots), Paphos/Andreas Papandreou Runway 11/29 (2,700 m, up to 8 sorties/week, Apron Bravo three heavy slots), Troodos UAV site (1,200 m runway, two MQ-9-class hangars); 60 min emergency / 3 h routine notice, 30 min in contingency; 50/50 cost-sharing of upgrades; 5-year review.","w":"Week 0–2 negotiating machine; Week 2–6 site mapping; Week 4–10 legal instruments; Week 6–12 joint-use model; Week 8–16 logistics/energy quid pro quo; Week 10–24 watchfloor; Week 12–20 cost-sharing. Milestones: M1 Month 3 term-sheets initialled; M2 Month 6 DCA/SOFA/GSOMIA signed; M3 Month 9 phase-1 upgrades and watchfloor IOC; M4 Month 12 first pre-positioning lots, ISR FOC, energy rights formalised.","x":[["Turkey","Rhetoric and air/naval posturing; expected to see that damaging Cyprus now directly harms U.S. interests"],["Cypriot public","Pushback against a 'foreign base'"],["Non-U.S. bidders / EU","Procurement complaints"],["United Kingdom","Concern about overlapping authority with SBAs"],["United States","Provides FMF / Section 333 funds, priority Excess Defence Articles (radars, counter-UAS, patrol craft upgrades), aligned Treasury/Commerce compliance posture, DFC/EXIM credit windows"]],"b":["Cyprus becomes a permanent U.S. Mediterranean anchor; threats to Cyprus are perceived as threats to U.S. assets","Port/airfield upgrades, jobs, scholarships/training, emergency-response capacity","U.S. gains logistics resilience, allied energy security, undersea-cable protection, presence without Turkish permission"],"r":["Domestic optics of 'foreign base'","EU procurement challenge","UK/SBA sensitivities","Turkish retaliation","Cyber intrusion on watchfloor"],"m":["'Rotational presence' language, cap permanent staff, publish economic benefits, parliamentary oversight visits","Lawful use of security exemptions; define 'first-call' as early engagement not sole-source","Deconfliction MoU and joint SAR exercises with UK","U.S. ship visits and ISR presence plus an open off-ramp narrative","Zero-trust design, continuous monitoring, red-team exercises, quarterly audits","Sovereignty clauses: all facilities remain Cypriot-owned; Cyprus keeps external perimeter and audit rights"]},{"t":"Embed Cyprus in U.S. Indo-European energy corridors","a":"Cyprus (Ministry of Energy, new Corridor Delivery Authority) with U.S. State/Energy/Treasury, DFC, EXIM, U.S. energy majors","c":"energy","s":"Sign a government-to-government Bilateral Corridor Compact designating priority infrastructure (Vasilikos LNG or FLNG, FSRUs, subsea pipelines, interconnectors), pre-qualified priority companies, New York/English governing law, and national-security clauses for a coordinated response if the corridor is threatened. A lean Corridor Delivery Authority (with EU observers) runs tenders; upstream is locked to U.S. operators via time-boxed first-call rights and farm-downs; midstream is two-track (LNG-first Track A; staged pipeline Track B toward Greece/Italy at 8->16->24 bcm/yr, with tie-ins for Israeli/Egyptian gas). A Cyprus–U.S. Master Offtake Vehicle signs SPAs, books capacity and charters ships, with 60–70% of capacity long-term contracted and 30–40% spot. Financing (DFC/EXIM, EIB, Energy Stability Bonds, political-risk and war-risk insurance) makes the corridor 'too big to fail' for the U.S., so the occupation becomes the binding constraint Washington must solve; FIDs are stage-gated to Turkish drawdown milestones.","w":"Day 0–90 BCC signed, CDA stood up, MOV incorporated, DFC/EXIM engagement letters; Month 4–9 appraisal sprint, FEED, SPA term sheets, insurance pool; Month 10–15 FID on LNG Track A, ship charters, ground-break; Month 18–24 first LNG cargoes, Milestone B triggers financing sweeteners; Year 3–4 pipeline leg A in service, Train 2/FLNG-2, hydrogen-ready upgrades.","x":[["United States","Moves Cyprus from a 'case in diplomacy' to a protected economic project; Navy and Treasury become owners of corridor continuity"],["Turkey","Possible naval harassment or disputed-waters interference; finds withdrawal cheaper than defiance once financing and sanctions relief are tied to verified steps"],["European Commission / buyers","Engaged and supportive given anchor volumes, interconnector hedges, hydrogen-ready design"]],"b":["Reunification becomes a U.S.-defended commercial priority","Every occupation-caused delay visibly harms U.S. firms, European buyers and financiers","Cyprus becomes regional gas aggregator and hub; redundancy between LNG and pipeline","Face-saving economic packages for Turkey post-withdrawal"],"r":["Pipeline politics","LNG price softness","EU procurement/antitrust issues from favouring U.S. firms","Local-content rules delaying FID","Sanctioned counterparties entering the chain"],"m":["Two-track redundancy","EPCI tender lotting preserving competition; published justifications for negotiated procedures","Realistic schedule-tied local content","Contractual automatic rerouting if a sanctioned counterparty appears","Communications that create positive pressure, not humiliation"]},{"t":"Master Offtake Vehicle with standard-form SPA and Tolling Agreement term sheets (New York law)","a":"Cyprus–U.S. Master Offtake Vehicle; Cyprus LNG Facility Authority (public-private JV with U.S. operator)","c":"energy","s":"SPA: MOV sells to European utilities/traders for 10–20 years, FOB Cyprus or DES, price = a x TTF + b with optional Brent floor/ceiling, USD payment within 10 banking days, 90% take-or-pay, free destination within EU/Balkans/Med, ICC arbitration seated in New York, investment-grade credit support (BBB-/Baa3). Tolling Agreement: 15 years, fixed capacity fee indexed to U.S. CPI, 90% take-or-pay, fuel gas 8–9% in kind, LCIA London arbitration, 12-month fee guarantee. In both, occupation-related interference is explicitly excluded from neutral force majeure and instead triggers make-whole payments from a Business Interruption Facility, so Turkey cannot be used as an excuse to escape liability.","w":"Term sheets Month 4–9 of corridor timeline","x":[["Lenders","Treat contracts as bankable due to credit support, take-or-pay and backstops"]],"b":["U.S. jurisdictional reach via USD, New York law, ICC/LCIA","Embeds Cyprus LNG in U.S.-controlled legal, financial and insurance ecosystems","Bankability"],"r":[],"m":["Planned maintenance notice >=6 months; unplanned outages compensated if >30 days"]},{"t":"Corridor Insurance Pool (war-risk + business interruption)","a":"Syndicate led by Lloyd's, U.S. insurers and European reinsurers; public backstop DFC, EXIM, MIGA; overseen by Cyprus–U.S. Corridor Authority and independent trustee","c":"economic","s":"A 10-year renewable pool covering naval harassment, blockade, interdiction, seizure of cargoes and occupation-related shutdowns across the Cyprus EEZ, Vasilikos LNG, FLNG and the subsea pipeline. Payout is automatic if the UN/OSCE verification cell certifies interference, or AIS/ADS-B data confirms a blockade/hostile act, or the Corridor Authority declares force majeure certified by the insurers' surveyor. Because DFC and EXIM are guarantors, each occupation-linked disruption costs U.S. agencies money, raising the U.S. incentive to end the occupation, while being framed as 'regional risk management' rather than punishment.","w":"Set in Month 4–9; 10-year tenor aligned with SPAs","x":[["United States","Direct financial exposure creates sustained interest in corridor stability"],["Turkey","Can accept framing as regional risk management"]],"b":["Bankability for DFC, EXIM, EIB and private banks","Premium reductions tied to U.S. Navy/Cyprus MDA posture"],"r":[],"m":["USD 50m war-risk deductible per event; 15-day BI waiting period","Escrow account for transparent disbursement"]},{"t":"Tender scoring matrix tilted to U.S. majors while EU-compliant","a":"Cyprus Ministry of Energy / Corridor Delivery Authority; evaluation committee with EU observer and external auditor","c":"energy","s":"Use the non-price award criteria allowed by Directives 2014/25/EU and 2014/24/EU so criteria 'appear neutral but in practice tilt' to U.S. bidders: Technical capacity 25% (deepwater >1,000 m, LNG trains >5 mtpa, pipelines >200 km); HSE 15% (LTIFR <0.2, ISO 14001/45001); Cybersecurity 15% (NIST CSF, ISO 27001, NATO/EU MDA integration); Supply-chain transparency and sanctions compliance 15% (OFAC/AML, blockchain traceability); Financial strength 10% (rating >=A-, self-finance >20% capex); Innovation/tech transfer 10%; Sustainability 5%; Local content 5%. Minimum qualifying score 70/100; U.S. majors expected to score 85–95+.","w":"","x":[["Non-U.S. bidders","Even aggressive price bids score poorly on HSE, cyber, sanctions compliance and technical depth"]],"b":["U.S. majors 'win cleanly without appearance of favoritism'"],"r":["EU procurement challenge (implicit)"],"m":["Proportionality, equal treatment, transparency, mixed evaluation committee"]},{"t":"Congressional policy brief framing the occupation as a U.S. energy-security risk","a":"Cyprus / 'Policy & Energy Security Taskforce' to U.S. Congress committees","c":"information","s":"A draft brief quantifies U.S. exposure (corporate stakes, export value, insurance premia, NATO deconfliction cost) and asks Congress for six things: a resolution designating the north 'occupied territory' (Crimea precedent); a tiered sanctions framework with executive snap-back; direction to DOE/State to prioritise U.S. participation in East Med LNG via Cyprus; mandated DFC/EXIM priority financing; expanded DoD access agreements;","w":"","x":[["U.S. Congress","Treats reunification as an economic and strategic imperative rather than a talking point"]],"b":["Creates the congressional finding that occupation materially impairs U.S. energy-security interests"],"r":[],"m":[]},{"t":"Trigger coordinated economic leverage on Turkey","a":"U.S. execution cell (NSC, Treasury OFAC/FinCEN, State L/EB/DDTC, Commerce BIS, DoD) with G7, EU EEAS, UK OFSI, Canada, Japan, IMF Executive Directors; Cyprus MoF/Energy/Defence/Central Bank","c":"economic","s":"A 12-step playbook: map supply chains, entities, finance channels and a market-sensitivity baseline; issue a new IEEPA Executive Order authorising blocking sanctions, sectoral measures and a 50 Percent Rule; add North-linked Turkish entities to the Entity List / Military End-User List with presumption of denial and shift ITAR policy; designate a narrow first wave of 10–20 state-linked firms with a 30–60 day wind-down licence; publish FinCEN red-flag advisories to drive voluntary bank de-risking; and have G7 Executive Directors require 'prior actions' (construction freeze, Varosha design, UN/OSCE site verification) before any IMF programme or exceptional access. Pressure is deliberately light, persistent and compounding on the lira, sovereign yields/CDS and listed equities, with pre-announced off-ramps at Milestones A–E.","w":"Day 0–7 cell; Day 1–21 mapping; Day 7–30 authorities; Day 30–90 export restrictions; Day 45–120 designations; Day 60–180 IMF leverage. Cadence: Week 1 advisory and rulemaking notice; Week 6 first designations; Week 10 allies mirror; Week 12–18 IMF/G7 language surfaces.","x":[["Banks/insurers","Self-de-risk and self-censor ahead of formal bans, creating FX pressure"],["Markets","Higher sovereign risk premia, costlier refinancing, equity underperformance of exposed firms"],["Turkish state-linked firms","Lobby Ankara for a face-saving exit"],["Turkey","Possible NATO blowback, pivot to Russia/China, domestic backlash"]],"b":["Raises financial and reputational cost of occupation without broad embargo","Reversible, rules-based: compliance unlocks relief"],"r":["NATO blowback","Pivot to Russia/China","Domestic backlash in Turkey","Over-compliance harming civilians"],"m":["Keep measures narrow and entity-based; avoid broad secondary sanctions; constant NATO de-confliction","Pair with post-withdrawal carrots (EXIM credit lines for Turkish non-defence SMEs)","Respectful narrative: 'economic modernisation and lawful trade', never 'defeat'","General licences for food, medicine, medical devices, remittances, internet tools, academic/cultural exchanges; no energy or food export shocks; FAQs","Civil penalties prioritised over criminal unless wilful"]},{"t":"Undermine Turkey's occupation legitimacy in U.S. law (Occupied Cyprus Accountability and Stabilisation Act)","a":"U.S. Congress (Hellenic Caucus-led bipartisan sponsors) plus Executive implementation (President, OFAC, BIS, State, CBP, FinCEN, USAID/DFC/EXIM)","c":"legal","s":"(ii) makes it unlawful for U.S. persons and U.S.-owned or controlled foreign subsidiaries to transact, finance, insure, invest in, export to, import from or service the occupied area, blocks property of material supporters, and presumes goods from the area inadmissible absent clear and convincing evidence; (iii) authorises optional narrow secondary sanctions, a procurement bar, INA visa restrictions, FinCEN/§311 measures; and (iv) authorises and appropriates a Reunification Trust Fund paid out only on verified milestones. Implementation follows via a national-emergency declaration, OFAC 'Cyprus Occupied Territory Sanctions Regulations' (31 C.F.R. Part 5xx), BIS, CBP, State and FinCEN action.","w":"Hearing path 3–4 weeks; in master blueprint, passage in Phase III (Day 271–540). Sunset on certified full withdrawal with five-year snap-back authority.","x":[["Banks, insurers, auditors, shipping registries, multinationals","Treat the north as high-risk and off-limits even beyond the letter of the law"],["U.S. Executive","May threaten veto; defused by limited waiver"],["Turkey","Faces legal and reputational isolation; association with occupation becomes toxic in ESG, academia, sport, conferences"]],"b":["Legal hook to which sanctions, trade bans, procurement bars and visa restrictions attach","Severs 'commercial oxygen' to the occupied zone","Pre-loads reconstruction carrots so they are 'real, not theoretical'","Political durability if the executive wobbles"],"r":["Separation-of-powers challenge","WTO/GATT challenge","Veto threat","Humanitarian harm","Industry lobbying against"],"m":["Frame under GATT Article XXI national-security and public-morals exceptions, mirroring Crimea measures","Limited reportable waiver","Codified humanitarian exemptions and quarterly humanitarian impact reviews","90-day wind-down licence, advisory hotline, FAQs"]},{"t":"Military-industrial realignment against Turkish leverage","a":"United States (State pol-mil, DoD/EUCOM, export-control agencies, Congress) with Greece and Cyprus","c":"security","s":"Three lines of effort. A: rechannel combat airpower – fast-track F-16 Viper upgrades and F-35A onboarding for Greece, stand up a regional Maintenance, Repair & Overhaul Unit in Greece, relocate avionics/landing-gear/composites workshare and a spares distribution hub to Greece/Cyprus, and give Cyprus 'airpower without fighters' (NASAMS/Patriot-class IAMD, 3D radars, IFF Mode-5, coastal anti-ship batteries, maritime patrol/ISR, Link-16/JREAP-C). B: re-site 2–3 recurring U.S.-led multilateral exercises (ASW/air defence, MCM/SAR, integrated air picture) to stage from Cypriot ports and airfields with routine port calls. C: a joint missile-defence footprint in the south (mobile Patriot+NASAMS+counter-UAS layer, or a fixed 'Aegis-ashore-like' site). Each line pauses or slows at verified withdrawal milestones.","w":"Day 0–30 governance; 0–6 months DCA/SOFA talks, FMS pipeline, IAMD design, exercise calendar ('gravity is shifting', pausable); 6–18 months Greek MRO unit, first exercises in Cyprus, initial IAMD components; 18–36 months fusion cell live, missile-defence IOC, workshare moves (partly reversible); 36+ months full exercise cycle, IAMD FOC ('new normal', harder to reverse).","x":[["Turkey","Sees military influence eroding the longer the occupation persists; fewer de-facto vetoes and more constructive engagement at milestones; risk of arms-race narrative"],["NATO","P bligations on the operator rather than the state.","w":"","x":[],"b":["Dependable local partners; lower lifecycle cost of regional assets"],"r":[],"m":[]},{"t":"Structured conditionality: milestone-linked privileges and escrowed benefits for the U.S.","a":"Republic of Cyprus","c":"diplomatic","s":"Each additional U.S. privilege (extra berths, longer ROFO window, further landing rights, extra offtake volumes) unlocks only after verified Turkish drawdown steps (troop reductions, de-mining, return of fenced areas), with some held in escrow until UN/EU/OSCE certify withdrawal phases. If benchmarks stall, privileges snap back to baseline, so the U.S. is paid for results in ending the occupation rather than for effort.","w":"","x":[["United States","Has a standing incentive to deliver Turkish withdrawal steps to unlock more privileges"]],"b":["Zero cost to Cyprus unless progress happens; no open-ended commitments"],"r":[],"m":[]},{"t":"Strategic Partnership Account and no-hidden-cost structure","a":"Republic of Cyprus","c":"economic","s":"All U.S. payments, fees and royalties accrue to a ring-fenced account used only for host-nation costs and resilience upgrades, with an independent audit, a public annual scorecard and automatic termination if Cyprus's net fiscal benefit turns negative. Operators pay a 1–2% levy on OPEX into environmental and community funds, carry full liability insurance and indemnify the Republic; performance bonds cover slipped deliverables.","w":"","x":[],"b":["Cyprus never carries hidden costs; domestic legitimacy"],"r":[],"m":[]},{"t":"Sanctions lever 1: Crimea-style embargo on the occupied area (Cyprus-specific Executive Order)","a":"U.S. President / OFAC","c":"legal","s":"A new IEEPA-based Executive Order mirroring EO 13685 makes new investment, services, trade, financing, property transactions, insurance and tourism dealings with the occupied north sanctionable for U.S. persons and exposes non-U.S. persons to secondary sanctions, with general licences for humanitarian and UN work.","w":"Week 3–6 of the sanctions ladder","x":[["Private sector","Economic activity chilled fast, as with Crimea"]],"b":["Chills illegal property deals, drilling and tourism feeding the occupation; reduces compliance ambiguity for U.S. firms"],"r":[],"m":["Humanitarian/UN general licences"]},{"t":"Sanctions lever 2: targeted designations of officials and enablers (Global Magnitsky + §7031(c))","a":"U.S. Treasury OFAC and State Department","c":"legal","s":"Block assets of Turkish and 'TRNC' officials, commanders, financiers and cronies who materially support the occupation under EO 13818 for corruption/rights abuses (property seizures, censorship, intimidation), and impose visa bans on them and immediate family under Section 7031(c).","w":"Week 0–2","x":[],"b":["Raises personal cost of obstructing a settlement; bipartisan framing; low spillover to U.S. economy"],"r":[],"m":[]},{"t":"Sanctions lever 3: expand CAATSA deeper into Turkey's defence ecosystem","a":"U.S. State/Treasury","c":"economic","s":"Use CAATSA §231/§235 menu sanctions (export-licence denials, U.S. bank lending bans, IFI lending vetoes, Ex-Im bans, principal-officer sanctions) against additional defence SOEs and executives supporting the occupation, listing executives on the NS-MBS or SDN lists.","w":"Month 2–4","x":[],"b":["Slows the occupation's military sustainment cycle; rewards compliant suppliers and allies (Greece/Cyprus/Israel)"],"r":[],"m":[]},{"t":"Sanctions lever 4: export-controls squeeze on dual-use technology (BIS)","a":"U.S. Commerce BIS, DOJ","c":"technology","s":"Place Turkish defence/dual-use firms (UAVs, ISR, optics, avionics, propulsion, semiconductors) on the Entity List and/or Military End User List under 15 CFR Part 744 with presumption of denial, reaching foreign-made items with U.S. content via the EAR and Foreign Direct Product rules, reinforced by 'is informed' letters and re-export enforcement.","w":"Week 3–6","x":[],"b":["Lengthens production lead times and costs; shifts demand to U.S./allied producers"],"r":[],"m":[]},{"t":"Sanctions lever 5: financial-system pressure (FinCEN §311 + OFAC secondary exposure)","a":"U.S. Treasury FinCEN and OFAC","c":"economic","s":"Designate specific Turkish banks, money-service businesses or the occupied area's financial system as a 'primary money-laundering concern' under PATRIOT Act §311, cutting them off from U.S. correspondent banking, with OFAC secondary exposure for foreign facilitators and advisories on property-transaction and sanctions-evasion typologies.","w":"Month 2–4","x":[["Banks","De-risk; shadow economy starved"]],"b":["Squeezes illicit flows and property laundering; protects the dollar system"],"r":[],"m":[]},{"t":"Sanctions lever 6: defence sales leverage (holdbacks and conditionality)","a":"U.S. State/DoD; Congress (holds)","c":"security","s":"Freeze or condition F-16 deliveries/upgrades, munitions and spares on concrete, time-bound Cyprus steps (troop drawdown, verifiable non-provocations), while maintaining waivers and deeper cooperation with Cyprus under the Eastern Mediterranean Security & Energy Partnership Act and ITAR embargo suspensions.","w":"Month 4–6","x":[["Turkey","Document notes Ankara accepted conditionality in 2024 around Sweden/NATO"]],"b":["Reduces coercive air advantage; uses existing leverage without new outlays"],"r":[],"m":[]},{"t":"Sanctions lever 7: lawful, targeted trade tools","a":"USTR / U.S. Commerce; coordination with EU","c":"economic","s":"Keep Turkey off GSP (terminated 2019) and explore narrow tariff measures that survive court review – targeted antidumping/countervailing duties or a procedurally clean Section 232 action – plus dual U.S./EU notices on firms operating in the north.","w":"","x":[],"b":["Economic isolation of occupation-linked sectors; protects U.S. producers"],"r":["Court challenge"],"m":["Avoid the legally flawed 2018 ad-hoc doubling of 232 steel tariffs"]},{"t":"Sanctions lever 8: sovereign and SOE financing limits","a":"U.S. Treasury OFAC","c":"economic","s":"Under the Cyprus Executive Order, issue Russia-style sectoral Directives limiting U.S. primary/secondary market dealings in new Turkish sovereign debt and state-owned-enterprise debt/equity linked to occupation activities, with time-limited tenors and carve-outs for ordinary banking.","w":"Month 4–6","x":[],"b":["Raises Ankara's cost of the status quo with minimal U.S. market disruption if scoped"],"r":[],"m":[]},{"t":"Sanctions lever 9: aviation and maritime pressure (non-kinetic)","a":"U.S. OFAC, Coast Guard","c":"economic","s":"Designate unrecognised ports/airports in the north and any operator/insurer servicing them; prohibit U.S. insurance/reinsurance and USD settlement for voyages or flights touching them (Crimea model); issue shipping advisories to push P&I clubs and carriers to de-risk. The Act version adds that vessels calling at northern ports become blocked property in U.S. jurisdiction and aircraft using unrecognised airports are denied U.S. overflight/landing.","w":"Month 4–6","x":[],"b":["'Strangles gray-market connectivity'; low-cost leverage enforced by insurers and banks"],"r":[],"m":[]},{"t":"Sanctions lever 10: CFIUS presumptive scrutiny of Turkish state-linked capital","a":"CFIUS","c":"economic","s":"Direct CFIUS under FIRRMA to treat new acquisitions or sensitive non-controlling investments by Turkish SOEs/state-linked funds as presumptively high-risk while the occupation persists.","w":"","x":[],"b":["Adds systemic cost to intransigence"],"r":[],"m":[]},{"t":"Sanctions lever 11: Syria-EO-style ministry designations (snap sanction, snap lift)","a":"U.S. Treasury OFAC","c":"economic","s":"If escalation warrants, block select Turkish ministries (Defence, Energy, Interior) narrowly and time-bound with wind-down licences, then lift upon verifiable steps, as the U.S. did in 2019.","w":"Snap option at any point","x":[],"b":["Immediate, exchangeable leverage; reversible; keeps NATO channels intact"],"r":[],"m":[]},{"t":"Sanctions lever 12: enforcement multipliers","a":"BIS, DOJ, OFAC, interagency","c":"legal","s":"In parallel: aggressive BIS/DOJ enforcement against re-exports (especially UAV components), OFAC compliance advisories for banks, shippers and online travel agencies, and name-and-shame listings (Entity List, Unverified List, MEU). Section 1.4 adds optional plus-ups: an SEC risk-factor disclosure rule for exposure to the occupied area, a government procurement bar, and allied port-state control against repeat callers at northern ports.","w":"Parallel throughout","x":[["Private sector","Self-policing"]],"b":["Lower direct U.S. enforcement cost while tightening the net"],"r":[],"m":[]},{"t":"Bulwark 1: governance and verification safeguards","a":"Republic of Cyprus (demanded of the U.S. before engagement)","c":"legal","s":"Third-party verification triad (UN political, OSCE technical, EU financial) with automatic triggers: 30-day inspection -> 15-day joint assessment -> automatic release or snap-back, with 'no discretionary limbo'; a Joint Implementation Commission publishing monthly traffic-light dashboards; hotline and incident playbooks with a 30-day technical -> 60-day ministerial -> neutral arbitration ladder.","w":"Built before any privileges take effect","x":[],"b":["Progress and benefits do not depend on U.S. goodwill"],"r":[],"m":[]},{"t":"Bulwark 3: legal safeguards inside treaties and contracts","a":"Republic of Cyprus","c":"legal","s":"UN-registered Phased Withdrawal Protocol with a Reversibility article (90-day miss allows automatic suspension/reversal of benefits); commercial contracts under New York/London law with ICC/LCIA arbitration, make-whole and force-majeure carve-outs; a Side-Letter of Assurances from the U.S. Administration plus Hill letters; EU/UK compliance lock-ins signed off by the Attorney-General; dispute ladders in each instrument (Joint Defence Council and termination notice for DCA/SOFA).","w":"","x":[],"b":["Enforceability moves from politics into binding arbitration and UN-registered text"],"r":[],"m":[]},{"t":"Bulwark 4–5: red lines and access/basing safeguards","a":"Republic of Cyprus","c":"security","s":"Four red lines the U.S. must accept in writing up front (no permanent bases or extraterritorial sovereignty; no exclusivity beyond time-limited ROFO; no sovereign guarantees; no derogation from EU law), plus rotational access with caps on permanent staff, non-lethal pre-positioning, joint inventory, Cypriot external perimeter, sovereignty clauses in every annex and a 5-year review revocable if the U.S. breaches side-letter commitments.","w":"","x":[],"b":["Prevents strategic capture (bases, exclusivity, debt traps)"],"r":[],"m":[]},{"t":"Bulwark 7 and 9: transparency, oversight, data and intelligence safeguards","a":"Republic of Cyprus","c":"information","s":"Independent audits, public dashboards, parliamentary oversight visits and published grant criteria; GSOMIA-guarded information sharing with quarterly audits, need-to-know/minimisation and 48-hour breach response; zero-trust cyber design with continuous monitoring and red-team exercises on the joint watchfloor.","w":"","x":[],"b":["Sunlight deters overreach; sensitive data cannot be exploited or withheld to pressure Cyprus"],"r":[],"m":[]},{"t":"Bulwark 10: political-durability safeguards against a change of mood in Washington","a":"Republic of Cyprus","c":"legal","s":"Statutory hooks on the U.S. side (Occupied Cyprus Act, reporting to Congress every 120 days) plus the Side-Letter of Assurances listing sanctions posture, deterrence tilt and funding lines; milestone-gated access and commercial ROFOs that sunset unless renewed against metrics.","w":"","x":[],"b":["Creates U.S. domestic constituencies and paper trails that are hard to reverse quietly"],"r":[],"m":[]}],"games":[{"n":"Cost–benefit (payoff) shifting for the occupier – implicit, not formally modelled","i":"Pressure is designed to 'bend without breaking': strong enough to matter, controlled enough to keep alliances intact."},{"n":"Entanglement / tying a patron's interests to one's own (commitment by creating stakes) – implicit","i":"A small state can manufacture a great power's commitment by making the great power's own balance sheet hostage to the status quo."},{"n":"Conditional reciprocity with automaticity (graduated carrots and sticks, snap-back) – implicit","i":"Removing discretion makes both threats and promises credible and removes the incentive to stall."},{"n":"Escrow against patron defection (hands-tying the ally) – implicit","i":"Cyprus pays for outcomes, not effort, converting U.S. access into a performance contract."},{"n":"Outside-option management (Turkey's Russia/Iran pivot) – implicit","i":"Keep sticks narrow and entity-based and always pair them with credible carrots so the outside option stays unattractive."},{"n":"Face-saving / audience-cost reduction – implicit","i":"Lowering domestic audience costs is treated as being as important as raising external costs."},{"n":"Market signalling and private-sector de-risking as force multiplier – implicit","i":"'Transparency as pressure': light public signals can move markets more than broad embargoes."}],"phases":[{"p":"Phase I – Shape & signal","w":"Day 0–90 (Leverage Cell stood up Day 0–15)","a":["Create joint Leverage Cell in Nicosia and Washington with six lines of effort (Legal/Norms, Finance/Trade, Defence/NATO, Energy/Maritime, Information/Diplomacy, Verification)","Announce SSEP and begin DCA/SOFA talks","Launch Eastern Mediterranean Energy Fast-Track pre-award rounds preferencing U.S. operators","U.S. Treasury compliance advisory on enhanced due diligence for entities in the occupied zone","Shift selected NATO exercise serials into Cypriot EEZ; routine U.S. Navy logistics calls at Limassol","Congressional campaign for the Occupied Cyprus Accountability & Stabilisation Act"],"g":["Carrot: if Turkey freezes new militarisation/construction, U.S. backs a technical customs-union modernisation review (process only)","Sticks: advisory, exercise relocation, procurement signalling to Greece/Cyprus","Metrics: bank de-risking, insurance premia for shipping to the north, press coverage, Ankara statements","Risk control: immediate Track-II de-confliction talks; invite Turkey to non-political maritime safety workshops"]},{"p":"Phase II – Bite economically, realign militarily, lock energy","w":"Day 91–270","a":["OFAC-style designations on state-linked firms benefiting from the occupied zone","IMF/G7 signalling that exceptional support is contingent on de-escalation in Cyprus","Prioritise FMS/EDA to Greece and Cyprus (ISR, coastal defence, counter-UAS); announce U.S.–Cyprus Integrated Air/Maritime Picture","Energy term sheets with U.S. firms for LNG, FSRUs, subsea infrastructure and Green Mediterranean power/data cables","Draft bill sections (business ban, snap-back authority, reconstruction fund)"],"g":["Carrot: Varosha confidence step (freeze and monitored access plan design) -> pause new designations and convene a Turkey–Cyprus energy safety working group","Metrics: TRY FX volatility, Turkish CDS spreads, corporate exits from the north","Risk control: pre-coordinate NATO issue triage; keep alliance deliverables separate"]},{"p":"Phase III – Legal isolation and formal off-ramp","w":"Day 271–540","a":["Pass the Occupied Cyprus Act; Presidential Executive Determination that the north is 'occupied territory'","Publish tiered, reversible U.S. Sanctions Framework","Table the Phased Withdrawal Protocol (3–5 years; UN/OSCE/EU verification)","Announce the Reunification Trust Fund (Cyprus–U.S.–EU capitalised)","Expand naval/air access agreements and pre-positioning"],"g":["Milestone A (Month 18): construction freeze + troop baseline -> PWP signing bonus (trade facilitation projects in Turkey's southeast) / technical customs-union review","Milestone B (Month 24): Varosha monitored opening + 5,000 troops withdrawn -> limited sanctions relief on named entities","Milestone C (Month 36): dissolution of occupation-specific paramilitary/policing -> U.S. export-import credit lines for Turkish non-defence SMEs","Milestone D (Month 48): border regime normalisation + 80% troop withdrawal -> backing for EU–Turkey technical talks (aviation, customs)","Milestone E (Month 60): full withdrawal and handover of military sites -> major RTF disbursement, Turkey–Cyprus trade corridor","Stick: automatic snap to next sanctions tier if a milestone is missed by 90 days; G7 export-credit freezes"]},{"p":"Phase IV – Withdrawals and asset transitions","w":"Day 541–1080","a":["Sequenced base closures and site handovers; UN/OSCE monitoring detachments; 'Cyprus Gendarmerie' units trained by the EU for transitional security","Escrow for contested titles; claims tribunal with capped timelines; RTF-funded public works in the north","Maritime and air safety compacts; AIS/ADS-B transparency corridor across the island"],"g":["Carrots: RTF tranches, graduated delistings, U.S. non-defence commercial missions to Turkey","Sticks: freeze tranches, broaden entity lists, enhanced export controls if inspections obstructed","Metrics: sites vacated, tribunal case throughput, customs throughput"]},{"p":"Phase V – Finalisation and normalisation","w":"Day 1081–1825","a":["Certification of full withdrawal; termination of occupation-related measures","Long-term Cyprus–Turkey non-aggression and maritime safety pact witnessed by U.S./EU","Integration of northern infrastructure; EU regional funds unlocked; private capital crowd-in","U.S.–Cyprus strategic review converting rotational footprints into an enduring Mediterranean Stability Hub"],"g":["EU Council acknowledgment; U.S. certification to Congress","Hard criteria: zero foreign troops, verified base closures, normalised customs/traffic, functioning claims tribunal, incident-free maritime and air corridors for 12+ months","Snap-back authority retained for 5 additional years"]},{"p":"Escalation ladder if Turkey refuses cooperation","w":"Parallel to phases","a":["Tier 1: expanded compliance advisory; insurance/reinsurance cautions for North-linked commerce","Tier 2: additional entity designations; export-control tightening; coordinated G7 export-credit holds","Tier 3: U.S. defence procurement re-routed away from Turkish supply chains; broader financial measures on state-linked banks tied to the north","Tier 4 (ceiling): secondary sanctions on a narrow ring of occupation-enabling entities"],"g":["Rule: always pair sticks with a credible off-ramp (pause/reversal on verified steps)"]},{"p":"U.S. sanctions playbook ladder (Part 7)","w":"Week 0 to Month 6","a":["Week 0–2: announce intent; OFAC/BIS advisories; 7031(c) visa bans; Global Magnitsky designations on top targets","Week 3–6: Cyprus Occupation Executive Order (Crimea-style); first wave of banks/firms; Entity List/MEU adds","Month 2–4: expand CAATSA; §311 special measures on complicit financial rails","Month 4–6: maritime/aviation and sectoral financing directives; condition F-16 pipeline","Snap option: temporary ministry designations, lifted if benchmarks met"],"g":["Verifiable de-escalation steps trigger lifting"]},{"p":"Phased Withdrawal Protocol schedule (Section 1.8 version)","w":"Month 0–60 (compressible to 36)","a":["Month 0–3: tribunal law and RTF charter (Cyprus); standstill and baseline data (Turkey); verifiers deployed","Month 3–6: Varosha safety plan; cantonment; Development Facility set up","Month 6–12: claims intake opens; first withdrawals; SAR drills","Month 12–18: utilities works; two base closures and demining; SME credit line design","Month 18–30: border pilot normalisation; paramilitary dissolved, 60% out; INCSEA-style rules enforced","Month 30–42: mixed patrols; 80% out, major bases closed; EU technical talks support","Month 42–60: full handover; 100% out and remediation sign-off; final verification and sunset report"],"g":["Milestone A Month 6–12 (~10–15% reduction) -> prep funds and planning grants","Milestone B Month 12–18 (~20%) -> Development Facility tranche 1, RTF early works","Milestone C Month 18–30 (~60%) -> SME credit lines, bigger RTF infrastructure","Milestone D Month 30–42 (~80%) -> EU–Turkey technical talks support","Milestone E Month 42–60 (100%) -> final tranches, sunset of sticks"]},{"p":"Bulwark Annex bolt-on steps (before engagement)","w":"Pre-engagement","a":["Step 1: Cabinet red lines and enabling laws","Step 2: attach Bulwark Annex to DCA, SOFA, Access Annexes, SPAs/TAs, Insurance Pool and Withdrawal Protocol","Step 3: constitute verification triad and JIC; publish dashboards and 30/15-day trigger logic","Step 4: stand up escrow and the Strategic Partnership Account","Step 5: insert dispute and make-whole language in all commercial terms","Step 6: publish EU/UK compliance notes and SBA deconfliction MoU","Step 7: pre-agree the yellow/orange/red snap-back ladder and public comms text"],"g":["No U.S. privilege takes effect until verification rails exist"]}]},{"title":"A Holistic Global Strategy to Prevent Military Aggression Against Cyprus (June 2025)","thesis":"Military deterrence alone cannot protect the Republic of Cyprus from renewed aggression, chiefly from Turkey; Cyprus must instead pursue 'holistic deterrence' by embedding itself in so many global economic, legal, energy, security, humanitarian and technological systems that attacking it becomes prohibitively costly for the aggressor and for everyone else. The governing idea is 'irresistible entanglement': Cyprus should not beg for protection but make protecting it profitable and unavoidable, so that allies defend it out of self-interest. Turkey is to be handled with a mix of quiet carrots (non-energy trade, conditional energy-hub participation, face-saving off-ramps via Gulf and Israeli mediators) and silent sticks (pre-drafted elite sanctions, automatic economic, legal and cyber triggers, ambiguous tripwire defence guarantees). The conclusion calls for a 'New Cyprus Doctrine' that moves Cyprus from a reactive small state to a proactive 'micro-power' and for the strategy to be institutionalised through a National Strategy Council for Deterrence and Resilience.","strategies":[{"t":"Strategic Global 'Business Immunity Network'","a":"partner states and multinationals as co-signatories","c":"economic","s":"Cyprus quietly signs modular 'immunity' micro-agreements with major economies so that Cypriot projects in energy, maritime, banking, tourism, tech and agritech sit under each partner's economic-security umbrella. Each agreement carries an 'Automatic Economic Solidarity Clause': if a Cyprus-based project is attacked, the partner reacts economically against the aggressor. Later rebranded publicly as the 'Cyprus Strategic Economic Security Network'.","w":"Feb internal approval; Mar legal consultations abroad; Apr soft outreach to France, UAE, India, Germany; May draft sample agreements; Jun first bilateral mini-pacts (tourism, fintech, maritime, AI research); Jul add USA, Japan, Saudi Arabia under 'Business Partnership Plus' branding; Aug media soft-leaks; Sep formalise framework with 5-10 country partnerships; Oct invite MNCs; Nov public signing ceremonies in Paris, New Delhi, Berlin, Abu Dhabi, New York; Dec quietly add physical/cyber defence extension clauses.","x":[["Turkey","Hears rumours of economic 'tripwires' via controlled leaks to Reuters, Bloomberg and the FT and begins to hesitate before escalating rhetoric or action."],["USA","Via Greek-American and Cypriot-American intermediaries, gives silent agreement that damage to Cyprus-linked US investments triggers automatic economic retaliation."],["UAE / Saudi Arabia","Investments in Cypriot tourism, ports and energy hubs quietly covered by Saudi and UAE defence doctrines, arranged at private investment forums in Abu Dhabi, Dubai and Riyadh."],["India","Accepts Cyprus as its Mediterranean 'economic outpost', with defence-cyber cooperation as a bonus."],["France / Germany","Their banks' investments are embedded in Cypriot tech-finance so any attack triggers a European bank backlash."],["Israel","Venture capital enters Cypriot energy and tech under Israeli business doctrine protection."]],"b":["An attack on Cyprus is perceived as an attack on the business interests of the USA, Germany, France, UAE and others - 'massive deterrence without firing a shot'","Cyprus becomes 'untouchable' through entanglement of commercial interests rather than military force alone","Investment inflows and positioning as 'new Singapore of the Med' / global safe haven for secure business"],"r":[],"m":["Keep all actions invisible to Turkey until irreversible","Offer mutual benefit first, embed immunity clauses quietly afterwards"]},{"t":"Cyprus Global Sovereignty Partnership (CGSP) with EU-Led Defence Guarantees","a":"President of Cyprus with Defence and Foreign Affairs leadership; willing EU states (France, Germany, Italy, Greece, later Spain, Portugal, Netherlands, Sweden); European Defence Agency","c":"security","s":"A mini-treaty among willing EU states declaring that a threat to Cyprus is treated as a threat to all, triggering diplomatic, economic and if necessary military action - without naming Turkey. Publicly it is disguised as a 'Mediterranean Stability Compact / Initiative' stressing disaster response and small-state rights. The intended effect is 'ambiguous tripwire defence': Turkey can never know whether an attack triggers full EU retaliation.","w":"2025 monthly: Jan white paper; Feb private leader meetings; Mar closed-door EU foreign ministers' mini-summits; Apr draft Framework of Understanding; May align with EDA; Jun form 'EU-CGSP Circle'; Jul quiet bilateral defence addenda; Aug court Spain, Portugal, Netherlands, Sweden; Sep soft launch at UNGA side events as 'Mediterranean Stability Compact'; Oct rapid-deployment protocols and exercise simulations; Nov political declaration signed without naming Turkey; Dec push into European Council conclusions and EDA planning.","x":[["Turkey","Faces psychological and legal uncertainty; tones down public threats as risk of 'uncertain retaliation' rises."],["France","Private commitment via presidential advisers to defend Cyprus militarily if absolutely needed; leads drills with Italy."],["Germany","Silent cyber defence pact for Cypriot banks and critical infrastructure, embedded in EU cyber cooperation agreements."],["Italy","Naval commanders pre-agree fast movement of assets via private rules-of-engagement exercises."],["EU High Representative","After private briefings, states publicly that any threat to Cyprus's sovereignty would damage EU stability."],["UN","Emergency mediation mechanisms pre-arranged so Cyprus remains 'the peaceful party'."]],"b":["Credible, legally binding yet politically low-key deterrent without escalation","Discourages Turkish risk-taking","Makes each helper see protecting Cyprus as protecting 'their own power, money, security, and influence'"],"r":["Open military alliances could provoke Turkey directly (flagged by the document itself)"],"m":["Never name Turkey; stress humanitarian, rescue, peacekeeping and economic-cooperation narratives","Operate under a neutral name","Low-profile exercises"]},{"t":"Preemptive Energy Diplomacy Expansion ('Energy Web Defence')","a":"Cyprus (special 'Energy Ambassadors' - senior diplomats or energy CEOs); regional states, Gulf funds, US/EU guarantors, energy majors","c":"energy","s":"Before Turkey can isolate Cyprus over the Greece-Cyprus-Israel power cable, Cyprus rapidly multiplies energy deals with Egypt, Israel, Jordan, UAE, Saudi Arabia, the EU and the US so that damaging any Cypriot energy project harms many states and companies at once. Mechanisms include redundant Israel-Cyprus pipelines and LNG routes, Egyptian LNG processing of Cypriot gas, Gulf investment (Masdar, ACWA Power) in solar and green hydrogen, widening the EastMed Gas Forum into an EastMed Energy Forum, Exim Bank/EIB guarantees, a EUR 5 billion Cyprus-EU-Gulf Energy Stability Fund, gas-to-hydrogen R&D centres and small military-security clauses inside investment contracts. Foreign state-backed companies get small ownership stakes so they have 'skin in the game'.","w":"2025 monthly: Jan blueprint; Feb envoys to UAE, Saudi Arabia, Israel, Egypt, Jordan, EU, US; Apr MoUs with UAE and Saudi Arabia; May expand EastMed forum (Jordan, Italy, France); Jun US-EU investment guarantees; Jul public Phase I announcements (new LNG facility, solar hydrogen plant, redundant Israel-Cyprus pipelines, Cyprus-Egypt-EU LNG export agreement); Aug gas-to-hydrogen R&D centres; Sep Energy Partnership Summit in Nicosia; Oct launch Energy Stability Fund; Nov naval/air/cyber protection agreements for energy sites; Dec binding commercial agreements with at least 5 companies and 5 countries.","x":[["Turkey","Would have to confront multiple hostile energy stakeholders rather than Cyprus alone; becomes 'publicly confused and hesitant'; learns of protections through anonymous briefings to correspondents who cover Turkey."],["France / Egypt","Joint drills for rapid protection of offshore platforms and LNG terminals, disguised as search-and-rescue."],["USA / UAE","Build a silent offshore cyber defence ring around rigs and terminals via private-sector cooperation."],["US Congress","Lobbied with the doctrine 'protect Cyprus gas = protect American energy investments'."],["Energy majors","Accept co-ownership of blocks, 25-year tax stability and seats on an Energy CEO Advisory Panel; lobby home governments."]],"b":["Any threat to Cypriot energy becomes a multilateral crisis, 'not just a Cyprus problem'","Turkey cannot single out Cyprus diplomatically, economically or militarily","Energy sector becomes 'an untouchable multinational network of co-owned sovereignty'","Future-proofing through hydrogen transition"],"r":["Chinese involvement in strategic systems (document cautions to keep full control of digital, cyber, grid and fuel systems)"],"m":["Offer China only non-strategic roles (LNG tanker construction, port machinery, wind turbine parts manufacturing)","Redundant pipeline and LNG routes","'Energy disruption insurance' backed by EU or US","Side letters insulating early investors from political risk"]},{"t":"Global 'Micro-Investment' Treaty Alliances ('Cyprus 1000' programme)","a":"Cyprus - Micro-Investment Alliance Taskforce (MIAT: Finance, Foreign Affairs, Commerce, Defence ministries plus external legal advisers); special investment envoys to 100 countries","c":"economic","s":"Cyprus signs hundreds of micro-scale investment treaties worth EUR 250,000 to EUR 5 million each with dozens of countries, SMEs, cooperatives, NGOs, universities, funds and diaspora investors, so that even the smallest attack on Cyprus harms thousands of stakeholders worldwide. Three treaty templates are used - Bilateral Micro-Investment Agreement (BMIA), Cooperative Joint Venture Pact (CJVP) and Multilateral Mini-Fund Consortium Agreement (MMFCA) - each with 'Sovereignty Trigger Clauses' that activate investor-state dispute settlement (WTO, ICC, ICSID) and disruption-retaliation clauses if Cyprus is attacked. A multilingual online investment gateway takes proposals; a 'Shield List' of investors is published instantly on attack to show 'who Turkey is hurting globally'; a 'Cyprus Global Micro-Investment Atlas' is distributed to all UN missions. Slogan: 'Own a Piece of Cyprus = Own a Stake in Peace'.","w":"2025: Jan launch 'Cyprus 1000' roadmap; Feb taskforce; Mar treaty templates; Apr quiet outreach to embassies and trade attaches; May open digital platform; Jun first 100 micro-treaties (Africa, Latin America, South Asia, Balkans); Jul medium multinationals; Aug media campaign 'Cyprus Belongs to the World'; Sep trade treaties with 10+ countries and 50 countries reached; Oct defence-linked micro projects (drones, cyber, logistics); Nov diaspora investment channels; Dec publish Global Investment Atlas.","x":[["Turkey","'Paralysed from attack' by overlapping diplomatic, financial and public backlash risks worldwide."],["Small and mid-size states","Join for visibility, development benefits, visa waivers, EU/Schengen gateway access and co-branding (e.g. 'Gambia-Cyprus AI Training Center')."],["G20 members","3-5 lobbied to mention 'protection of economic investments in vulnerable democracies' in summit statements."],["NGOs","Own micro-projects and run public pressure campaigns if Cyprus is attacked."],["India","Uses micro-investments as a backdoor for military supply-chain testbeds and an informal defence-logistics pivot into the Mediterranean."],["UAE / Israeli tech startups","Take micro-labs with full operational freedom plus private non-aggression clauses binding them to influence their governments for Cyprus."]],"b":["Cyprus becomes economically 'sticky' and 'omnipresent' worldwide","Backlash comes from thousands of economic stakeholders, not just governments","'Many small hooks make a net stronger than one rope'","Nested dependencies inside EU-US tech frameworks raise the cost of attack"],"r":[],"m":["All micro-investments logged on blockchain-backed cloud servers mirrored in Germany and Singapore so ownership is traceable in a crisis"]},{"t":"EU Rapid Response Special Forces & Naval Presence Expansion for Cyprus","a":"France, Greece, Italy, Romania, Spain; EU Military Staff, EDA, EEAS, ENISA; quiet US/NATO support","c":"security","s":"Permanently station a multinational EU deterrent in Cyprus: rotating special forces (France's Commandos Marine, Greece's Z' MAK, Italy's COMSUBIN, Romania's special forces), 2-4 naval vessels on continuous patrol, 2-3 transport aircraft (A400M or C-130) plus UAV squadrons, and a Nicosia-based EU Cyber Command Cell. Legal basis is bilateral and EU-wide Status of Forces Agreements and a Cypriot law recognising EU-led military responses under Article 42.7. A 'Joint Eastern Med Rapid Response Command' and a Cyprus-based multinational battalion make the isla     precedents: [
      { id: 'annan', scope: 'cy', name: 'Annan Plan referendums', year: '2004', outcome: 'failure', wiki: 'Annan Plan', cats: ['deal'],
        lesson: 'A comprehensive UN plan was approved by 65% of Turkish Cypriots and rejected by 76% of Greek Cypriots a week before EU accession. Security, property and the absence of any cost of voting no decided it: a deal has to be owned by both publics before the vote.' },
      { id: 'crans', scope: 'cy', name: 'Crans-Montana conference', year: '2017', outcome: 'failure', wiki: '2015–2017 Cyprus talks', cats: ['deal', 'security'],
        lesson: 'The closest the sides have come. It collapsed over guarantees and troops: Türkiye would not accept zero troops and no right of intervention from day one. Security is the chapter that must be solved, not postponed.' },
      { id: 'crossings', scope: 'cy', name: 'Opening of the crossing points', year: '2003', outcome: 'success', wiki: 'United Nations Buffer Zone in Cyprus', cats: ['societal'],
        lesson: 'After 29 years the line opened and millions of crossings followed without serious incident. Contact is safe and popular; on its own it did not produce a settlement.' },
      { id: 'greenline', scope: 'cy', name: 'Green Line Regulation', year: '2004', outcome: 'mixed', wiki: 'Green Line (Cyprus)', cats: ['economic'],
        lesson: 'Legal trade across the line exists but stays small because of standards, logistics and political reluctance on both sides. Economic bridges need active administration, not just permission.' },
      { id: 'cmp', scope: 'cy', name: 'Committee on Missing Persons', year: '1981–', outcome: 'success', wiki: 'Civilian casualties and displacements during the Cyprus conflict', cats: ['societal'],
        lesson: 'A bicommunal body under UN chairmanship has identified more than 1,000 missing people from both communities. Humanitarian cooperation insulated from politics can work for decades.' },
      { id: 'loizidou', scope: 'cy', name: 'Loizidou v. Turkey', year: '1996', outcome: 'success', wiki: 'Loizidou v. Turkey', cats: ['legal'],
        lesson: 'The European Court of Human Rights held Türkiye responsible for denying a Greek Cypriot owner access to her property; Ankara paid in 2003. Litigation fixes responsibility and has a price, but it did not return the property.' },
      { id: 'cyvtr', scope: 'cy', name: 'Cyprus v. Turkey, just satisfaction', year: '2014', outcome: 'mixed', wiki: 'Cyprus v. Turkey', cats: ['legal'],
        lesson: 'The Court awarded €90 million for the missing and the enclaved. It remains unpaid: judgments raise cost and reputation damage, but enforcement against a determined state is weak.' },
      { id: 'demopoulos', scope: 'cy', name: 'Demopoulos v. Turkey', year: '2010', outcome: 'mixed', wiki: 'Judiciary of Northern Cyprus', cats: ['legal'],
        lesson: 'The Court accepted the Immovable Property Commission in the north as a domestic remedy. Legal strategy can produce results the claimant did not intend.' },
      { id: 'udi', scope: 'cy', name: 'Unilateral declaration of independence', year: '1983', outcome: 'failure', wiki: 'Northern Cyprus', cats: ['diplomatic'],
        lesson: 'Security Council Resolution 541 declared it legally invalid; four decades on, only Türkiye recognises it. Unilateral status changes have not gained acceptance.' },
      { id: 'ots', scope: 'cy', name: 'Observer status at the Organization of Turkic States', year: '2022', outcome: 'mixed', wiki: 'Organization of Turkic States', cats: ['diplomatic'],
        lesson: 'Symbolic gains are available, but in 2025 Central Asian members reaffirmed the UN resolutions in a joint declaration with the EU. Recognition campaigns meet a ceiling.' },
      { id: 'varosha', scope: 'cy', name: 'Partial reopening of Varosha', year: '2020', outcome: 'failure', wiki: 'Varosha, Famagusta', cats: ['diplomatic'],
        lesson: 'Opening the beachfront drew Security Council condemnation and hardened Greek Cypriot opinion without improving Turkish Cypriot standing.' },
      { id: 'yavuz', scope: 'cy', name: 'Drillship stand-off in the EEZ', year: '2018–2020', outcome: 'mixed', wiki: 'Cyprus–Turkey maritime zones dispute', cats: ['energy'],
        lesson: 'Turkish warships blocked a drillship in 2018 and Turkish vessels drilled in waters claimed by Cyprus. EU sanctions were minimal; the pressure eased only when Ankara chose to de-escalate with the EU in 2021.' },
      { id: 'eusanc19', scope: 'cy', name: 'EU sanctions framework on drilling', year: '2019', outcome: 'mixed', wiki: 'Cyprus–Turkey maritime zones dispute', cats: ['legal', 'diplomatic'],
        lesson: 'The framework exists but only two individuals have been listed. Unanimity makes EU sanctions on Türkiye hard to obtain and easy to dilute.' },
      { id: 's300', scope: 'cy', name: 'S-300 missile crisis', year: '1997–1998', outcome: 'failure', wiki: 'Cypriot S-300 crisis', cats: ['security'],
        lesson: 'Cyprus ordered Russian air-defence missiles; Türkiye threatened to strike them; they ended up on Crete. Arms purchases that the stronger side reads as a change in the balance can provoke rather than deter.' },
      { id: 'itar', scope: 'cy', name: 'Lifting of US arms restrictions on Cyprus', year: '2020–2022', outcome: 'success', wiki: 'Cyprus–United States relations', cats: ['security'],
        lesson: 'Patient alignment — port access rules, financial reforms, legislation in Congress — ended a 1987 embargo. Standing with Washington can be built step by step.' },
      { id: 'embargo75', scope: 'cy', name: 'US arms embargo on Turkey', year: '1975–1978', outcome: 'failure', wiki: 'Turkey–United States relations', cats: ['security', 'legal'],
        lesson: 'Congress cut arms sales after the invasion. Türkiye closed US bases and did not withdraw; the embargo was lifted in three years. Blunt pressure without an exit ramp entrenched positions.' },
      { id: 'helsinki', scope: 'cy', name: 'Helsinki summit and earthquake diplomacy', year: '1999', outcome: 'success', wiki: 'Greek–Turkish earthquake diplomacy', cats: ['diplomatic', 'economic'],

    if (!m.hold && m.ps < 0.65) w.push('Uncertain execution: ' + pct(1 - m.ps) + ' chance it fails' + (m.fail.length ? ', which would shift ' + m.fail.map(function (f) { return esc(dim(f[0]).name) + ' ' + sgn(f[1], 0); }).join(', ') : '') + '.');
    if (m.src.cost >= 3) w.push('Significant political or financial cost to you (' + m.src.cost + '/10).');
    (p.vuln || []).slice(0, 3).forEach(function (l) { w.push(esc(l)); });
    r.replies.forEach(function (y) {
      var im = replyImpact(y), nm = '<b>' + esc(P(y.pid).name) + '</b>';
      if (y.chosen.m.hold) return;
      if (im > 0.3) o.push(nm + ' is likely (' + pct(y.chosen.p) + ') to answer with "' + esc(y.chosen.m.src.name) + '", worth ' + sgn(im) + ' to you.');
      else if (im < -0.3) t.push(nm + ' is likely (' + pct(y.chosen.p) + ') to answer with "' + esc(y.chosen.m.src.name) + '", costing you ' + sgn(im) + '.');
      y.ranked.slice(1, 3).forEach(function (k) {
        if (k.p < 0.15 || k.m.hold) return;
        var after = E.apply(C, y.before, k.m, S.used, 'exp'), d = E.utility(C, A.pid, after) - E.utility(C, A.pid, y.before);
        if (d < -1) t.push('Less likely (' + pct(k.p) + '), ' + nm + ' could instead choose "' + esc(k.m.src.name) + '" (' + sgn(d) + ' for you).');
        if (d > 1) o.push('Less likely (' + pct(k.p) + '), ' + nm + ' could instead choose "' + esc(k.m.src.name) + '" (' + sgn(d) + ' for you).');
      });
    });
    var unlocked = [];
    C.order.forEach(function (q) { C.byPlayer[q].forEach(function (k) { if (E.blocked(C, S, k) && !E.blocked(C, r.state, k)) unlocked.push(esc(P(q).short) + ': ' + esc(k.src.name)); }); });
    if (unlocked.length) o.push('Opens moves that are closed today — ' + unlocked.slice(0, 5).join('; ') + '.');
    var al = E.alignment(C, r.after, A.pid), al0 = E.alignment(C, S.x, A.pid);
    C.order.forEach(function (q) {
      if (q === A.pid) return;
      if (stance(al0[q]) !== 'ally' && stance(al[q]) === 'ally') o.push('<b>' + esc(P(q).name) + '</b> moves into alignment with you after this round.');
      if (stance(al0[q]) !== 'opp' && stance(al[q]) === 'opp') t.push('<b>' + esc(P(q).name) + '</b> moves into opposition after this round.');
      if (C.players[q].veto && E.utility(C, q, r.after) < E.utility(C, q, S.x) - 1) t.push('<b>' + esc(P(q).name) + '</b> can block any settlement and ends the round worse off (' + sgn(E.utility(C, q, r.after) - E.utility(C, q, S.x)) + ') — a defection risk.');
    });
    var st = C.di.stability, ds = r.after[st] - S.x[st];
    if (ds < -3) t.push('Stability falls by ' + Math.abs(ds).toFixed(0) + ' points; miscalculation becomes more likely.');
    if (ds > 3) o.push('Stability rises by ' + ds.toFixed(0) + ' points, widening everyone\'s room for compromise.');
    if (rec.rel > 0.3) o.push('Three rounds out, the line that starts here is worth ' + sgn(rec.rel, 2) + ' more to you than waiting.');
    if (rec.rel < -0.3) t.push('Three rounds out, the line that starts here leaves you ' + sgn(rec.rel, 2) + ' against waiting.');
    function ul(a, none) { return '<ul>' + (a.length ? a.slice(0, 7).map(function (x) { return '<li>' + x + '</li>'; }).join('') : '<li class="mute">' + none + '</li>') + '</ul>'; }
    return '<div class="swot"><div class="s"><h3>Strengths <small>yours, helpful</small></h3>' + ul(s, 'No particular strength in play.') + '</div><div class="w"><h3>Weaknesses <small>yours, harmful</small></h3>' + ul(w, 'No notable weakness exposed.') + '</div>' +
      '<div class="o"><h3>Opportunities <small>from others</small></h3>' + ul(o, 'No supportive reply predicted this round.') + '</div><div class="t"><h3>Threats <small>from others</small></h3>' + ul(t, 'No hostile reply predicted this round.') + '</div></div>';
  }

  function risks(rec) {
    var r = rec.first, m = rec.m, rows = [];
    function rate(p, im) { var s = p * Math.min(10, Math.abs(im)); return s > 2.2 ? ['High', 'bad'] : s > 0.8 ? ['Medium', 'warn'] : ['Low', 'good']; }
    if (!m.hold && m.ps < 1) {
      var im = E.utility(C, A.pid, E.apply(C, S.x, m, S.used, 'fail')) - E.utility(C, A.pid, E.apply(C, S.x, m, S.used, 'ok'));
      rows.push(['Your move fails to deliver', 1 - m.ps, im, m.src.mit || 'Prepare the ground first: line up partners and a fallback before committing publicly.']);
    }
    r.replies.forEach(function (y) {
      y.ranked.slice(0, 3).forEach(function (k) {
        if (k.m.hold || k.p < 0.12) return;
        var d = E.utility(C, A.pid, E.apply(C, y.before, k.m, S.used, 'exp')) - E.utility(C, A.pid, y.before);
        if (d < -0.8) rows.push([esc(P(y.pid).name) + ': ' + esc(k.m.src.name), k.p, d, k.m.src.counter || 'Raise the cost or lower the benefit of this reply before you move; keep a channel open to ' + esc(P(y.pid).name) + '.']);
      });
    });
    rows.sort(function (a, b) { return b[1] * Math.abs(b[2]) - a[1] * Math.abs(a[2]); });
    if (!rows.length) return '<p class="help">No material risk identified for this move in the coming round.</p>';
    return '<div class="tblwrap"><table><thead><tr><th>Risk</th><th>Likelihood</th><th>Impact on you</th><th>Rating</th><th>Mitigation</th></tr></thead><tbody>' + rows.slice(0, 8).map(function (x) {
      var rt = rate(x[1], x[2]);
      return '<tr><td>' + x[0] + '</td><td class="c">' + pct(x[1]) + '</td><td class="c bad">' + sgn(x[2]) + '</td><td class="c"><span class="tag ' + rt[1] + '">' + rt[0] + '</span></td><td>' + x[3] + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  }

  function lens(rec) {
    var r = rec.first, groups = {};

      var parts = groups[g].map(function (i) { var d = r.after[i] - S.x[i]; return Math.abs(d) < 0.5 ? null : esc(dim(i).name) + ' <b class="num">' + sgn(d, 0) + '</b> (to ' + Math.round(r.after[i]) + ')'; }).filter(Boolean);
      return '<tr><th>' + esc(g) + '</th><td>' + (parts.length ? parts.join('; ') : '<span class="mute">No material change</span>') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  }

  function matrix() {
    var opp = A.opp && A.opp !== A.pid ? A.opp : (A.pid === 'TR' ? 'ROC' : 'TR');
    var mx = E.matrix(C, S, A.pid, opp, 5);
    function isNe(i, j) { return mx.ne.some(function (n) { return n[0] === i && n[1] === j; }); }
    var h = '<label class="help">Against <select data-c="opp">' + C.order.filter(function (q) { return q !== A.pid; }).map(function (q) { return '<option value="' + q + '"' + (q === opp ? ' selected' : '') + '>' + esc(P(q).name) + '</option>'; }).join('') + '</select></label>' +
      '<div class="tblwrap" style="margin-top:8px"><table><thead><tr><th>' + esc(P(A.pid).short) + ' ↓ / ' + esc(P(opp).short) + ' →</th>' + mx.B.map(function (b) { return '<th>' + esc(b.src.name) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      mx.A.map(function (a, i) { return '<tr><th>' + esc(a.src.name) + '</th>' + mx.cells[i].map(function (c, j) { return '<td class="c' + (isNe(i, j) ? ' ne' : '') + '">' + sgn(c.a - mx.base.a) + ' / ' + sgn(c.b - mx.base.b) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
    h += '<p class="help">Each cell: your payoff change / theirs, if both play those moves and nobody else acts. ';

    if (mx.domA >= 0) h += 'Your dominant option: "' + esc(mx.A[mx.domA].src.name) + '" is at least as good whatever they do. ';
    if (mx.domB >= 0) h += 'Their dominant option: "' + esc(mx.B[mx.domB].src.name) + '".';

  function map() {
    var al = E.alignment(C, S.x, A.pid), W = 320, H = 220;

  function sens() {

    var s = cache.sens, top = C.moves[s.top], others = Object.keys(s.wins).filter(function (k) { return k !== s.top; }).sort(function (a, b) { return s.wins[b] - s.wins[a]; });
    var span = Math.max.apply(null, s.tornado.map(function (t) { return Math.max(Math.abs(t.lo - s.baseScore), Math.abs(t.hi - s.baseScore)); }).concat([0.5]));
